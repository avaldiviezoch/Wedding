<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fffdf8">
  <title>Antonio & Lucero</title>
  <link rel="preload" href="./video_entrada.mp4" as="video" type="video/mp4">
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fffdf8}
    #invite{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      border:0;
      background:#fffdf8;
      opacity:0;
      transition:opacity .12s ease;
    }
    #invite.ready{opacity:1}
    #tapGuard{
      position:fixed;
      inset:0;
      z-index:999999;
      background:transparent;
      cursor:pointer;
      touch-action:manipulation;
      -webkit-tap-highlight-color:transparent;
      pointer-events:none;
    }
    #tapGuard.ready{pointer-events:auto}
    @media (prefers-reduced-motion:reduce){#invite{transition:none!important}}
  </style>
</head>
<body>
  <iframe id="invite" src="./invitacion_6_base_final.html?v=20260830-entry-stable-1" title="Invitación Antonio y Lucero" allow="autoplay; fullscreen"></iframe>
  <div id="tapGuard" role="button" tabindex="0" aria-label="Abrir invitación"></div>
  <script>
  (() => {
    const frame = document.getElementById('invite');
    const guard = document.getElementById('tapGuard');
    let target = null;
    let preparing = false;

    function resolve() {
      try {
        const level1 = frame.contentDocument || frame.contentWindow.document;
        const inviteFrame = level1.getElementById('inviteFrame');
        if (!inviteFrame) return null;

        const level2 = inviteFrame.contentDocument || inviteFrame.contentWindow.document;
        const inv5 = level2.getElementById('inv5');
        if (!inv5) return null;

        const doc = inv5.contentDocument || inv5.contentWindow.document;
        const video = doc.getElementById('entryVideo');
        const entry = doc.getElementById('entryScreen');
        if (!video || !entry) return null;

        return { doc, video, entry };
      } catch (error) {
        return null;
      }
    }

    function configureVideo(current) {
      if (!current || current.video.dataset.inv6OuterPrepared === '1') return;
      const { doc, video } = current;

      video.dataset.inv6OuterPrepared = '1';
      video.controls = false;
      video.removeAttribute('controls');
      video.setAttribute('playsinline', '');
      video.setAttribute('webkit-playsinline', '');
      video.setAttribute('preload', 'auto');
      video.preload = 'auto';

      const saludoVideo = doc.getElementById('saludoVideo');
      if (saludoVideo) {
        saludoVideo.controls = false;
        saludoVideo.muted = true;
      }

      if (video.networkState === HTMLMediaElement.NETWORK_EMPTY) {
        try { video.load(); } catch (error) {}
      }
    }

    function revealWhenFrameReady(current) {
      if (!current) return false;
      const { video } = current;
      configureVideo(current);

      const reveal = () => {
        if (video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA) return;
        target = current;
        frame.classList.add('ready');
        guard.classList.add('ready');
      };

      if (video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) {
        reveal();
        return true;
      }

      if (video.dataset.inv6ReadyWatch !== '1') {
        video.dataset.inv6ReadyWatch = '1';
        video.addEventListener('loadeddata', reveal, { once:true });
        video.addEventListener('canplay', reveal, { once:true });
      }
      return false;
    }

    function unlockBackgroundMusic(doc) {
      const music = doc.getElementById('bgMusic');
      if (!music) return;
      try {
        music.currentTime = 0;
        music.volume = 0;
        const unlock = music.play();
        unlock?.catch?.(() => {});
      } catch (error) {}
    }

    function startFromTrustedTap(event) {
      event?.preventDefault?.();
      event?.stopPropagation?.();
      if (preparing) return;

      target = resolve();
      if (!target) return;
      configureVideo(target);

      const { doc, video } = target;
      if (video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA) return;

      preparing = true;
      video.controls = false;
      video.muted = false;
      video.volume = 1;

      const release = () => {
        preparing = false;
        guard.remove();
      };
      const retry = () => {
        preparing = false;
        guard.classList.add('ready');
      };

      video.addEventListener('playing', release, { once:true });
      video.addEventListener('error', retry, { once:true });

      try {
        const playPromise = video.play();
        unlockBackgroundMusic(doc);
        playPromise?.catch?.(retry);
      } catch (error) {
        retry();
      }
    }

    function scan() {
      const current = resolve();
      if (!current) return false;
      target = current;
      revealWhenFrameReady(current);
      return true;
    }

    frame.addEventListener('load', () => {
      let attempts = 0;
      const timer = setInterval(() => {
        attempts += 1;
        const found = scan();
        if ((found && frame.classList.contains('ready')) || attempts >= 120) {
          clearInterval(timer);
        }
      }, 100);
    });

    guard.addEventListener('pointerup', startFromTrustedTap, { passive:false });
    guard.addEventListener('click', event => {
      if (event.detail === 0) startFromTrustedTap(event);
    });
    guard.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') startFromTrustedTap(event);
    });
  })();
  </script>

  <script src="./timeline-type-fidelity.js?v=20260827-timeline-type-1"></script>
  <script src="./restore-agreed-gift.js?v=20260827-agreed-gift-owner-2"></script>
  <script src="./gift-green-underlay.js?v=20260828-green-panel-real-1"></script>
  <script>
  (() => {
    const outer = document.getElementById('invite');
    const STYLE_ID = 'inv6-music-real-seasons-title-fix';
    function apply() {
      try {
        const d1 = outer?.contentDocument || outer?.contentWindow.document;
        const f1 = d1?.getElementById('inviteFrame');
        const d2 = f1 ? (f1.contentDocument || f1.contentWindow.document) : null;
        const f2 = d2?.getElementById('inv5');
        const doc = f2 ? (f2.contentDocument || f2.contentWindow.document) : null;
        if (!doc?.head) return false;
        let style = doc.getElementById(STYLE_ID);
        if (!style) {
          style = doc.createElement('style');
          style.id = STYLE_ID;
          doc.head.appendChild(style);
        }
        style.textContent = `
          body .sat-inv6-music-free-host .mgd-native-success h3{
            font-family:'Inv6SeasonsReal',Georgia,'Times New Roman',serif!important;
            font-style:normal!important;
            font-weight:400!important;
          }
        `;
        return true;
      } catch (error) {
        return false;
      }
    }
    outer?.addEventListener('load', () => [150,400,800,1400,2400,4000,6500].forEach(ms => setTimeout(apply, ms)));
    [0,300,900,1800,3200,5200].forEach(ms => setTimeout(apply, ms));
  })();
  </script>
</body>
</html>
