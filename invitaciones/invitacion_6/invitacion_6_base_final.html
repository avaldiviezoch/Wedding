<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <meta name="theme-color" content="#fffdf8">
  <title>Antonio & Lucero</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fffdf8}
    body{min-height:100svh}
    #inviteFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fffdf8;opacity:0;transition:opacity .18s ease}
    #inviteFrame.ready{opacity:1}
    #introGuard{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#fffdf8;overflow:hidden;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
    #introPreview{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fffdf8;pointer-events:none;opacity:0!important;visibility:hidden!important}
    #introPoster{position:absolute;inset:0;display:block;width:100%;height:100%;background:#fffdf8;opacity:0;pointer-events:none}
    #introGuard.frame-ready #introPoster{opacity:1}
    #introGuard.hide{opacity:0;pointer-events:none;transition:opacity .16s ease}
    #introHint{position:absolute;left:50%;bottom:max(28px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:10px 18px;border-radius:999px;background:rgba(255,253,248,.86);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#3d4335;font:600 15px/1.2 Georgia,'Times New Roman',serif;white-space:nowrap;box-shadow:0 6px 24px rgba(61,67,53,.12);opacity:0;transition:opacity .25s ease}
    #introGuard.frame-ready #introHint{opacity:0}
    #introGuard.fallback:not(.frame-ready) #introHint{opacity:1}
    #introPreview::-webkit-media-controls,#introPreview::-webkit-media-controls-enclosure,#introPreview::-webkit-media-controls-panel,#introPreview::-webkit-media-controls-start-playback-button,#introPreview::-webkit-media-controls-overlay-play-button{display:none!important;-webkit-appearance:none!important;opacity:0!important;pointer-events:none!important}

    @media (min-width:768px) and (max-width:1023px){
      body{background:#fffdf8}
      #inviteFrame,#introGuard{left:50%;right:auto;width:min(760px,100vw);transform:translateX(-50%)}
    }
    @media (min-width:1024px){
      body{background:#fffdf8}
      body::before,body::after{content:"";position:fixed;top:0;bottom:0;width:max(0px,calc((100vw - 760px)/2));pointer-events:none;z-index:0;background:#fffdf8}
      #inviteFrame,#introGuard{left:50%;right:auto;top:0;bottom:0;width:min(760px,calc(100vw - 96px));height:100%;transform:translateX(-50%);border-left:1px solid rgba(91,82,70,.10);border-right:1px solid rgba(91,82,70,.10);box-shadow:0 0 44px rgba(65,54,43,.13)}
      #introGuard{background:#fffdf8}
      #introHint{bottom:max(34px,env(safe-area-inset-bottom))}
    }
    @media (min-width:1440px){#inviteFrame,#introGuard{width:780px}}
    @media (prefers-reduced-motion:reduce){#inviteFrame,#introGuard{transition:none!important}}
  </style>
</head>
<body>
  <iframe id="inviteFrame" src="./invitacion_5.html?v=20260819-2520-inv5-music-fields1" title="Invitación Antonio y Lucero" allow="autoplay; fullscreen"></iframe>
  <div id="introGuard" role="button" tabindex="0" aria-label="Toca para entrar a la invitación">
    <video id="introPreview" autoplay muted playsinline webkit-playsinline preload="auto" disablepictureinpicture aria-hidden="true">
      <source src="./video_entrada.mp4#t=0.001" type="video/mp4">
    </video>
    <canvas id="introPoster" aria-hidden="true"></canvas>
    <div id="introHint">Toca para entrar</div>
  </div>
<script src="./effects_5.js?v=20260821-inv6-textos-contador-1"></script>
<script src="./inv6_layout_fix.js?v=20260823-gap1"></script>
<script src="./inv6_between_text.js?v=20260823-card-inv1-2"></script>
<script src="./inv6_torn_paper_message.js?v=20260823-torn-wide-small1"></script>
<script src="./inv6_remove_between_paper_location.js?v=20260823-map-button-inv2-final-2"></script>
<script src="./inv6_correcta_ultimos_gifs.js?v=20260826-merge93-final"></script>
<script>
(()=>{
  const frame=document.getElementById('inviteFrame');
  const guard=document.getElementById('introGuard');
  const preview=document.getElementById('introPreview');
  const poster=document.getElementById('introPoster');
  const ctx=poster.getContext('2d',{alpha:false});
  let captured=false,childVideo=null,childEntry=null;

  const localAssets=new Set([
    'sake_binks.mp3','video_entrada.mp4','video_de_saludo_2.mp4','fecha_regresiva_2.png',
    'mano_que_viene_de_la_izquierda.png','mano_que_viene_de_la_derecha.png','marco_de_fotos_2.png',
    'ubicacion_local_2.png','fiesta_chopper_2.gif','itinerario_2.png','dress_code_2.png',
    'confirmar invitacion_2.gif','musica_2.png','invitacion_confirmacion_2.png','regalo_2.gif',
    'te_esperamos_2.gif','brook.gif'
  ]);

  function localizeAssets(doc){
    const changedMedia=new Set();
    doc.querySelectorAll('[src]').forEach(el=>{
      const raw=el.getAttribute('src')||'';
      if(!raw||raw.startsWith('data:')||raw.startsWith('blob:')) return;
      let clean=raw.split('#')[0].split('?')[0];
      try{clean=decodeURIComponent(clean);}catch(e){}
      const name=clean.substring(clean.lastIndexOf('/')+1);
      if(!localAssets.has(name)) return;
      const next='./'+encodeURI(name).replace(/#/g,'%23');
      if(raw!==next){
        el.setAttribute('src',next);
        if(el.tagName==='VIDEO'||el.tagName==='AUDIO'||el.tagName==='SOURCE') changedMedia.add(el.closest('video,audio')||el);
      }
    });
    changedMedia.forEach(media=>{try{media.load?.();}catch(e){}});
  }

  function getTitleCandidates(doc){
    return [...new Set(doc.querySelectorAll([
      'section h2','.section-title','.photo-story-title','.final-title','.location-title',
      '.dresscode-title','.inv5-dress-code','.rsvp-title','.faq-title','.gift-title',
      '.gift-stage-title','.music-title','.confirmation-title','.questions-title',
      '.itinerary-title','.itinerario-title','.timeline-title'
    ].join(',')))];
  }

  function normalizeSectionTitleSizes(doc){
    const reference=doc.querySelector('.photo-story-title');
    if(!reference) return false;
    const size=doc.defaultView.getComputedStyle(reference).fontSize;
    if(!size) return false;
    getTitleCandidates(doc).forEach(el=>{
      const text=(el.textContent||'').trim().toLowerCase();
      const isProgramming=el.closest('#itinerarySection,.itinerary-section,[aria-label*="Itinerario"],[aria-label*="itinerario"]')||text==='nuestro día'||text==='nuestro dia'||text.includes('programación')||text.includes('programacion');
      if(isProgramming) return;
      el.style.setProperty('font-size',size,'important');
    });
    return true;
  }

  function sizePoster(){
    const dpr=Math.min(window.devicePixelRatio||1,2);
    const cssW=Math.max(1,guard.clientWidth||innerWidth);
    const cssH=Math.max(1,guard.clientHeight||innerHeight);
    const w=Math.max(1,Math.round(cssW*dpr)),h=Math.max(1,Math.round(cssH*dpr));
    if(poster.width!==w||poster.height!==h){poster.width=w;poster.height=h;}
    return {w,h};
  }

  function drawCoverFrame(){
    if(captured||preview.readyState<2||!preview.videoWidth||!preview.videoHeight) return false;
    try{
      const {w,h}=sizePoster(),vw=preview.videoWidth,vh=preview.videoHeight;
      const scale=Math.max(w/vw,h/vh),dw=vw*scale,dh=vh*scale;
      ctx.fillStyle='#fffdf8';ctx.fillRect(0,0,w,h);ctx.drawImage(preview,(w-dw)/2,(h-dh)/2,dw,dh);
      captured=true;guard.classList.add('frame-ready');guard.classList.remove('fallback');preview.pause();return true;
    }catch(e){return false;}
  }

  function preparePreview(){
    preview.muted=true;preview.defaultMuted=true;
    preview.setAttribute('muted','');preview.setAttribute('playsinline','');preview.setAttribute('webkit-playsinline','');
    try{preview.currentTime=.001;}catch(e){}
    const p=preview.play();
    if(p&&p.then)p.then(()=>{'requestVideoFrameCallback'in preview?preview.requestVideoFrameCallback(drawCoverFrame):setTimeout(drawCoverFrame,80)}).catch(()=>setTimeout(drawCoverFrame,120));
  }

  ['loadeddata','canplay','seeked'].forEach(ev=>preview.addEventListener(ev,()=>setTimeout(drawCoverFrame,0)));
  preview.addEventListener('loadedmetadata',()=>{try{preview.currentTime=.001;}catch(e){}},{once:true});
  preview.addEventListener('error',()=>guard.classList.add('fallback'),{once:true});
  setTimeout(()=>{if(!captured&&!drawCoverFrame())guard.classList.add('fallback')},1800);

  function applyInv6(doc){
    normalizeSectionTitleSizes(doc);
    window.inv5ApplyVisualEffects?.(doc);
    window.inv6ApplyLayoutFix?.(doc);
    window.inv6ApplyBetweenText?.(doc);
    window.inv6ApplyTornPaperMessage?.(doc);
    window.inv6RemoveBetweenPaperAndLocation?.(doc);
  }

  function releaseGuard(){
    if(!guard?.isConnected)return;
    guard.classList.add('hide');
    setTimeout(()=>guard.remove(),180);
  }

  function bindRobustEntry(doc){
    if(!childEntry||!childVideo||childEntry.dataset.inv6RobustEntryBound) return;
    childEntry.dataset.inv6RobustEntryBound='1';

    const robustStart=(event)=>{
      event.preventDefault?.();
      event.stopImmediatePropagation?.();
      if(childVideo.dataset.inv6PlayPending==='1') return;

      const bgMusic=doc.getElementById('bgMusic');
      const saludoVideo=doc.getElementById('saludoVideo');
      childVideo.controls=false;
      childVideo.muted=false;
      childVideo.volume=1;
      childVideo.setAttribute('playsinline','');
      childVideo.setAttribute('webkit-playsinline','');
      if(saludoVideo){saludoVideo.controls=false;saludoVideo.muted=true;}

      if(bgMusic){
        try{
          bgMusic.currentTime=0;
          bgMusic.volume=0;
          const audioPromise=bgMusic.play();
          if(audioPromise&&audioPromise.catch) audioPromise.catch(()=>{});
        }catch(e){}
      }

      childVideo.dataset.inv6PlayPending='1';
      try{
        const playPromise=childVideo.play();
        if(playPromise&&playPromise.then){
          playPromise.then(()=>{
            childVideo.dataset.inv6PlayPending='0';
            releaseGuard();
          }).catch(()=>{
            childVideo.dataset.inv6PlayPending='0';
          });
        }else{
          childVideo.dataset.inv6PlayPending='0';
          releaseGuard();
        }
      }catch(e){
        childVideo.dataset.inv6PlayPending='0';
      }
    };

    childEntry.addEventListener('touchstart',robustStart,{capture:true,passive:false});
    childEntry.addEventListener('click',robustStart,true);
    childEntry.addEventListener('keydown',event=>{
      if(event.key==='Enter'||event.key===' ') robustStart(event);
    },true);
  }

  function resolveChild(){
    try{
      const wrapperDoc=frame.contentDocument||frame.contentWindow.document;
      const inner=wrapperDoc.getElementById('inv5');
      if(!inner) return false;
      const doc=inner.contentDocument||inner.contentWindow.document;
      localizeAssets(doc);
      [0,220,700,1400].forEach(delay=>setTimeout(()=>applyInv6(doc),delay));
      if(doc.fonts?.ready) doc.fonts.ready.then(()=>applyInv6(doc)).catch(()=>{});
      childEntry=doc.getElementById('entryScreen');
      childVideo=doc.getElementById('entryVideo');
      if(!childVideo||!childEntry) return false;
      childVideo.setAttribute('playsinline','');childVideo.setAttribute('webkit-playsinline','');childVideo.removeAttribute('controls');childVideo.controls=false;childVideo.preload='auto';
      const hideNative=doc.createElement('style');
      hideNative.id='inv5-hide-native-video-ui';
      hideNative.textContent='#entryVideo::-webkit-media-controls,#entryVideo::-webkit-media-controls-enclosure,#entryVideo::-webkit-media-controls-panel,#entryVideo::-webkit-media-controls-start-playback-button,#entryVideo::-webkit-media-controls-overlay-play-button{display:none!important;-webkit-appearance:none!important;opacity:0!important;pointer-events:none!important}';
      doc.getElementById(hideNative.id)?.remove();doc.head.appendChild(hideNative);
      bindRobustEntry(doc);
      if(!childVideo.dataset.inv6DirectEntryBound){
        childVideo.dataset.inv6DirectEntryBound='1';
        childVideo.addEventListener('playing',releaseGuard,{once:true});
      }
      guard.style.setProperty('pointer-events','none','important');
      return true;
    }catch(e){return false;}
  }

  frame.addEventListener('load',()=>{
    frame.classList.add('ready');
    let tries=0;
    const timer=setInterval(()=>{tries++;if(resolveChild()||tries>40)clearInterval(timer)},100);
  });

  function prepareDirectEntry(){
    if(!resolveChild())guard.classList.add('fallback');
  }

  guard.addEventListener('click',prepareDirectEntry);
  guard.addEventListener('touchend',prepareDirectEntry,{passive:true});
  guard.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();prepareDirectEntry()}});
  window.addEventListener('resize',()=>{if(captured){captured=false;drawCoverFrame()}});
  preparePreview();
})();
</script>
</body>
</html>
