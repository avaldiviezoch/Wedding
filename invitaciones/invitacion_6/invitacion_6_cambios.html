<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <meta name="theme-color" content="#fffdf8">
  <title>Antonio & Lucero - Invitación 6 cambios</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fffdf8}
    #preview{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fffdf8}
  </style>
</head>
<body>
  <iframe id="preview" title="Invitación 6 con cambios" allow="autoplay; fullscreen"></iframe>
  <script>
  (async()=>{
    const preview=document.getElementById('preview');
    const safeReplacement=`<script>
    (()=>{
      const STYLE_ID='inv6-paper-to-location-style';
      const GREEN_BLOCK_ID='inv6-green-location-from-inv1';

      function apply(doc){
        if(!doc) return;

        // NO borrar handsSection ni photoStorySection: deben permanecer visibles.
        // Solo se elimina la segunda tarjeta verde duplicada.
        doc.getElementById(GREEN_BLOCK_ID)?.remove();

        let style=doc.getElementById(STYLE_ID);
        if(!style){
          style=doc.createElement('style');
          style.id=STYLE_ID;
          doc.head.appendChild(style);
        }
        style.textContent=\`
          #inv6TornPaperMessage + .location-section{
            margin-top:clamp(22px,4.5vw,36px) !important;
          }
          .location-section .church-overlay-content{
            padding-top:128px !important;
            padding-bottom:78px !important;
          }
          .location-section .church-kicker{
            margin-top:10px !important;
            margin-bottom:20px !important;
            position:relative !important;
            z-index:3 !important;
          }
          .location-section .church-note{
            margin-bottom:0 !important;
          }
          .hands-caption{
            font-family:'Cormorant Garamond',serif !important;
            font-weight:600 !important;
          }
          @media(max-width:540px){
            #inv6TornPaperMessage + .location-section{
              margin-top:24px !important;
            }
            .location-section .church-overlay-content{
              padding-top:104px !important;
              padding-bottom:68px !important;
            }
            .location-section .church-kicker{
              margin-top:12px !important;
              margin-bottom:18px !important;
            }
          }
        \`;

        if(!doc.getElementById('inv6-preview-cormorant-font')){
          const link=doc.createElement('link');
          link.id='inv6-preview-cormorant-font';
          link.rel='stylesheet';
          link.href='https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&display=swap';
          doc.head.appendChild(link);
        }

        // El botón original de ubicación se conserva: no se elimina ningún enlace de mapas.
      }

      window.inv6RemoveBetweenPaperAndLocation=apply;
    })();
    <\/script>`;

    try{
      const response=await fetch('./index.html?v=20260823-preview-restore-2',{cache:'no-store'});
      let html=await response.text();
      const openTag='<scr'+'ipt src="./inv6_remove_between_paper_location.js';
      const closeTag='</scr'+'ipt>';
      const start=html.indexOf(openTag);
      if(start>=0){
        const end=html.indexOf(closeTag,start);
        if(end>=0){
          html=html.slice(0,start)+safeReplacement+html.slice(end+closeTag.length);
        }
      }
      html=html.replace('<head>','<head><base href="./">');
      preview.srcdoc=html;
    }catch(e){
      preview.src='./index.html?v=20260823-preview-fallback-2';
    }
  })();
  </script>
</body>
</html>
