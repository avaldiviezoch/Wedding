<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fbeed8">
  <title>Antonio & Lucero | Invitación 3</title>
  <style>
    html,body{margin:0;min-height:100%;background:#fbeed8}
    .loader{position:fixed;inset:0;display:grid;place-items:center;background:#fbeed8;color:#355a35;font:600 12px/1.4 system-ui,sans-serif;letter-spacing:.08em;text-align:center;padding:24px}
  </style>
</head>
<body>
<div class="loader" id="loader">Preparando invitación…</div>
<script>
(async()=>{
  try{
    const response=await fetch('invitacion_3_base.html',{cache:'force-cache'});
    if(!response.ok) throw new Error('No se pudo cargar invitacion_3_base.html');
    let html=await response.text();

    html=html
      .replaceAll('https://avaldiviezoch.github.io/Wedding/','./')
      .replaceAll('https://raw.githubusercontent.com/avaldiviezoch/Wedding/refs/heads/main/','./')
      .replaceAll('https://raw.githubusercontent.com/avaldiviezoch/Wedding/main/','./')
      .replaceAll('preload="auto"','preload="metadata"')
      .replace("gif.src = cleanSrc + '?once=' + Date.now();","gif.src = cleanSrc + '?v=20260818-local';");

    const extraStyle=`<style id="faqExtraEffects">
      .faq-illustration.faq-illustration-dj,.faq-illustration.faq-illustration-gift{position:relative;display:flex;justify-content:center;align-items:center;padding-top:8px;overflow:visible}
      .faq-illustration.faq-illustration-dj img,.faq-illustration.faq-illustration-gift img{animation:faqFloat 4.8s ease-in-out infinite;transform-origin:center;will-change:transform}
      .faq-illustration.faq-illustration-dj::before,.faq-illustration.faq-illustration-dj::after{position:absolute;top:8%;font-size:clamp(22px,4vw,30px);color:#477957;opacity:.75;pointer-events:none}
      .faq-illustration.faq-illustration-dj::before{content:'♪';left:12%;animation:musicNote 3.2s ease-in-out infinite}
      .faq-illustration.faq-illustration-dj::after{content:'♫';right:12%;animation:musicNote 3.6s ease-in-out infinite .4s}
      @keyframes faqFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
      @keyframes musicNote{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-12px);opacity:.95}}
    </style>`;
    html=html.replace('</head>',extraStyle+'\n</head>');

    const giftAnswer='<div class="faq-answer">Sí. Podremos recibir regalos físicos durante la recepción y también encontrarás opciones de Yape o transferencia en la sección de regalos.</div>';
    if(html.includes(giftAnswer) && !html.includes('faq-illustration-gift')){
      html=html.replace(giftAnswer,giftAnswer+'<div class="faq-illustration faq-illustration-gift"><img src="pic_preguntas_3_5.png" alt="Ilustración para regalos" loading="lazy"></div>');
    }
    const musicAnswer='<div class="faq-answer">Las sugerencias se recibirán mediante el formulario antes de la boda. Durante la celebración, el DJ no recibirá pedidos en vivo.</div>';
    if(html.includes(musicAnswer) && !html.includes('faq-illustration-dj')){
      html=html.replace(musicAnswer,musicAnswer+'<div class="faq-illustration faq-illustration-dj"><img src="pic_preguntas_3_4.png" alt="Novios con consola de DJ" loading="lazy"></div>');
    }

    document.open();
    document.write(html);
    document.close();
  }catch(error){
    console.error('Invitación 3:',error);
    document.getElementById('loader').textContent='No se pudo cargar la invitación. Recarga la página para volver a intentar.';
  }
})();
</script>
</body>
</html>
