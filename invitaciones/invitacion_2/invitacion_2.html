<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f1e5da">
  <title>Antonio & Lucero | Invitación 2</title>
  <style>
    html,body{margin:0;min-height:100%;background:#f1e5da}
    .loader{position:fixed;inset:0;display:grid;place-items:center;background:#f1e5da;color:#52634f;font:600 12px/1.4 system-ui,sans-serif;letter-spacing:.08em;text-align:center;padding:24px}
  </style>
</head>
<body>
  <div class="loader" id="loader">Preparando invitación…</div>
  <script>
  (async()=>{
    try{
      const response=await fetch('invitacion_2_base.html',{cache:'force-cache'});
      if(!response.ok) throw new Error('No se pudo cargar invitacion_2_base.html');
      let html=await response.text();

      html=html
        .replaceAll('https://raw.githubusercontent.com/avaldiviezoch/Wedding/refs/heads/main/','./')
        .replaceAll('https://raw.githubusercontent.com/avaldiviezoch/Wedding/main/','./')
        .replaceAll('https://avaldiviezoch.github.io/Wedding/','./')
        .replaceAll('assets/invitacion_1/','assets/')
        .replaceAll('https://raw.githubusercontent.com/avaldiviezoch/Wedding/main/sobre_enviar_confir_2.png','invitacion_confirmacion_2.png')
        .replaceAll('./sobre_enviar_confir_2.png','invitacion_confirmacion_2.png')
        .replaceAll('preload="auto"','preload="metadata"');

      html=html.replace(/const entryVideoCandidates\s*=\s*\[[\s\S]*?\];/,
        "const entryVideoCandidates = ['video_entrada.mp4'];");
      html=html.replace(/const coverImageCandidates\s*=\s*\[[\s\S]*?\];/,
        "const coverImageCandidates = ['invitacion_confirmacion_2.png'];");

      document.open();
      document.write(html);
      document.close();
    }catch(error){
      console.error('Invitación 2:',error);
      document.getElementById('loader').textContent='No se pudo cargar la invitación. Recarga la página para volver a intentar.';
    }
  })();
  </script>
</body>
</html>
