<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#fffdf8">
<title>Antonio & Lucero</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fffdf8}body{min-height:100svh}
#inviteFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fffdf8;opacity:0;transition:opacity .16s ease}#inviteFrame.ready{opacity:1}
#introGuard{position:fixed;inset:0;z-index:9999;display:none;background:#fffdf8;overflow:hidden;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#introGuard.active{display:block}#introGuard.hide{opacity:0;pointer-events:none;transition:opacity .16s ease}
#introPreview{position:absolute;inset:0;width:1px;height:1px;opacity:0!important;visibility:hidden!important;pointer-events:none}
#introPoster{position:absolute;inset:0;width:100%;height:100%;display:block;background:#fffdf8;pointer-events:none}
#introPreview::-webkit-media-controls,#introPreview::-webkit-media-controls-enclosure,#introPreview::-webkit-media-controls-panel,#introPreview::-webkit-media-controls-start-playback-button,#introPreview::-webkit-media-controls-overlay-play-button{display:none!important;-webkit-appearance:none!important;opacity:0!important;pointer-events:none!important}
@media(prefers-reduced-motion:reduce){#inviteFrame,#introGuard{transition:none!important}}
</style>
</head>
<body>
<iframe id="inviteFrame" src="./invitacion_1.html?v=20260818-1740" title="Invitación 1 Antonio y Lucero" allow="autoplay; fullscreen"></iframe>
<div id="introGuard" role="button" tabindex="0" aria-label="Entrar a la invitación"><video id="introPreview" muted playsinline webkit-playsinline preload="auto" disablepictureinpicture aria-hidden="true"></video><canvas id="introPoster" aria-hidden="true"></canvas></div>
<script>
(()=>{
const frame=document.getElementById('inviteFrame'),guard=document.getElementById('introGuard'),preview=document.getElementById('introPreview'),poster=document.getElementById('introPoster'),ctx=poster.getContext('2d',{alpha:false});
let armed=false,prepared=false,entry=null,childVideo=null;
const FOLDER='/invitaciones/invitacion_1/';
const toLocal=(raw)=>{if(!raw)return raw;const v=String(raw).trim();if(!v||/^(data:|blob:|#|mailto:|tel:|javascript:)/i.test(v))return raw;let clean=v.split('#')[0].split('?')[0];try{clean=decodeURIComponent(clean)}catch(e){}if(clean.includes(FOLDER)){const tail=clean.split(FOLDER)[1];return tail?'./'+tail:raw}const sameRepo=/raw\.githubusercontent\.com\/avaldiviezoch\/Wedding\/|avaldiviezoch\.github\.io\/Wedding\//i.test(clean)||clean.startsWith('/Wedding/');if(!sameRepo)return raw;let path=clean;try{path=new URL(clean,location.href).pathname}catch(e){}try{path=decodeURIComponent(path)}catch(e){}const ai=path.lastIndexOf('/assets/');if(ai>=0)return './assets/'+path.slice(ai+8);const name=path.slice(path.lastIndexOf('/')+1);return name?'./'+name:raw};
const cssLocal=(value)=>String(value||'').replace(/url\((['"]?)([^'"\)]+)\1\)/gi,(m,q,u)=>{const n=toLocal(u);return n===u?m:`url(${q}${n}${q})`});
const localizeNode=(el)=>{if(!el||el.nodeType!==1)return;['src','href','poster','data-src'].forEach(a=>{if(!el.hasAttribute(a))return;const old=el.getAttribute(a),next=toLocal(old);if(next!==old)el.setAttribute(a,next)});if(el.hasAttribute('srcset')){const old=el.getAttribute('srcset'),next=old.split(',').map(part=>{const p=part.trim().split(/\s+/),u=toLocal(p[0]);return [u,...p.slice(1)].join(' ')}).join(', ');if(next!==old)el.setAttribute('srcset',next)}if(el.hasAttribute('style')){const old=el.getAttribute('style'),next=cssLocal(old);if(next!==old)el.setAttribute('style',next)}if(el.tagName==='STYLE'&&el.textContent){const next=cssLocal(el.textContent);if(next!==el.textContent)el.textContent=next}if(el.tagName==='IFRAME'){const run=()=>{try{localizeDocument(el.contentDocument||el.contentWindow.document)}catch(e){}};el.addEventListener('load',run,{once:false});run()}};
const localizeDocument=(d)=>{if(!d||!d.documentElement)return;localizeNode(d.documentElement);d.querySelectorAll('[src],[href],[poster],[data-src],[srcset],[style],style,iframe').forEach(localizeNode);d.querySelectorAll('video,audio').forEach(m=>{try{if([...m.querySelectorAll('source')].some(s=>s.getAttribute('src')?.startsWith('./')))m.load()}catch(e){}});if(!d.__invLocalAssetsObserver){d.__invLocalAssetsObserver=new MutationObserver(ms=>ms.forEach(m=>{if(m.type==='attributes')localizeNode(m.target);m.addedNodes?.forEach(n=>{if(n.nodeType===1){localizeNode(n);n.querySelectorAll?.('[src],[href],[poster],[data-src],[srcset],[style],style,iframe').forEach(localizeNode)}})}));d.__invLocalAssetsObserver.observe(d.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['src','href','poster','data-src','srcset','style']})}};
const size=()=>{const d=Math.min(devicePixelRatio||1,2),w=Math.max(1,Math.round(innerWidth*d)),h=Math.max(1,Math.round(innerHeight*d));poster.width=w;poster.height=h;return{w,h}};
const draw=()=>{if(prepared||preview.readyState<2||!preview.videoWidth)return false;try{const{w,h}=size(),vw=preview.videoWidth,vh=preview.videoHeight,s=Math.max(w/vw,h/vh),dw=vw*s,dh=vh*s;ctx.fillStyle='#fffdf8';ctx.fillRect(0,0,w,h);ctx.drawImage(preview,(w-dw)/2,(h-dh)/2,dw,dh);preview.pause();prepared=true;guard.classList.add('active');return true}catch(e){return false}};
const prime=(src)=>{if(!src)return;preview.src=src+(src.includes('#')?'':'#t=0.001');preview.muted=true;preview.defaultMuted=true;preview.setAttribute('muted','');preview.setAttribute('playsinline','');preview.setAttribute('webkit-playsinline','');preview.load();const p=preview.play();if(p&&p.then)p.then(()=>{'requestVideoFrameCallback'in preview?preview.requestVideoFrameCallback(draw):setTimeout(draw,40)}).catch(()=>{});};
const inspect=()=>{try{const d=frame.contentDocument||frame.contentWindow.document;localizeDocument(d);entry=d.querySelector('#entryScreen,.intro,#intro,[data-intro]');childVideo=entry?.querySelector('video')||d.querySelector('#entryVideo,.intro-video');if(!childVideo){frame.classList.add('ready');return true}childVideo.controls=false;childVideo.setAttribute('playsinline','');childVideo.setAttribute('webkit-playsinline','');const src=childVideo.currentSrc||childVideo.querySelector('source')?.src||childVideo.src;prime(src);frame.classList.add('ready');return true}catch(e){return false}};
frame.addEventListener('load',()=>{let n=0,t=setInterval(()=>{n++;if(inspect()||n>40)clearInterval(t)},100)});
['loadeddata','canplay','seeked'].forEach(ev=>preview.addEventListener(ev,draw,{once:true}));
const enter=()=>{if(armed)return;armed=true;try{preview.pause();if(entry)entry.click();else if(childVideo)childVideo.click();guard.classList.add('hide');setTimeout(()=>guard.remove(),200)}catch(e){armed=false;guard.classList.remove('hide')}};
guard.addEventListener('click',enter);guard.addEventListener('touchend',e=>{e.preventDefault();enter()},{passive:false});guard.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();enter()}});
setTimeout(()=>{if(!frame.classList.contains('ready'))frame.classList.add('ready')},2500);
})();
</script>
</body>
</html>
