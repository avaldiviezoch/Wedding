<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f1e5da">
  <title>Antonio & Lucero</title>
  <link rel="preload" href="./video_entrada.mp4" as="video" type="video/mp4" fetchpriority="high">
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f1e5da}
    #invite{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f1e5da}
    #entryPreview,#entryPoster{
      position:fixed;inset:0;width:100%;height:100%;z-index:999998;
      object-fit:cover;background:#f1e5da;pointer-events:none
    }
    #entryPreview{display:block}
    #entryPoster{display:none}
    #entryPoster.ready{display:block}
    #entryPreview.hide,#entryPoster.hide{opacity:0;visibility:hidden}
    #entryLoader{
      position:fixed;
      inset:0;
      z-index:999999;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:14px;
      background:#f1e5da;
      color:#59634f;
      opacity:1;
      visibility:visible;
      transition:opacity .22s ease,visibility 0s linear .22s;
      cursor:wait;
      touch-action:none;
      -webkit-tap-highlight-color:transparent;
    }
    #entryLoader.hide{opacity:0;visibility:hidden;pointer-events:none}
    #entryLoaderSpinner{
      width:30px;
      height:30px;
      border:2px solid rgba(89,99,79,.20);
      border-top-color:#59634f;
      border-radius:50%;
      animation:entrySpin .8s linear infinite;
    }
    #entryLoaderText{
      font:600 14px/1.2 Georgia,'Times New Roman',serif;
      letter-spacing:.08em;
    }
    @keyframes entrySpin{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){
      #entryLoader{transition:none}
      #entryLoaderSpinner{animation:none}
    }
  </style>
</head>
<body>
  <iframe id="invite" src="./invitacion_6_base_final.html?v=20260831-cache-chain-1" title="Invitación Antonio y Lucero" allow="autoplay; fullscreen"></iframe>

  <video id="entryPreview" autoplay muted playsinline webkit-playsinline preload="auto" disablepictureinpicture aria-hidden="true">
    <source src="./video_entrada.mp4#t=0.001" type="video/mp4">
  </video>
  <canvas id="entryPoster" aria-hidden="true"></canvas>

  <div id="entryLoader" role="status" aria-live="polite" aria-label="Cargando invitación">
    <div id="entryLoaderSpinner" aria-hidden="true"></div>
    <div id="entryLoaderText">Cargando…</div>
  </div>

  <script>
  (() => {
    const outer = document.getElementById('invite');
    const loader = document.getElementById('entryLoader');
    const preview = document.getElementById('entryPreview');
    const poster = document.getElementById('entryPoster');
    const ctx = poster?.getContext('2d', { alpha:false });
    const HARD_LIMIT = 2500;
    let loaderFinished = false;
    let posterCaptured = false;
    let handoffDone = false;

    function sizePoster() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = Math.max(1, Math.round(innerWidth * dpr));
      const h = Math.max(1, Math.round(innerHeight * dpr));
      if (poster.width !== w || poster.height !== h) {
        poster.width = w;
        poster.height = h;
      }
      return { w, h };
    }

    function capturePreviewFrame() {
      if (posterCaptured || !preview || preview.readyState < 2 || !preview.videoWidth || !preview.videoHeight || !ctx) return false;
      try {
        const { w, h } = sizePoster();
        const vw = preview.videoWidth;
        const vh = preview.videoHeight;
        const scale = Math.max(w / vw, h / vh);
        const dw = vw * scale;
        const dh = vh * scale;
        ctx.fillStyle = '#f1e5da';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(preview, (w - dw) / 2, (h - dh) / 2, dw, dh);
        posterCaptured = true;
        poster.classList.add('ready');
        try { preview.pause(); } catch (e) {}
        return true;
      } catch (e) {
        return false;
      }
    }

    function preparePreview() {
      if (!preview) return;
      preview.muted = true;
      preview.defaultMuted = true;
      preview.setAttribute('muted','');
      preview.setAttribute('playsinline','');
      preview.setAttribute('webkit-playsinline','');
      try { preview.currentTime = 0.001; } catch (e) {}
      const p = preview.play();
      if (p && p.then) {
        p.then(() => {
          if ('requestVideoFrameCallback' in preview) {
            preview.requestVideoFrameCallback(() => capturePreviewFrame());
          } else {
            setTimeout(capturePreviewFrame, 60);
          }
        }).catch(() => {});
      }
    }

    ['loadeddata','canplay','seeked'].forEach(ev => preview?.addEventListener(ev, () => setTimeout(capturePreviewFrame, 0)));
    preview?.addEventListener('loadedmetadata', () => {
      try { preview.currentTime = 0.001; } catch (e) {}
    }, { once:true });

    function finishLoader() {
      if (loaderFinished) return;
      loaderFinished = true;
      loader?.classList.add('hide');
      setTimeout(() => loader?.remove(), 260);
    }

    function getCriticalVideo() {
      try {
        const d1 = outer?.contentDocument || outer?.contentWindow.document;
        const f1 = d1?.getElementById('inviteFrame');
        if (!f1) return null;
        const d2 = f1.contentDocument || f1.contentWindow.document;
        const f2 = d2?.getElementById('inv5');
        if (!f2) return null;
        const doc = f2.contentDocument || f2.contentWindow.document;
        const video = doc?.getElementById('entryVideo');
        const entry = doc?.getElementById('entryScreen');
        if (!video || !entry) return null;
        return { video, entry };
      } catch (error) {
        return null;
      }
    }

    function actualVideoHasFrame() {
      const current = getCriticalVideo();
      if (!current) return false;
      const { video } = current;
      return video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA && video.videoWidth > 0 && video.videoHeight > 0;
    }

    function handoffToActualVideo() {
      if (handoffDone || !actualVideoHasFrame()) return false;
      handoffDone = true;
      requestAnimationFrame(() => requestAnimationFrame(() => {
        preview?.classList.add('hide');
        poster?.classList.add('hide');
        setTimeout(() => {
          preview?.remove();
          poster?.remove();
        }, 260);
      }));
      return true;
    }

    function probe() {
      handoffToActualVideo();
      if (!handoffDone) setTimeout(probe, 80);
    }

    preparePreview();
    probe();

    window.setTimeout(() => {
      capturePreviewFrame();
      finishLoader();
    }, HARD_LIMIT);

    window.addEventListener('resize', () => {
      if (!posterCaptured || handoffDone) return;
      posterCaptured = false;
      capturePreviewFrame();
    });
  })();
  </script>

  <script>
  (() => {
    const outer = document.getElementById('invite');
    const STYLE_ID = 'inv7-photo-edge-align';
    function applyPhotoEdgeAlign() {
      try {
        const d1 = outer?.contentDocument || outer?.contentWindow.document;
        const f1 = d1?.getElementById('inviteFrame');
        const d2 = f1 ? (f1.contentDocument || f1.contentWindow.document) : null;
        const f2 = d2?.getElementById('inv5');
        const doc = f2 ? (f2.contentDocument || f2.contentWindow.document) : null;
        if (!doc?.head) return false;
        let style = doc.getElementById(STYLE_ID);
        if (!style) {
          style = doc.createElement('style');
          style.id = STYLE_ID;
          doc.head.appendChild(style);
        }
        style.textContent = `
          #sat-inv6-photo-collage .photo-1{left:0!important}
          #sat-inv6-photo-collage .photo-2{right:0!important}
        `;
        return true;
      } catch (error) {
        return false;
      }
    }
    outer?.addEventListener('load', () => [150,400,800,1400,2400,4000,6500].forEach(ms => setTimeout(applyPhotoEdgeAlign, ms)));
    [0,300,900,1800,3200,5200].forEach(ms => setTimeout(applyPhotoEdgeAlign, ms));
  })();
  </script>
  <script>
  (() => {
    const outer = document.getElementById('invite');
    const STYLE_ID = 'inv6-music-real-seasons-title-fix';

      try {
        const d1 = outer?.contentDocument || outer?.contentWindow.document;
        const f1 = d1?.getElementById('inviteFrame');

        const f2 = d2?.getElementById('inv5');
        const doc = f2 ? (f2.contentDocument || f2.contentWindow.document) : null;
        if (!doc?.head) return false;
        let style = doc.getElementById(STYLE_ID);
        if (!style) {
          style=doc.createElement('style');
          style.id=STYLE_ID;
          doc.head.appendChild(style);
        }
        style.textContent = `
          body .sat-inv6-music-free-host .mgd-native-success h3{
            font-family:'Inv6SeasonsReal',Georgia,'Times New Roman',serif!important;
            font-style:normal!important;
            font-weight:400!important;
          }
        `;
        return true;
      } catch (error) {
        return false;
      }
    }
    outer?.addEventListener('load', () => [150,400,800,1400,2400,4000,6500].forEach(ms => setTimeout(apply, ms)));
    [0,300,900,1800,3200,5200].forEach(ms => setTimeout(apply, ms));
  })();
