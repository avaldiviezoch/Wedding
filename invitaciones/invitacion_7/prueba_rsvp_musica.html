<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f1e5da">
  <title>Invitación 5 · prueba RSVP + Música</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f1e5da}
    #invitationTest{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#f1e5da}
  </style>
</head>
<body>
  <iframe id="invitationTest" src="./invitacion_5.html?v=20260817-2251" title="Invitación 5 · prueba RSVP y Música" allow="autoplay; clipboard-write; geolocation"></iframe>

  <script>
    const RSVP_TOKEN='b00bca195e8e448eab17557bb6b4ffc480ad2e95c0db4c85bca52a62ff60b499';
    const outerFrame=document.getElementById('invitationTest');

    function installNativeForms(baseFrame){
      const doc=baseFrame?.contentDocument;
      if(!doc||doc.documentElement.dataset.mgdSharedFormsInstalled==='1')return;

      const rsvpPanel=doc.getElementById('rsvp-panel');
      const musicPanel=doc.getElementById('music-request-panel');
      if(!rsvpPanel||!musicPanel)return;

      doc.documentElement.dataset.mgdSharedFormsInstalled='1';

      rsvpPanel.innerHTML=`
        <div
          data-mgd-rsvp-token="${RSVP_TOKEN}"
          style="--mgd-accent:#6d7559;--mgd-text:#5d6552;--mgd-muted:#747b70;--mgd-surface:rgba(255,255,255,.42);padding:4px 2px 8px"
        ></div>`;

      musicPanel.innerHTML=`
        <div
          data-mgd-music-token="${RSVP_TOKEN}"
          style="--mgd-accent:#6d7559;--mgd-text:#5d6552;--mgd-muted:#747b70;--mgd-surface:rgba(255,255,255,.42);padding:4px 2px 8px"
        ></div>`;

      const legacyRsvpSuccess=doc.getElementById('rsvp-success');
      const legacyMusicSuccess=doc.getElementById('music-success');
      if(legacyRsvpSuccess)legacyRsvpSuccess.style.display='none';
      if(legacyMusicSuccess)legacyMusicSuccess.style.display='none';

      const style=doc.createElement('style');
      style.id='mgdSharedFormsTestStyles';
      style.textContent=`
        #rsvp-panel.open,#music-request-panel.open{max-height:1800px !important;overflow:visible !important;padding-bottom:12px !important}
        #rsvp-panel .mgd-native-widget-v2,#music-request-panel .mgd-native-widget-v2{width:100% !important}
        #music-request-panel .mgd-v2-form,#rsvp-panel .mgd-v2-form{padding:14px 12px 6px}
      `;
      doc.head.appendChild(style);

      const script=doc.createElement('script');
      script.type='module';
      script.src='../../app_integral/js/modules/invitados/rsvp-native-widget-v2.js?v=20260817-2315-shared-session1';
      doc.head.appendChild(script);

      console.info('Invitación 5: RSVP y Música conectados a Mi Gran Día con el mismo token/sesión.');
    }

    function connectInnerInvitation(){
      const wrapperDoc=outerFrame.contentDocument;
      const baseFrame=wrapperDoc?.getElementById('inv5');
      if(!baseFrame)return;

      const tryInstall=()=>{
        try{
          installNativeForms(baseFrame);
        }catch(error){
          console.error('No se pudieron instalar los formularios nativos:',error);
        }
      };

      if(baseFrame.contentDocument?.readyState==='complete'){
        setTimeout(tryInstall,80);
      }
      baseFrame.addEventListener('load',()=>setTimeout(tryInstall,80));
    }

    outerFrame.addEventListener('load',()=>setTimeout(connectInnerInvitation,80));
  </script>
</body>
</html>
