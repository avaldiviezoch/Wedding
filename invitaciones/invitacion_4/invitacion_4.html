<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f4eedf">
  <title>Antonio & Lucero | Invitación 4</title>
  <style>
    html,body{margin:0;min-height:100%;background:#f4eedf}
    .loader{position:fixed;inset:0;display:grid;place-items:center;background:#f4eedf;color:#46533c;font:600 12px/1.4 system-ui,sans-serif;letter-spacing:.08em;text-align:center;padding:24px}
  </style>
</head>
<body>
<div class="loader" id="loader">Preparando invitación…</div>
<script>
(async()=>{
  try{
    const response=await fetch('invitacion_4_base.html',{cache:'force-cache'});
    if(!response.ok) throw new Error('No se pudo cargar invitacion_4_base.html');
    let html=await response.text();

    html=html
      .replaceAll('https://raw.githubusercontent.com/avaldiviezoch/Wedding/refs/heads/main/','./')
      .replaceAll('https://raw.githubusercontent.com/avaldiviezoch/Wedding/main/','./')
      .replaceAll('https://avaldiviezoch.github.io/Wedding/','./')
      .replaceAll('preload="auto"','preload="metadata"');

    const halo=`<style id="haloGlobalInvitacion4">
      .invitacion p,.invitacion h1,.invitacion h2,.invitacion h3,.invitacion h4,.invitacion h5,.invitacion h6,
      .invitacion span:not(.muestra-color),.invitacion time,.invitacion label,.invitacion summary,.invitacion a,
      .invitacion button,.invitacion input,.invitacion textarea,.invitacion select,.invitacion option,
      .invitacion .nos-casamos,.invitacion .nombres,.invitacion .corazon,.invitacion .frase,.invitacion .fecha-etiqueta,
      .invitacion .fecha,.invitacion .etiqueta-seccion,.invitacion .titulo-primer-fondo,.invitacion .texto-primer-fondo,
      .invitacion .contador-titulo,.invitacion .contador-numero,.invitacion .contador-texto,.invitacion .detalle-inferior,
      .invitacion .titulo-ubicacion,.invitacion .titulo-itinerario,.invitacion .titulo-adicional,.invitacion .subtitulo-adicional,
      .invitacion .texto-adicional,.invitacion .dresscode-intro,.invitacion .dresscode-colors-title,.invitacion .dresscode-note-final,
      .invitacion .aviso-musica,.invitacion .nota-itinerario,.invitacion .texto-ubicacion,.invitacion .hora-itinerario,
      .invitacion .nombre-itinerario,.invitacion .historia-transicion-titulo,.invitacion .historia-transicion-subtitulo{
        text-shadow:0 0 2px rgba(244,238,223,.98),0 0 6px rgba(244,238,223,.92),0 1px 10px rgba(244,238,223,.72)!important
      }
    </style>`;
    html=html.replace('</head>',halo+'\n</head>');

    document.open();
    document.write(html);
    document.close();
  }catch(error){
    console.error('Invitación 4:',error);
    document.getElementById('loader').textContent='No se pudo cargar la invitación. Recarga la página para volver a intentar.';
  }
})();
</script>
</body>
</html>
