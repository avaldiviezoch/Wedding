<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Antonio & Lucero</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f1e5da}
    #inv5{display:block;width:100%;height:100%;border:0;background:#f1e5da;opacity:0;transition:opacity .15s ease}
    #inv5.ready{opacity:1}
  </style>
</head>
<body>
  <iframe id="inv5" src="./invitacion_5_base.html?v=20260817-1639" title="Invitación 5" allow="autoplay; fullscreen"></iframe>
  <script>
    const frame=document.getElementById('inv5');
    frame.addEventListener('load',()=>{
      try{
        const doc=frame.contentDocument||frame.contentWindow.document;

        const img=doc.querySelector('.countdown-image');
        if(img){img.src='./imagen_de_fecha_5.png?v=20260816-2';img.removeAttribute('srcset')}

        const programacionImg=[...doc.querySelectorAll('img')].find(el=>decodeURIComponent(el.getAttribute('src')||'').includes('itinerario_2.png'));
        if(programacionImg){
          programacionImg.src='./programacion_5.gif?v=20260816-1';
          programacionImg.removeAttribute('srcset');
          programacionImg.style.transform='translateY(14px)';
        }

        const nuestroDia=[...doc.querySelectorAll('h1,h2,h3,.section-title,.itinerary-title,.itinerario-title,.timeline-title')].find(el=>{
          const t=(el.textContent||'').trim().toLowerCase();
          return t==='nuestro día'||t==='nuestro dia';
        });
        if(nuestroDia) nuestroDia.style.transform='translateY(14px)';

        const shiftedSchedule=[
          '02:00 PM –<br>03:00 PM','03:00 PM –<br>04:00 PM','04:00 PM –<br>05:00 PM',
          '05:00 PM –<br>05:30 PM','05:30 PM –<br>06:30 PM','06:30 PM –<br>07:00 PM','07:00 PM<br>en adelante'
        ];
        [...doc.querySelectorAll('.itinerary-time')].forEach((el,i)=>{if(shiftedSchedule[i])el.innerHTML=shiftedSchedule[i]});

        // DRESS CODE INVITACIÓN 5
        const dressSection=[...doc.querySelectorAll('section')].find(section=>{
          const t=(section.textContent||'').toLowerCase();
          return t.includes('dress code')||t.includes('elegante')||t.includes('formal');
        });
        if(dressSection){
          const colors=['#f3e3e4','#f3acad','#ed9b8c','#e7b181','#f2e4ab','#d5c1da','#c7dbfa','#bfc7be','#acb580'];
          dressSection.id='dressCodeSection';
          dressSection.className='inv5-dress-section';
          dressSection.innerHTML=`
            <div class="inv5-dress-card">
              <div class="inv5-dress-content">
                <div class="inv5-dress-heading">
                  <span class="inv5-dress-code">Dress Code</span>
                  <span class="inv5-dress-formal">Formal</span>
                </div>
                <p class="inv5-dress-subtitle">Colores de primavera en tonos pasteles</p>
                <div class="inv5-dress-palette" aria-label="Paleta de colores sugerida">
                  ${colors.map(color=>`<span class="inv5-dress-dot" style="background:${color}"></span>`).join('')}
                </div>
                <p class="inv5-dress-white">Reservaremos el color blanco para los novios.</p>
                <p class="inv5-dress-text inv5-dress-lower-1"><em>Elige un look que te haga sentir cómodo, auténtico y listo para disfrutar cada momento.</em></p>
                <p class="inv5-dress-text inv5-dress-last"><strong><em>Tu mejor accesorio será una sonrisa y muchas ganas de celebrar.</em></strong></p>
              </div>
            </div>`;
        }

        const rsvpSection=doc.querySelector('#rsvpSection');
        if(rsvpSection){
          const rsvpCard=rsvpSection.querySelector('.final-card');
          if(rsvpCard&&!rsvpCard.querySelector('.inv5-rsvp-title')){
            const title=doc.createElement('h2');
            title.className='final-title inv5-rsvp-title';
            title.textContent='Confirmar tu asistencia';
            rsvpCard.insertBefore(title,rsvpCard.firstChild);
          }
        }

        const musicSection=doc.querySelector('#musicSection');
        if(musicSection){
          const musicText=musicSection.querySelector('.music-copy .final-text');
          const musicWarning=musicSection.querySelector('.music-warning');
          if(musicText) musicText.textContent='¿Hay una canción que te gustaría escuchar durante la recepción o la fiesta? Déjanos tu pedido aquí para considerarlo con anticipación.';
          if(musicWarning) musicWarning.textContent='El DJ no aceptará pedidos musicales durante la celebración, así que este es tu momento para compartirnos tu canción.';
          const musicName=musicSection.querySelector('#musicGuestName');
          const musicNameWrap=musicName?.closest('label,.music-field-wrap,.field-wrap,.form-group');
          if(musicNameWrap) musicNameWrap.remove(); else if(musicName) musicName.remove();
        }

        // PREGUNTAS INVITACIÓN 5 — imagen propia + efecto tipo estacionamiento
        [...doc.querySelectorAll('details.faq-item')].forEach(item=>{
          const summary=item.querySelector('summary');
          const answer=item.querySelector('.faq-answer');
          if(!summary)return;

          const question=(summary.textContent||'').trim().toLowerCase();

          if(question.includes('hasta cuándo puedo confirmar mi asistencia')||question.includes('hasta cuando puedo confirmar mi asistencia')){
            summary.textContent='¿Hasta qué fecha puedo confirmar mi asistencia?';
            if(answer)answer.textContent='Por favor, confirma tu asistencia hasta el 15 de octubre.';
          }

          if(question.includes('podemos llevar un regalo')||question.includes('puedo dejar un regalo')){
            summary.textContent='¿Puedo informar de alguna alergia o restricción alimentaria?';
            if(answer)answer.textContent='Sí, es muy importante por la comida que se repartirá y los bocaditos.';
          }

          if(question.includes('solicitar canciones')||question.includes('música')||question.includes('musica')||question.includes('dj')){
            item.remove();
            return;
          }

          const finalQuestion=(summary.textContent||'').trim().toLowerCase();
          let faqImage='';
          let faqAlt='';

          if(finalQuestion.includes('estacionamiento')){
            faqImage='./pic_preguntas_5_1.png?v=20260817-1633';
            faqAlt='Ilustración de estacionamiento';
          }else if(finalQuestion.includes('alergia')||finalQuestion.includes('restricción')||finalQuestion.includes('restriccion')){
            faqImage='./pic_preguntas_5_2.png?v=20260817-1633';
            faqAlt='Ilustración de alergias o restricciones alimentarias';
          }else if(finalQuestion.includes('confirmar')||finalQuestion.includes('asistencia')){
            faqImage='./pic_preguntas_5_3.png?v=20260817-1633';
            faqAlt='Ilustración de fecha de confirmación';
          }else if((finalQuestion.includes('ceremonia')&&finalQuestion.includes('recepción'))||finalQuestion.includes('mismo lugar')){
            faqImage='./pic_preguntas_5_4.png?v=20260817-1633';
            faqAlt='Ilustración de ceremonia y recepción en el mismo lugar';
          }

          if(faqImage){
            item.classList.add('inv5-animated-faq');
            item.querySelectorAll('.faq-illustration,.inv5-faq-illustration').forEach(el=>el.remove());

            const illustration=doc.createElement('div');
            illustration.className='faq-illustration inv5-faq-illustration';

            const faqImg=doc.createElement('img');
            faqImg.src=faqImage;
            faqImg.alt=faqAlt;
            faqImg.loading='lazy';
            faqImg.decoding='async';
            faqImg.onerror=()=>faqImg.classList.add('media-error');

            illustration.appendChild(faqImg);
            item.appendChild(illustration);
          }
        });

        const finalCard=doc.querySelector('#esperamosSection .final-card');
        if(finalCard){
          finalCard.querySelector('.te-esperamos-gif')?.remove();
          finalCard.querySelector('.wait-message')?.remove();
          finalCard.querySelector('.wait-signature')?.remove();
          finalCard.querySelector('.wait-date')?.remove();
          const title=finalCard.querySelector('.final-title');
          const brook=doc.createElement('img');
          brook.className='te-esperamos-gif brook-final-gif';
          brook.src='https://raw.githubusercontent.com/avaldiviezoch/Wedding/main/invitaciones/invitacion_1/brook.gif?v=20260816-1728';
          brook.alt='Brook';brook.loading='eager';brook.decoding='async';
          if(title)title.insertAdjacentElement('afterend',brook);else finalCard.appendChild(brook);
        }

        const style=doc.createElement('style');
        style.id='inv5-amsterdam-four';
        style.textContent=`
          @font-face{font-family:'Amsterdam Four';src:url('./Amsterdam%20Four_ttf%20400.ttf') format('truetype');font-weight:400;font-style:normal;font-display:swap}

          /* Títulos principales */
          h1,h2,h3,.section-title,.photo-story-title,.rsvp-title,.faq-title,.gift-title,.music-title,.dress-title,.location-title,.itinerary-title,.confirmation-title,.questions-title,[class*="section-title"],[class*="-title"]{font-family:'Amsterdam Four',cursive !important;font-weight:400 !important}

          /* Tipografía secundaria uniforme */
          body,p,li,a,label,input,textarea,select,button,summary,small,
          .final-text,.faq-answer,.music-warning,.gift-hint,.regalo-hint,.tap-text,
          .photo-story-subtitle,.countdown-subtitle,.countdown-text,
          .itinerary-time,.itinerary-content p,.schedule-intro,
          .church-main-copy,.church-address,.church-note,
          .location-text,.location-copy,.gift-text,.regalo-text,
          .rsvp-copy,.music-copy,.final-copy,.wait-message,.wait-signature,.wait-date,
          .inv5-dress-subtitle,.inv5-dress-white,.inv5-dress-text{
            font-family:Georgia,'Times New Roman',serif !important;
          }
          input::placeholder,textarea::placeholder{font-family:Georgia,'Times New Roman',serif !important}

          /* Quitar líneas separadoras */
          hr,.divider,.separator,.section-divider,.line-divider,.section-line,
          [class*="divider"],[class*="separator"]{
            display:none !important;
            border:0 !important;
            height:0 !important;
            min-height:0 !important;
            background:transparent !important;
            box-shadow:none !important;
          }
          hr::before,hr::after,.divider::before,.divider::after,.separator::before,.separator::after,
          .section-divider::before,.section-divider::after,.line-divider::before,.line-divider::after,
          .section-line::before,.section-line::after{
            display:none !important;
            content:none !important;
          }

          /* FAQ INVITACIÓN 5 — mismo efecto aprobado del estacionamiento */
          .inv5-faq-illustration{
            padding:8px 0 20px !important;
            display:flex !important;
            justify-content:center !important;
            align-items:center !important;
            background:transparent !important;
            border:0 !important;
            box-shadow:none !important;
            will-change:transform,opacity;
            transform-origin:center center;
          }
          .inv5-faq-illustration img{
            display:block !important;
            width:min(100%,250px) !important;
            max-width:250px !important;
            height:auto !important;
            margin:0 auto !important;
            object-fit:contain !important;
            background:transparent !important;
            border:0 !important;
            border-radius:0 !important;
            box-shadow:none !important;
            transform-origin:50% 80%;
            will-change:transform;
          }
          .inv5-animated-faq:not([open]) .inv5-faq-illustration{
            opacity:0;
            transform:translateY(14px) scale(.97);
          }
          .inv5-animated-faq[open] .inv5-faq-illustration{
            animation:inv5FaqPicIn .68s cubic-bezier(.22,.86,.28,1.12) both;
          }
          .inv5-animated-faq[open] .inv5-faq-illustration img{
            animation:inv5FaqPicIdle 4.4s ease-in-out .72s infinite;
          }
          .inv5-faq-illustration img.media-error{display:none !important}
          @keyframes inv5FaqPicIn{
            0%{opacity:0;transform:translateY(17px) scale(.97) rotate(1.8deg)}
            70%{opacity:1;transform:translateY(-2px) scale(1.01) rotate(-.7deg)}
            100%{opacity:1;transform:translateY(0) scale(1) rotate(0)}
          }
          @keyframes inv5FaqPicIdle{
            0%,100%{transform:translateY(0) rotate(-1deg)}
            50%{transform:translateY(-4px) rotate(1deg)}
          }
          @media(prefers-reduced-motion:reduce){
            .inv5-faq-illustration,.inv5-faq-illustration img{
              animation:none !important;
              opacity:1 !important;
              transform:none !important;
            }
          }

          .photo-story-kicker{margin-bottom:14px !important}
          .photo-story-title{margin-top:4px !important;margin-bottom:20px !important;line-height:1.18 !important}
          .photo-story-subtitle{margin-top:8px !important;line-height:1.5 !important}
          .itinerary-title,.itinerario-title,.timeline-title,[class*="itinerario"] h2,[class*="itinerary"] h2{margin-bottom:24px !important;line-height:1.18 !important}
          .timeline-wrap,.itinerario-wrap,.itinerary-wrap,.timeline-content{margin-top:10px !important}
          .gift-title,.regalo-title,[class*="gift"] h2,[class*="regalo"] h2{margin-bottom:20px !important;line-height:1.22 !important}
          .gift-hint,.regalo-hint,.tap-text,[class*="gift"] .tap-text,[class*="regalo"] .tap-text{margin-top:10px !important;line-height:1.45 !important}

          #itinerarySection,.itinerary-section,[class*="itinerary-section"],[class*="itinerario-section"]{padding-bottom:62px !important;margin-bottom:34px !important;overflow:visible !important}

          #dressCodeSection.inv5-dress-section{margin:10px auto 8px !important;padding:0 !important;position:relative !important;z-index:1 !important;background:transparent !important;overflow:visible !important;width:100% !important}
          .inv5-dress-card{position:relative;width:120%;max-width:none;aspect-ratio:911/1727;min-height:0;margin-left:-10%;margin-right:-10%;background:url('./fondo_dress_code_5.png?v=20260816-2004') center/100% 100% no-repeat;display:flex;align-items:flex-start;justify-content:center}
          .inv5-dress-content{width:62%;margin:0 auto;padding:42% 6px 8%;text-align:center;color:#5f6652;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;transform:translateY(76px)}
          .inv5-dress-heading{margin:0 0 18px;line-height:1;text-align:center;width:100%}
          .inv5-dress-code{display:block;font-family:'Amsterdam Four',cursive !important;font-weight:400 !important;font-size:clamp(25px,5.3vw,41px) !important;line-height:1 !important;color:#5f6652 !important;text-align:center}
          .inv5-dress-formal{display:block;margin-top:4px;font-family:Georgia,'Times New Roman',serif !important;font-size:clamp(30px,5.8vw,46px) !important;font-weight:400 !important;font-style:italic !important;line-height:1 !important;letter-spacing:.01em;color:#595548 !important;text-align:center}
          .inv5-dress-subtitle{margin:0 0 18px;font-size:clamp(13px,2.5vw,17px);line-height:1.3;color:#66695a;text-align:center}
          .inv5-dress-palette{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin:0 auto 22px;max-width:520px}
          .inv5-dress-dot{width:42px;height:26px;border-radius:7px;border:1px solid rgba(48,56,39,.08);box-shadow:0 4px 10px rgba(48,56,39,.08);flex:0 0 auto;transform:rotate(-3deg)}
          .inv5-dress-dot:nth-child(even){transform:rotate(3deg)}
          .inv5-dress-white{max-width:270px;margin:0 auto 22px;font-size:clamp(13px,2.4vw,16px);line-height:1.35;font-weight:600;color:#5f6652;text-align:center}
          .inv5-dress-text{max-width:280px;margin:0 auto;font-size:clamp(12px,2.2vw,15px);line-height:1.42;color:#626757;text-align:center}
          .inv5-dress-lower-1{margin-top:0;margin-bottom:20px}
          .inv5-dress-last{margin-top:0;margin-bottom:0}

          #rsvpSection .inv5-rsvp-title{font-family:'Amsterdam Four',cursive !important;font-size:clamp(38px,8vw,58px) !important;line-height:1.15 !important;margin:0 auto 18px !important;text-align:center !important}
          #esperamosSection{padding-top:18px !important}
          #esperamosSection .final-card{min-height:235px !important;padding:24px 18px 22px !important;border-radius:24% 24% 22px 22px / 9% 9% 22px 22px !important}
          #esperamosSection .brook-final-gif{display:block !important;width:min(31%,140px) !important;max-width:140px !important;height:auto !important;margin:12px auto 0 !important;object-fit:contain !important}

          @media(max-width:540px){
            #itinerarySection,.itinerary-section,[class*="itinerary-section"],[class*="itinerario-section"]{padding-bottom:70px !important;margin-bottom:42px !important}
            #dressCodeSection.inv5-dress-section{margin-top:12px !important;padding:0 !important;overflow:visible !important}
            .inv5-dress-card{width:124%;max-width:none;margin-left:-12%;margin-right:-12%;align-items:flex-start;justify-content:center}
            .inv5-dress-content{width:61%;padding:41% 4px 8%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;transform:translateY(76px)}
            .inv5-dress-heading{margin-bottom:16px}
            .inv5-dress-code{font-size:31px !important}
            .inv5-dress-formal{font-size:34px !important}
            .inv5-dress-subtitle{font-size:13px;margin-bottom:16px}
            .inv5-dress-palette{gap:10px;margin-bottom:20px}
            .inv5-dress-dot{width:36px;height:24px;border-radius:7px}
            .inv5-dress-white{font-size:13px;max-width:245px;margin-bottom:20px}
            .inv5-dress-text{font-size:12px;line-height:1.38;max-width:250px}
            .inv5-dress-lower-1{margin-bottom:18px}
            .inv5-dress-last{margin-top:0}
            .inv5-faq-illustration img{width:min(100%,250px) !important;max-width:250px !important}
            #rsvpSection .inv5-rsvp-title{font-size:clamp(34px,10vw,48px) !important;margin-bottom:14px !important}
            #esperamosSection{padding-top:16px !important}
            #esperamosSection .final-card{min-height:215px !important;padding:22px 16px 20px !important;border-radius:20% 20% 20px 20px / 8% 8% 20px 20px !important}
            #esperamosSection .brook-final-gif{width:min(31%,112px) !important;max-width:112px !important;margin-top:10px !important}
          }
        `;
        doc.getElementById('inv5-amsterdam-four')?.remove();
        doc.head.appendChild(style);
      }catch(e){console.warn('No se pudieron aplicar los ajustes de Invitación 5',e)}
      frame.classList.add('ready');
    });
  </script>
</body>
</html>
