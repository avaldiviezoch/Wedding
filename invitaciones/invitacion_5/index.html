<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <meta name="theme-color" content="#f1e5da">
  <title>Antonio & Lucero</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f1e5da}
    body{min-height:100svh}
    #inviteFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f1e5da;opacity:0;transition:opacity .18s ease}
    #inviteFrame.ready{opacity:1}
    #introGuard{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#f1e5da;overflow:hidden;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
    #introPreview{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#f1e5da;pointer-events:none;opacity:0!important;visibility:hidden!important}
    #introPoster{position:absolute;inset:0;display:block;width:100%;height:100%;background:#f1e5da;opacity:0;pointer-events:none}
    #introGuard.frame-ready #introPoster{opacity:1}
    #introGuard.hide{opacity:0;pointer-events:none;transition:opacity .16s ease}
    #introHint{position:absolute;left:50%;bottom:max(28px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:10px 18px;border-radius:999px;background:rgba(241,229,218,.86);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#3d4335;font:600 15px/1.2 Georgia,'Times New Roman',serif;white-space:nowrap;box-shadow:0 6px 24px rgba(61,67,53,.12);opacity:0;transition:opacity .25s ease}
    #introGuard.frame-ready #introHint{opacity:0}
    #introGuard.fallback:not(.frame-ready) #introHint{opacity:1}

    /* Nunca mostrar controles ni iconos nativos del navegador. */
    #introPreview::-webkit-media-controls,
    #introPreview::-webkit-media-controls-enclosure,
    #introPreview::-webkit-media-controls-panel,
    #introPreview::-webkit-media-controls-start-playback-button,
    #introPreview::-webkit-media-controls-overlay-play-button{display:none!important;-webkit-appearance:none!important;opacity:0!important;pointer-events:none!important}

    @media (prefers-reduced-motion:reduce){#inviteFrame,#introGuard{transition:none!important}}
  </style>
</head>
<body>
  <iframe id="inviteFrame" src="./invitacion_5.html?v=20260818-0724" title="Invitación Antonio y Lucero" allow="autoplay; fullscreen"></iframe>

  <div id="introGuard" role="button" tabindex="0" aria-label="Toca para entrar a la invitación">
    <video id="introPreview" autoplay muted playsinline webkit-playsinline preload="auto" disablepictureinpicture aria-hidden="true">
      <source src="./video_entrada.mp4#t=0.001" type="video/mp4">
    </video>
    <canvas id="introPoster" aria-hidden="true"></canvas>
    <div id="introHint">Toca para entrar</div>
  </div>

  <script>
    (()=>{
      const frame=document.getElementById('inviteFrame');
      const guard=document.getElementById('introGuard');
      const preview=document.getElementById('introPreview');
      const poster=document.getElementById('introPoster');
      const ctx=poster.getContext('2d',{alpha:false});
      let armed=false;
      let captured=false;
      let childVideo=null;
      let childEntry=null;

      const sizePoster=()=>{
        const dpr=Math.min(window.devicePixelRatio||1,2);
        const w=Math.max(1,Math.round(window.innerWidth*dpr));
        const h=Math.max(1,Math.round(window.innerHeight*dpr));
        if(poster.width!==w||poster.height!==h){poster.width=w;poster.height=h;}
        return {w,h};
      };

      const drawCoverFrame=()=>{
        if(captured||preview.readyState<2||!preview.videoWidth||!preview.videoHeight) return false;
        try{
          const {w,h}=sizePoster();
          const vw=preview.videoWidth,vh=preview.videoHeight;
          const scale=Math.max(w/vw,h/vh);
          const dw=vw*scale,dh=vh*scale;
          const dx=(w-dw)/2,dy=(h-dh)/2;
          ctx.fillStyle='#f1e5da';
          ctx.fillRect(0,0,w,h);
          ctx.drawImage(preview,dx,dy,dw,dh);
          captured=true;
          guard.classList.add('frame-ready');
          guard.classList.remove('fallback');
          try{preview.pause();}catch(e){}
          return true;
        }catch(e){return false;}
      };

      const preparePreview=()=>{
        preview.muted=true;
        preview.defaultMuted=true;
        preview.setAttribute('muted','');
        preview.setAttribute('playsinline','');
        preview.setAttribute('webkit-playsinline','');
        try{if(preview.currentTime>.06) preview.currentTime=.001;}catch(e){}

        const p=preview.play();
        if(p&&typeof p.then==='function'){
          p.then(()=>{
            if('requestVideoFrameCallback' in preview){
              preview.requestVideoFrameCallback(()=>drawCoverFrame());
            }else{
              setTimeout(drawCoverFrame,80);
            }
          }).catch(()=>{
            try{preview.currentTime=.001;}catch(e){}
            setTimeout(drawCoverFrame,120);
          });
        }
      };

      preview.addEventListener('loadedmetadata',()=>{
        try{preview.currentTime=.001;}catch(e){}
      },{once:true});
      preview.addEventListener('loadeddata',()=>setTimeout(drawCoverFrame,0),{once:true});
      preview.addEventListener('canplay',()=>setTimeout(drawCoverFrame,0),{once:true});
      preview.addEventListener('seeked',()=>setTimeout(drawCoverFrame,0));
      preview.addEventListener('playing',()=>{
        if('requestVideoFrameCallback' in preview){
          preview.requestVideoFrameCallback(()=>drawCoverFrame());
        }else setTimeout(drawCoverFrame,40);
      },{once:true});
      preview.addEventListener('error',()=>guard.classList.add('fallback'),{once:true});

      setTimeout(()=>{
        if(!captured){
          drawCoverFrame();
          if(!captured) guard.classList.add('fallback');
        }
      },1800);

      const resolveChild=()=>{
        try{
          const wrapperDoc=frame.contentDocument||frame.contentWindow.document;
          const inner=wrapperDoc.getElementById('inv5');
          if(!inner) return false;
          const doc=inner.contentDocument||inner.contentWindow.document;
          childEntry=doc.getElementById('entryScreen');
          childVideo=doc.getElementById('entryVideo');
          if(!childVideo||!childEntry) return false;

          childVideo.setAttribute('playsinline','');
          childVideo.setAttribute('webkit-playsinline','');
          childVideo.removeAttribute('controls');
          childVideo.controls=false;
          childVideo.preload='auto';

          const hideNative=doc.createElement('style');
          hideNative.id='inv5-hide-native-video-ui';
          hideNative.textContent=`
            #entryVideo::-webkit-media-controls,
            #entryVideo::-webkit-media-controls-enclosure,
            #entryVideo::-webkit-media-controls-panel,
            #entryVideo::-webkit-media-controls-start-playback-button,
            #entryVideo::-webkit-media-controls-overlay-play-button{
              display:none!important;-webkit-appearance:none!important;opacity:0!important;pointer-events:none!important
            }`;
          doc.getElementById(hideNative.id)?.remove();
          doc.head.appendChild(hideNative);

          const src=childVideo.querySelector('source');
          if(src&&src.getAttribute('src')!=='./video_entrada.mp4'){
            src.setAttribute('src','./video_entrada.mp4');
            childVideo.load();
          }
          return true;
        }catch(e){return false;}
      };

      frame.addEventListener('load',()=>{
        frame.classList.add('ready');
        let tries=0;
        const timer=setInterval(()=>{
          tries++;
          if(resolveChild()||tries>30) clearInterval(timer);
        },100);
      });

      const enter=()=>{
        if(armed) return;
        armed=true;

        if(!resolveChild()){
          armed=false;
          guard.classList.add('fallback');
          return;
        }

        try{
          preview.pause();
          childVideo.pause();
          childVideo.currentTime=0;
          childVideo.muted=false;
          childVideo.defaultMuted=false;
          childVideo.volume=1;
          childVideo.controls=false;

          const playPromise=childVideo.play();
          if(playPromise&&typeof playPromise.then==='function'){
            playPromise.then(()=>{
              guard.classList.add('hide');
              setTimeout(()=>guard.remove(),180);
            }).catch(()=>{
              armed=false;
              guard.classList.remove('hide');
              guard.classList.add('fallback');
            });
          }else{
            guard.classList.add('hide');
            setTimeout(()=>guard.remove(),180);
          }
        }catch(e){
          armed=false;
          guard.classList.remove('hide');
          guard.classList.add('fallback');
        }
      };

      guard.addEventListener('click',enter);
      guard.addEventListener('touchend',e=>{e.preventDefault();enter();},{passive:false});
      guard.addEventListener('keydown',e=>{
        if(e.key==='Enter'||e.key===' '){e.preventDefault();enter();}
      });

      window.addEventListener('resize',()=>{
        if(!captured) return;
        captured=false;
        drawCoverFrame();
      });

      preparePreview();
      document.addEventListener('visibilitychange',()=>{
        if(!document.hidden&&!armed&&!captured) preparePreview();
      });
    })();
  </script>
</body>
</html>
