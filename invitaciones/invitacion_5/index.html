<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Antonio & Lucero</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f1e5da}
    #inv5{display:block;width:100%;height:100%;border:0;background:#f1e5da;opacity:0;transition:opacity .15s ease}
    #inv5.ready{opacity:1}
  </style>
</head>
<body>
  <iframe id="inv5" src="./invitacion_5.html?v=20260816-1703" title="Invitación 5" allow="autoplay; fullscreen"></iframe>
  <script>
    const frame=document.getElementById('inv5');

    frame.addEventListener('load',()=>{
      try{
        const doc=frame.contentDocument||frame.contentWindow.document;

        // Imagen de fecha propia de la Invitación 5
        const img=doc.querySelector('.countdown-image');
        if(img){
          img.src='./imagen_de_fecha_5.png?v=20260816-2';
          img.removeAttribute('srcset');
        }

        // Fondo animado de la programación propio de la Invitación 5
        const programacionImg=[...doc.querySelectorAll('img')].find(el=>{
          const src=decodeURIComponent(el.getAttribute('src')||'');
          return src.includes('itinerario_2.png');
        });
        if(programacionImg){
          programacionImg.src='./programacion_5.gif?v=20260816-1';
          programacionImg.removeAttribute('srcset');
          programacionImg.style.transform='translateY(14px)';
        }

        // Bajar solo el título "Nuestro Día" ligeramente
        const nuestroDia=[...doc.querySelectorAll('h1,h2,h3,.section-title,.itinerary-title,.itinerario-title,.timeline-title')]
          .find(el=>(el.textContent||'').trim().toLowerCase()==='nuestro día' || (el.textContent||'').trim().toLowerCase()==='nuestro dia');
        if(nuestroDia){
          nuestroDia.style.transform='translateY(14px)';
        }

        // Preguntas frecuentes propias de la Invitación 5
        const faqItems=[...doc.querySelectorAll('details.faq-item')];
        faqItems.forEach(item=>{
          const summary=item.querySelector('summary');
          const answer=item.querySelector('.faq-answer');
          if(!summary) return;
          const question=(summary.textContent||'').trim().toLowerCase();

          if(question.includes('hasta cuándo puedo confirmar mi asistencia') || question.includes('hasta cuando puedo confirmar mi asistencia')){
            summary.textContent='¿Hasta qué fecha puedo confirmar mi asistencia?';
            if(answer) answer.textContent='Por favor, confirma tu asistencia hasta el 15 de octubre.';
          }

          if(question.includes('podemos llevar un regalo') || question.includes('puedo dejar un regalo')){
            summary.textContent='¿Puedo informar de alguna alergia o restricción alimentaria?';
            if(answer) answer.textContent='Sí, es muy importante por la comida que se repartirá y los bocaditos.';
          }

          if(question.includes('solicitar canciones') || question.includes('música') || question.includes('musica') || question.includes('dj')){
            item.remove();
          }
        });

        // Cierre de Invitación 5: conservar "Te esperamos", usar Brook y retirar texto/firma/fecha
        const finalCard=doc.querySelector('.final-card');
        if(finalCard){
          const finalGif=finalCard.querySelector('.te-esperamos-gif');
          if(finalGif){
            finalGif.src='https://raw.githubusercontent.com/avaldiviezoch/Wedding/main/invitaciones/invitacion_1/brook.gif?v=20260816-1703';
            finalGif.alt='Brook';
            finalGif.loading='eager';
            finalGif.removeAttribute('srcset');
          }
          finalCard.querySelector('.wait-message')?.remove();
          finalCard.querySelector('.wait-signature')?.remove();
          finalCard.querySelector('.wait-date')?.remove();
        }

        // Amsterdam Four + ajustes visuales propios de Invitación 5
        const style=doc.createElement('style');
        style.id='inv5-amsterdam-four';
        style.textContent=`
          @font-face{
            font-family:'Amsterdam Four';
            src:url('./Amsterdam%20Four_ttf%20400.ttf') format('truetype');
            font-weight:400;
            font-style:normal;
            font-display:swap;
          }

          h1,
          h2,
          h3,
          .section-title,
          .photo-story-title,
          .rsvp-title,
          .faq-title,
          .gift-title,
          .music-title,
          .dress-title,
          .location-title,
          .itinerary-title,
          .confirmation-title,
          .questions-title,
          [class*="section-title"],
          [class*="-title"]{
            font-family:'Amsterdam Four', cursive !important;
            font-weight:400 !important;
          }

          /* Más aire en "Nuestra historia" */
          .photo-story-kicker{
            margin-bottom:14px !important;
          }
          .photo-story-title{
            margin-top:4px !important;
            margin-bottom:20px !important;
            line-height:1.18 !important;
          }
          .photo-story-subtitle{
            margin-top:8px !important;
            line-height:1.5 !important;
          }

          /* Más espacio entre "Nuestro Día" y el itinerario */
          .itinerary-title,
          .itinerario-title,
          .timeline-title,
          [class*="itinerario"] h2,
          [class*="itinerary"] h2{
            margin-bottom:24px !important;
            line-height:1.18 !important;
          }
          .timeline-wrap,
          .itinerario-wrap,
          .itinerary-wrap,
          .timeline-content{
            margin-top:10px !important;
          }

          /* Más espacio entre "Quiero dejarles un detalle" y su indicación */
          .gift-title,
          .regalo-title,
          [class*="gift"] h2,
          [class*="regalo"] h2{
            margin-bottom:20px !important;
            line-height:1.22 !important;
          }
          .gift-hint,
          .regalo-hint,
          .tap-text,
          [class*="gift"] .tap-text,
          [class*="regalo"] .tap-text{
            margin-top:10px !important;
            line-height:1.45 !important;
          }
        `;

        const previous=doc.getElementById('inv5-amsterdam-four');
        if(previous) previous.remove();
        doc.head.appendChild(style);

      }catch(e){
        console.warn('No se pudieron aplicar los ajustes de Invitación 5',e);
      }

      frame.classList.add('ready');
    });
  </script>
</body>
</html>
