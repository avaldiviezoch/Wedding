<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <meta name="theme-color" content="#f1e5da">
  <title>Antonio & Lucero</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f1e5da}
    body{min-height:100svh}
    #inviteFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f1e5da;opacity:0;transition:opacity .18s ease}
    #inviteFrame.ready{opacity:1}
    #introGuard{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#f1e5da;overflow:hidden;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
    #introPreview{display:block;width:100%;height:100%;object-fit:cover;background:#f1e5da;pointer-events:none}
    #introGuard.hide{opacity:0;pointer-events:none;transition:opacity .16s ease}
    #introHint{position:absolute;left:50%;bottom:max(28px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:10px 18px;border-radius:999px;background:rgba(241,229,218,.86);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#3d4335;font:600 15px/1.2 Georgia,'Times New Roman',serif;white-space:nowrap;box-shadow:0 6px 24px rgba(61,67,53,.12);opacity:0;transition:opacity .25s ease}
    #introGuard.frame-ready #introHint{opacity:0}
    #introGuard.fallback #introHint{opacity:1}
    @media (prefers-reduced-motion:reduce){#inviteFrame,#introGuard{transition:none!important}}
  </style>
</head>
<body>
  <iframe id="inviteFrame" src="./invitacion_5.html?v=20260818-0716" title="Invitación Antonio y Lucero" allow="autoplay; fullscreen"></iframe>

  <div id="introGuard" role="button" tabindex="0" aria-label="Toca para entrar a la invitación">
    <video id="introPreview" autoplay muted playsinline webkit-playsinline preload="auto" disablepictureinpicture controlslist="nodownload noplaybackrate noremoteplayback" aria-hidden="true">
      <source src="./video_entrada.mp4#t=0.001" type="video/mp4">
    </video>
    <div id="introHint">Toca para entrar</div>
  </div>

  <script>
    (()=>{
      const frame=document.getElementById('inviteFrame');
      const guard=document.getElementById('introGuard');
      const preview=document.getElementById('introPreview');
      let armed=false;
      let childVideo=null;
      let childEntry=null;

      const freezePreview=()=>{
        try{
          if(preview.readyState>=2){
            preview.pause();
            if(Math.abs(preview.currentTime)>.08) preview.currentTime=.001;
            guard.classList.add('frame-ready');
            guard.classList.remove('fallback');
          }
        }catch(e){}
      };

      const preparePreview=()=>{
        preview.muted=true;
        preview.defaultMuted=true;
        preview.setAttribute('muted','');
        preview.setAttribute('playsinline','');
        preview.setAttribute('webkit-playsinline','');

        const p=preview.play();
        if(p&&typeof p.then==='function'){
          p.then(()=>{
            if('requestVideoFrameCallback' in preview){
              preview.requestVideoFrameCallback(()=>freezePreview());
            }else{
              setTimeout(freezePreview,35);
            }
          }).catch(()=>{
            try{preview.currentTime=.001;}catch(e){}
          });
        }
      };

      preview.addEventListener('loadedmetadata',()=>{
        try{preview.currentTime=.001;}catch(e){}
      },{once:true});
      preview.addEventListener('loadeddata',freezePreview,{once:true});
      preview.addEventListener('canplay',freezePreview,{once:true});
      preview.addEventListener('seeked',freezePreview,{once:true});
      preview.addEventListener('error',()=>guard.classList.add('fallback'),{once:true});

      setTimeout(()=>{
        if(!guard.classList.contains('frame-ready')) guard.classList.add('fallback');
      },1800);

      const resolveChild=()=>{
        try{
          const wrapperDoc=frame.contentDocument||frame.contentWindow.document;
          const inner=wrapperDoc.getElementById('inv5');
          if(!inner) return false;
          const doc=inner.contentDocument||inner.contentWindow.document;
          childEntry=doc.getElementById('entryScreen');
          childVideo=doc.getElementById('entryVideo');
          if(!childVideo||!childEntry) return false;

          childVideo.setAttribute('playsinline','');
          childVideo.setAttribute('webkit-playsinline','');
          childVideo.preload='auto';
          const src=childVideo.querySelector('source');
          if(src&&src.getAttribute('src')!=='./video_entrada.mp4'){
            src.setAttribute('src','./video_entrada.mp4');
            childVideo.load();
          }
          return true;
        }catch(e){return false;}
      };

      frame.addEventListener('load',()=>{
        frame.classList.add('ready');
        let tries=0;
        const timer=setInterval(()=>{
          tries++;
          if(resolveChild()||tries>30) clearInterval(timer);
        },100);
      });

      const enter=()=>{
        if(armed) return;
        armed=true;

        if(!resolveChild()){
          guard.classList.add('hide');
          setTimeout(()=>guard.remove(),180);
          return;
        }

        try{
          preview.pause();
          childVideo.pause();
          childVideo.currentTime=0;
          childVideo.muted=false;
          childVideo.defaultMuted=false;
          childVideo.volume=1;

          guard.classList.add('hide');
          const playPromise=childVideo.play();
          if(playPromise&&typeof playPromise.catch==='function'){
            playPromise.catch(()=>{
              armed=false;
              guard.classList.remove('hide');
              guard.classList.add('fallback');
            });
          }
          setTimeout(()=>{if(armed) guard.remove();},220);
        }catch(e){
          armed=false;
          guard.classList.remove('hide');
          guard.classList.add('fallback');
        }
      };

      guard.addEventListener('click',enter);
      guard.addEventListener('touchend',e=>{e.preventDefault();enter();},{passive:false});
      guard.addEventListener('keydown',e=>{
        if(e.key==='Enter'||e.key===' '){e.preventDefault();enter();}
      });

      preparePreview();
      document.addEventListener('visibilitychange',()=>{
        if(!document.hidden&&!armed&&!guard.classList.contains('frame-ready')) preparePreview();
      });
    })();
  </script>
</body>
</html>
