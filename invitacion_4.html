<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f4eedf" />
  <title>Antonio & Lucero</title>
  <style>
    html,body{margin:0;min-height:100%;background:#f4eedf}
    .loading-halo-4{position:fixed;inset:0;display:grid;place-items:center;background:#f4eedf;color:#46533c;font-family:system-ui,sans-serif;font-size:13px;letter-spacing:.08em}
  </style>
</head>
<body>
  <div class="loading-halo-4">Cargando invitación…</div>
  <script>
    (async function(){
      const response = await fetch('invitacion_4_base.html?v=20260813-2137', {cache:'no-store'});
      if(!response.ok) throw new Error('No se pudo cargar la invitación base');
      let html = await response.text();

      const halo = `<style id="haloGlobalInvitacion4">
      .invitacion p,
      .invitacion h1,
      .invitacion h2,
      .invitacion h3,
      .invitacion h4,
      .invitacion h5,
      .invitacion h6,
      .invitacion span:not(.muestra-color),
      .invitacion time,
      .invitacion label,
      .invitacion summary,
      .invitacion a,
      .invitacion button,
      .invitacion input,
      .invitacion textarea,
      .invitacion select,
      .invitacion option {
        text-shadow:
          0 0 2px rgba(244,238,223,1),
          0 0 6px rgba(244,238,223,.96),
          0 0 10px rgba(244,238,223,.84),
          0 1px 14px rgba(244,238,223,.68) !important;
      }

      .invitacion .nombres,
      .invitacion .fecha,
      .invitacion .titulo-primer-fondo,
      .invitacion .titulo-ubicacion,
      .invitacion .titulo-itinerario,
      .invitacion .titulo-adicional,
      .invitacion .historia-transicion-titulo {
        text-shadow:
          0 0 3px rgba(244,238,223,1),
          0 0 8px rgba(244,238,223,.98),
          0 0 14px rgba(244,238,223,.86),
          0 2px 18px rgba(244,238,223,.72) !important;
      }
      </style>`;

      html = html.replace('</head>', halo + '\n</head>');
      document.open();
      document.write(html);
      document.close();
    })().catch(function(error){
      console.error(error);
      location.replace('invitacion_4_base.html?v=20260813-2137');
    });
  </script>
</body>
</html>
