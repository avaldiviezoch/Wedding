<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fbeed8" />
  <title>Antonio & Lucero | Invitación</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #fbeed8; }
    .loading-patch { position: fixed; inset: 0; display: grid; place-items: center; color: #355a35; font-family: system-ui, sans-serif; font-size: 13px; letter-spacing: .08em; background: #fbeed8; }
  </style>
</head>
<body>
  <div class="loading-patch">Cargando invitación…</div>
  <script>
    (async function () {
      const response = await fetch('invitacion_3_base.html?v=20260813-1', { cache: 'no-store' });
      if (!response.ok) throw new Error('No se pudo cargar la invitación base');
      let html = await response.text();

      const giftOld = `        <details>
          <summary>¿Podemos llevar un regalo?</summary>
          <div class="faq-answer">Sí. Podremos recibir regalos físicos durante la recepción y también encontrarás opciones de Yape o transferencia en la sección de regalos.</div>
        </details>`;
      const giftNew = `        <details>
          <summary>¿Podemos llevar un regalo?</summary>
          <div class="faq-answer">Sí. Podremos recibir regalos físicos durante la recepción y también encontrarás opciones de Yape o transferencia en la sección de regalos.</div>
          <div class="faq-illustration">
            <img src="pic_preguntas_3_5.png" onerror="this.classList.add('media-error')" alt="Ilustración para la pregunta de regalos" loading="lazy" />
          </div>
        </details>`;

      const musicOld = `        <details>
          <summary>¿Podemos solicitar canciones durante la fiesta?</summary>
          <div class="faq-answer">Las sugerencias se recibirán mediante el formulario antes de la boda. Durante la celebración, el DJ no recibirá pedidos en vivo.</div>
        </details>`;
      const musicNew = `        <details>
          <summary>¿Podemos solicitar canciones durante la fiesta?</summary>
          <div class="faq-answer">Las sugerencias se recibirán mediante el formulario antes de la boda. Durante la celebración, el DJ no recibirá pedidos en vivo.</div>
          <div class="faq-illustration">
            <img src="pic_preguntas_3_4.png" onerror="this.classList.add('media-error')" alt="Ilustración de los novios con audífonos y consola de DJ" loading="lazy" />
          </div>
        </details>`;

      if (!html.includes(giftOld) || !html.includes(musicOld)) throw new Error('No se encontraron las preguntas que debían actualizarse');
      html = html.replace(giftOld, giftNew).replace(musicOld, musicNew);
      document.open();
      document.write(html);
      document.close();
    })().catch(function (error) {
      console.error(error);
      location.replace('invitacion_3_base.html?v=20260813-1');
    });
  </script>
</body>
</html>
