<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invitaciones | Mi Gran Día</title>
  <style>
    :root{--bg:#f4f1eb;--panel:#fff;--ink:#30362f;--muted:#7b8178;--olive:#687357;--olive-dark:#4f5942;--line:#e2ddd4;--soft:#f8f6f1;--shadow:0 18px 50px rgba(54,48,39,.10);--radius:20px}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
    body{overflow:hidden}
    button,a{font:inherit}
    .shell{height:100dvh;display:grid;grid-template-columns:290px minmax(0,1fr);gap:14px;padding:14px}
    .sidebar{min-height:0;display:flex;flex-direction:column;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
    .side-head{padding:22px 20px 18px;border-bottom:1px solid var(--line);background:linear-gradient(145deg,#fff,#f8f6f1)}
    .eyebrow{display:block;color:#909879;font-size:9px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;margin-bottom:7px}
    .side-head h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:27px;font-weight:500;line-height:1.05}.side-head p{margin:8px 0 0;color:var(--muted);font-size:11px;line-height:1.5}
    .invite-list{display:grid;gap:8px;padding:14px;overflow:auto;scrollbar-width:thin}
    .invite-item{width:100%;display:grid;grid-template-columns:40px minmax(0,1fr) 18px;align-items:center;gap:10px;padding:11px;border:1px solid transparent;border-radius:15px;background:transparent;color:var(--ink);text-align:left;cursor:pointer;transition:.18s ease}
    .invite-item:hover{background:#f7f6f2;border-color:#e4e0d7;transform:translateX(2px)}
    .invite-item.active{background:linear-gradient(135deg,#6d785c,#5c674d);color:#fff;border-color:#5c674d;box-shadow:0 9px 22px rgba(92,103,77,.20)}
    .num{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:#eef0e8;color:#58644d;font-size:13px;font-weight:900}.invite-item.active .num{background:rgba(255,255,255,.15);color:#fff}
    .invite-copy{min-width:0}.invite-copy strong{display:block;font-size:12px}.invite-copy span{display:block;margin-top:3px;color:var(--muted);font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.invite-item.active .invite-copy span{color:rgba(255,255,255,.68)}
    .chev{font-size:17px;opacity:.52}.invite-item.active .chev{opacity:1}
    .principal-badge{display:inline-flex;margin-left:5px;padding:2px 5px;border-radius:999px;background:#dfe5d5;color:#5a6649;font-size:7px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;vertical-align:2px}.invite-item.active .principal-badge{background:rgba(255,255,255,.16);color:#fff}
    .side-foot{margin-top:auto;padding:14px;border-top:1px solid var(--line);display:grid;gap:8px}.side-foot a{display:flex;align-items:center;justify-content:center;min-height:40px;border:1px solid var(--line);border-radius:12px;color:#62685f;background:#fff;text-decoration:none;font-size:10px;font-weight:800;transition:.18s ease}.side-foot a:hover{background:#f1efe9;transform:translateY(-1px)}
    .workspace{min-width:0;min-height:0;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
    .toolbar{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 17px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.96);backdrop-filter:blur(12px)}
    .current{min-width:0}.current small{display:block;color:#949b8d;font-size:8px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.current h2{margin:4px 0 0;font-family:Georgia,"Times New Roman",serif;font-size:24px;font-weight:500}.current p{margin:4px 0 0;color:var(--muted);font-size:10px}
    .actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.action{min-height:38px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:#fff;color:#565d53;text-decoration:none;font-size:10px;font-weight:850;cursor:pointer;transition:.18s ease}.action:hover{transform:translateY(-1px);box-shadow:0 7px 16px rgba(51,47,40,.08);border-color:#bbb4a8}.action.primary{background:var(--olive);color:#fff;border-color:var(--olive)}.action.primary:hover{background:var(--olive-dark)}
    .preview{position:relative;flex:1;min-height:0;background:#e9e7e2;overflow:hidden}.loading{position:absolute;inset:0;z-index:2;display:grid;place-items:center;background:linear-gradient(145deg,#f7f3ed,#ece7de);color:#7d8279;font-size:11px;transition:opacity .25s ease;pointer-events:none}.loading.done{opacity:0}
    iframe{display:block;width:100%;height:100%;border:0;background:#fff}
    @media(max-width:800px){body{overflow:auto}.shell{height:auto;min-height:100dvh;grid-template-columns:1fr;padding:8px;gap:8px}.sidebar{border-radius:17px;overflow:visible}.side-head{padding:14px}.side-head h1{font-size:21px}.side-head p{display:none}.invite-list{display:flex;overflow-x:auto;padding:8px;gap:6px}.invite-item{flex:0 0 auto;width:auto;grid-template-columns:30px auto;padding:7px 9px}.invite-item .chev,.invite-copy span{display:none}.num{width:30px;height:30px;border-radius:9px}.invite-copy strong{font-size:10px}.side-foot{display:none}.workspace{height:calc(100dvh - 126px);min-height:620px;border-radius:17px}.toolbar{min-height:62px;padding:9px 11px}.current h2{font-size:18px}.current p{display:none}.actions{gap:5px}.action{min-height:34px;padding:7px 9px;font-size:9px}.action.back{display:none}}
  </style>
</head>
<body>
  <main class="shell">
    <aside class="sidebar">
      <header class="side-head">
        <span class="eyebrow">Mi Gran Día</span>
        <h1>Invitaciones</h1>
        <p>Selecciona un modelo para revisarlo. Solo cargamos una invitación a la vez para que el módulo sea más rápido y ordenado.</p>
      </header>
      <nav class="invite-list" id="inviteList" aria-label="Modelos de invitación"></nav>
      <footer class="side-foot"><a href="./applu.html">← Volver a Mi Gran Día</a></footer>
    </aside>

    <section class="workspace">
      <header class="toolbar">
        <div class="current">
          <small>Vista seleccionada</small>
          <h2 id="currentTitle">Invitación 5</h2>
          <p id="currentPath">invitaciones/invitacion_5/</p>
        </div>
        <div class="actions">
          <button class="action" id="reloadButton" type="button">↻ Recargar</button>
          <a class="action primary" id="openButton" href="#" target="_blank" rel="noopener">↗ Abrir completa</a>
          <a class="action back" href="./applu.html">← Menú</a>
        </div>
      </header>
      <div class="preview">
        <div class="loading" id="loading">Cargando invitación…</div>
        <iframe id="inviteFrame" title="Vista previa de invitación" allow="autoplay; fullscreen"></iframe>
      </div>
    </section>
  </main>

  <script>
    const INVITES=[
      {n:5,principal:true,url:'https://avaldiviezoch.github.io/Wedding/invitaciones/invitacion_5/'},
      {n:1,url:'https://avaldiviezoch.github.io/Wedding/invitaciones/invitacion_1/'},
      {n:2,url:'https://avaldiviezoch.github.io/Wedding/invitaciones/invitacion_2/'},
      {n:3,url:'https://avaldiviezoch.github.io/Wedding/invitaciones/invitacion_3/'},
      {n:4,url:'https://avaldiviezoch.github.io/Wedding/invitaciones/invitacion_4/'}
    ];
    const list=document.getElementById('inviteList');
    const frame=document.getElementById('inviteFrame');
    const loading=document.getElementById('loading');
    const title=document.getElementById('currentTitle');
    const path=document.getElementById('currentPath');
    const openButton=document.getElementById('openButton');
    let current=5;

    list.innerHTML=INVITES.map(item=>`<button class="invite-item${item.n===current?' active':''}" type="button" data-invite="${item.n}"><span class="num">${item.n}</span><span class="invite-copy"><strong>Invitación ${item.n}${item.principal?'<span class="principal-badge">Principal</span>':''}</strong><span>Modelo ${item.n}</span></span><span class="chev">›</span></button>`).join('');

    function selectInvite(n){
      const item=INVITES.find(x=>x.n===Number(n));if(!item)return;
      current=item.n;
      document.querySelectorAll('.invite-item').forEach(btn=>btn.classList.toggle('active',Number(btn.dataset.invite)===current));
      title.textContent=`Invitación ${current}`;
      path.textContent=`invitaciones/invitacion_${current}/`;
      openButton.href=item.url;
      loading.textContent=`Cargando invitación ${current}…`;
      loading.classList.remove('done');
      frame.src=item.url;
    }

    list.addEventListener('click',e=>{const btn=e.target.closest('[data-invite]');if(btn)selectInvite(btn.dataset.invite);});
    document.getElementById('reloadButton').addEventListener('click',()=>{loading.classList.remove('done');try{frame.contentWindow.location.reload();}catch(_){frame.src=frame.src;}});
    frame.addEventListener('load',()=>{loading.classList.add('done');try{const doc=frame.contentDocument||frame.contentWindow.document;doc.querySelectorAll('audio,video').forEach(m=>m.muted=true);}catch(_){}});
    selectInvite(current);
  </script>
</body>
</html>
