name: Optimizar carga invitacion 1

"on":
  push:
    paths:
      - '.github/triggers/optimizar-carga-invitacion-1.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar optimizacion
        run: python .github/scripts/optimizar_carga_invitacion_1.py

      - name: Validar
        run: |
          grep -q 'OPTIMIZACION_CARGA_INVITACION_1_V1' invitacion_1.html
          grep -q 'wedding-sw.js' invitacion_1.html
          grep -q 'requestIdleCallback' invitacion_1.html

      - name: Limpiar temporales
        run: |
          rm -f .github/workflows/optimizar-carga-invitacion-1.yml
          rm -f .github/triggers/optimizar-carga-invitacion-1.txt
          rm -f .github/scripts/optimizar_carga_invitacion_1.py

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add invitacion_1.html wedding-sw.js .github/workflows/optimizar-carga-invitacion-1.yml .github/triggers/optimizar-carga-invitacion-1.txt .github/scripts/optimizar_carga_invitacion_1.py
          git commit -m 'Optimizar carga progresiva invitacion 1'
          git push
