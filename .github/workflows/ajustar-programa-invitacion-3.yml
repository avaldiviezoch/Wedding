name: Ajustar programa invitacion 3
on:
  push:
    paths:
      - '.github/workflows/ajustar-programa-invitacion-3.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar programa sobre la mesa
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Validar
        run: |
          grep -q 'AJUSTE PROGRAMA INVITACION 3 — MESA' invitacion_3.html
          grep -q 'top:27.3% !important' invitacion_3.html
          grep -q 'display:none !important' invitacion_3.html
      - name: Commit y limpiar workflow temporal
        run: |
          rm .github/workflows/ajustar-programa-invitacion-3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add invitacion_3.html .github/workflows/ajustar-programa-invitacion-3.yml
          git commit -m "Ajustar programación dentro de la mesa en invitación 3"
          git push
