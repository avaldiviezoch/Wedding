name: Ajustar programa invitacion 3
on:
  push:
    paths:
      - '.github/workflows/ajustar-programa-invitacion-3.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar ajuste
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('invitacion_3.html')
          s = p.read_text(encoding='utf-8')
          marker = 'AJUSTE_PROGRAMA_INVITACION_3_MESA'
          if marker in s:
              raise SystemExit('Ajuste ya aplicado')
          css = """
          /* AJUSTE_PROGRAMA_INVITACION_3_MESA */
          .program-table-section{
            padding:18px 0 38px !important;
          }
          .program-table-title{
            margin:0 0 10px !important;
          }
          .program-table-ornament{
            display:none !important;
          }
          .program-table-content{
            position:absolute !important;
            inset:0 !important;
            width:100% !important;
            height:100% !important;
            transform:none !important;
            display:block !important;
          }
          .program-table-content::before{
            left:50% !important;
            top:22.5% !important;
            bottom:30.5% !important;
            transform:translateX(-50%) !important;
          }
          .program-table-row{
            position:absolute !important;
            left:21.5% !important;
            width:57% !important;
            min-height:0 !important;
            opacity:0;
            transform:translateY(calc(-50% + 16px));
          }
          .program-table-row:nth-child(1){top:27.4% !important;}
          .program-table-row:nth-child(2){top:42.8% !important;}
          .program-table-row:nth-child(3){top:58.3% !important;}
          .program-table-row:nth-child(4){top:73.9% !important;}
          .program-table-marker{
            width:20px !important;
            height:20px !important;
            margin:0 auto 2px !important;
            font-size:11px !important;
            box-shadow:0 0 0 3px rgba(251,238,216,.55) !important;
          }
          .program-table-time{
            margin:1px 0 2px !important;
            font-size:clamp(15px,4vw,20px) !important;
          }
          .program-table-event strong{
            margin-bottom:1px !important;
            font-size:clamp(15px,4vw,20px) !important;
            line-height:1.04 !important;
          }
          .program-table-event span{
            font-size:clamp(9px,2.45vw,12px) !important;
            line-height:1.18 !important;
          }
          @keyframes programRowIn{
            to{opacity:1;transform:translateY(-50%);}
          }
          """
          if '</style>' not in s:
              raise SystemExit('No se encontro style final')
          s = s.replace('</style>', css + '\n</style>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validar
        run: |
          grep -q 'AJUSTE_PROGRAMA_INVITACION_3_MESA' invitacion_3.html
          grep -q 'top:27.4% !important' invitacion_3.html
          grep -q 'program-table-ornament' invitacion_3.html
      - name: Commit y limpiar
        run: |
          rm .github/workflows/ajustar-programa-invitacion-3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add invitacion_3.html .github/workflows/ajustar-programa-invitacion-3.yml
          git commit -m "Ajustar programa dentro de la mesa en invitación 3"
          git push
