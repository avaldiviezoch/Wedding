name: Ajuste video 10s y Brook footer invitacion 1

on:
  push:
    paths:
      - '.github/workflows/ajuste-video-10s-y-quitar-brook-footer-invitacion-1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Aplicar ajuste
        shell: bash
        run: >-
          python3 -c "from pathlib import Path; import re; p=Path('invitacion_1.html'); t=p.read_text(encoding='utf-8'); t,n1=re.subn(r'const LOOP_START = 0\\.85;\\s*const LOOP_END_MARGIN = 1\\.80;', 'const LOOP_START = 0.85;\\n  const LOOP_END = 9.8;', t, count=1); assert n1==1, 'loop config'; t,n2=re.subn(r'return Math\\.max\\(LOOP_START \\+ 1\\.2, heroVideo\\.duration - LOOP_END_MARGIN\\);', 'return Math.min(LOOP_END, Math.max(LOOP_START + 1.2, heroVideo.duration - 0.15));', t, count=1); assert n2==1, 'loop end'; t,n3=re.subn(r'\\n\\s*<div class=\\\"footer-brook-loop\\\"[^>]*>\\s*<img[^>]*>\\s*</div>\\s*\\n', '\\n', t, count=1, flags=re.S); assert n3==1, 'brook footer'; p.write_text(t, encoding='utf-8')"

      - name: Validar
        shell: bash
        run: >-
          python3 -c "from pathlib import Path; t=Path('invitacion_1.html').read_text(encoding='utf-8'); assert 'const LOOP_END = 9.8;' in t; assert 'duration - LOOP_END_MARGIN' not in t; assert 'class=\"footer-brook-loop\"' not in t; assert 'class=\"brook-player\"' in t; print('VALIDACION OK')"

      - name: Commit y limpiar workflow temporal
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ajuste-video-10s-y-quitar-brook-footer-invitacion-1.yml
          git add invitacion_1.html
          git commit -m "Ajustar video a loop de 10s y quitar Brook final"
          git push origin main
