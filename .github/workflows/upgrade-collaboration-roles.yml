name: Upgrade collaboration roles

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-collaboration-roles.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar ampliación multi-boda
        run: python3 .github/scripts/upgrade_collaboration_roles.py

      - name: Validar JavaScript
        run: |
          cp app_integral/js/services/firebase.js /tmp/firebase.mjs
          cp app_integral/js/modules/configuracion/weddings.js /tmp/weddings.mjs
          cp app_integral/js/modules/configuracion/weddings-legacy.js /tmp/weddings-legacy.mjs
          node --check /tmp/firebase.mjs
          node --check /tmp/weddings.mjs
          node --check /tmp/weddings-legacy.mjs

      - name: Validar roles y reglas
        run: |
          grep -q "admin.*editor.*provider.*viewer" app_integral/js/services/firebase.js
          grep -q "Administrador" app_integral/js/modules/configuracion/weddings-legacy.js
          grep -q "Proveedor" app_integral/js/modules/configuracion/weddings-legacy.js
          grep -q "canManageTeam" app_integral/firebase/firestore.rules
          grep -q "canEditPlanner" app_integral/firebase/firestore.rules
          grep -q "20260814-1136-collab1" app_integral/applu.html
          grep -q "20260814-1136-collab1" applu.html
          echo COLLABORATION_TESTS_OK

      - name: Guardar cambios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app_integral applu.html
          if git diff --cached --quiet; then
            echo 'Sin cambios'
            exit 0
          fi
          git commit -m 'Ampliar multi-boda con roles de colaboración'
          git push origin HEAD:main
