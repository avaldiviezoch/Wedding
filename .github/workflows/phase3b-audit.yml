name: Phase 3B asset audit

on:
  push:
    branches:
      - perf/invitacion6-phase3b-assets-loading

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/invitacion6-phase3b-assets-loading
          fetch-depth: 0

      - name: Repository tests
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
          pnpm install --frozen-lockfile
          pnpm test

      - name: Prepare BASE and isolated Playwright
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/phase3b-base 60a05f1e4325714bc91b8fa0026f6d4c49aba9f7
          mkdir -p /tmp/phase3b-playwright
          cd /tmp/phase3b-playwright
          npm init -y >/dev/null
          npm install --no-save playwright@1.55.0 pngjs@7.0.0
          npx playwright install --with-deps chromium

      - name: Start HEAD and BASE servers
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4174 --bind 127.0.0.1 >/tmp/head.log 2>&1 &
          (cd /tmp/phase3b-base && python3 -m http.server 4175 --bind 127.0.0.1 >/tmp/base.log 2>&1 &)
          sleep 2
          curl -fsS http://127.0.0.1:4174/invitaciones/invitacion_6/index.html >/dev/null
          curl -fsS http://127.0.0.1:4175/invitaciones/invitacion_6/index.html >/dev/null

      - name: Browser QA
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/phase3b-playwright/qa.cjs <<'NODE'
          const { chromium }=require('/tmp/phase3b-playwright/node_modules/playwright');
          const { PNG }=require('/tmp/phase3b-playwright/node_modules/pngjs');
          const fs=require('fs');
          const PATH='/invitaciones/invitacion_6/index.html';
          const LAZY=['inicio_de_boda_6_3.gif','brindis_6_3.gif','comida_6_2.gif','fiesta_6_2.gif','fin_boda_6_2.gif'];
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const normalize=s=>String(s).replace(/http:\/\/127\.0\.0\.1:417[45]/g,'LOCAL');
          const uniq=a=>[...new Set(a.map(normalize))].sort();
          function classify(a,b){const A=new Set(uniq(a)),B=new Set(uniq(b));return {BASE_ONLY:[...A].filter(x=>!B.has(x)),HEAD_ONLY:[...B].filter(x=>!A.has(x)),COMMON:[...A].filter(x=>B.has(x))};}
          async function waitDeep(page){await page.waitForFunction(()=>{try{const d1=document.querySelector('#invite')?.contentDocument;const d2=d1?.querySelector('#inviteFrame')?.contentDocument;const d3=d2?.querySelector('#inv5')?.contentDocument;return !!d3?.querySelector('#sat-inv6-program-timeline-section');}catch{return false}},null,{timeout:15000});}
          async function deep(page,fn,arg=null){return page.evaluate(({src,arg})=>{const d1=document.querySelector('#invite').contentDocument;const d2=d1.querySelector('#inviteFrame').contentDocument;const d3=d2.querySelector('#inv5').contentDocument;return (0,eval)(`(${src})`)(d3,arg);},{src:fn.toString(),arg});}
          async function measure(browser,label,port,w,h){
            const ctx=await browser.newContext({viewport:{width:w,height:h},serviceWorkers:'block',reducedMotion:'reduce'});const page=await ctx.newPage();const cdp=await ctx.newCDPSession(page);await cdp.send('Network.enable');
            const req=new Map(),issues=[];let t0=null;
            cdp.on('Network.requestWillBeSent',e=>{if(t0===null)t0=e.timestamp;req.set(e.requestId,{url:e.request.url,start:(e.timestamp-t0)*1000,type:e.type,bytes:0,mime:'',failed:false});});
            cdp.on('Network.responseReceived',e=>{const x=req.get(e.requestId);if(x)x.mime=e.response.mimeType||'';});
            cdp.on('Network.loadingFinished',e=>{const x=req.get(e.requestId);if(x)x.bytes=e.encodedDataLength||0;});
            cdp.on('Network.loadingFailed',e=>{const x=req.get(e.requestId);if(x){x.failed=true;x.error=e.errorText;}});
            page.on('console',m=>{if(m.type()==='error'||m.type()==='warning')issues.push(`console.${m.type()}:${m.text()}`);});page.on('pageerror',e=>issues.push(`pageerror:${e.message}`));page.on('requestfailed',r=>issues.push(`requestfailed:${r.url()}:${r.failure()?.errorText}`));
            await page.goto(`http://127.0.0.1:${port}${PATH}`,{waitUntil:'load',timeout:60000});await waitDeep(page);await sleep(5200);
            const perf=await page.evaluate(()=>({dcl:performance.timing.domContentLoadedEventEnd-performance.timing.navigationStart,load:performance.timing.loadEventEnd-performance.timing.navigationStart,fcp:performance.getEntriesByName('first-contentful-paint')[0]?.startTime||null}));
            const rows=[...req.values()].filter(x=>x.url.startsWith('http'));const sum=x=>x.reduce((n,r)=>n+(r.bytes||0),0);const media=rows.filter(x=>x.type==='Media');
            const summary={requests:rows.length,bytes:sum(rows),imageBytes:sum(rows.filter(x=>x.type==='Image')),videoBytes:sum(media.filter(x=>x.mime.startsWith('video/'))),audioBytes:sum(media.filter(x=>x.mime.startsWith('audio/'))),jsBytes:sum(rows.filter(x=>x.type==='Script')),cssBytes:sum(rows.filter(x=>x.type==='Stylesheet')),requestsDCL:rows.filter(x=>x.start<=perf.dcl).length,requestsLoad:rows.filter(x=>x.start<=perf.load).length,requests3s:rows.filter(x=>x.start<=3000).length,bytes3s:sum(rows.filter(x=>x.start<=3000)),requests5s:rows.filter(x=>x.start<=5000).length,bytes5s:sum(rows.filter(x=>x.start<=5000)),failed:rows.filter(x=>x.failed).length,perf};
            const lazy={};for(const n of LAZY){const r=rows.find(x=>x.url.includes('/'+n));lazy[n]=r?{requested:true,start:r.start,bytes:r.bytes}:{requested:false};}
            const rects=await deep(page,(doc,names)=>Object.fromEntries(names.map(n=>{const i=[...doc.images].find(x=>(x.getAttribute('src')||'').includes(n));return [n,i?{top:i.getBoundingClientRect().top,loading:i.loading,decoding:i.decoding,complete:i.complete,naturalWidth:i.naturalWidth}:null]})),LAZY);
            console.log(`MEASURE_${label}=`+JSON.stringify(summary));console.log(`INITIAL_LAZY_${label}=`+JSON.stringify(lazy));console.log(`LAZY_RECTS_${label}=`+JSON.stringify(rects));console.log(`ISSUES_${label}=`+JSON.stringify(uniq(issues)));
            await ctx.close();return {summary,issues:uniq(issues),lazy};
          }
          async function lazyQA(browser,label,w,h){
            const ctx=await browser.newContext({viewport:{width:w,height:h},serviceWorkers:'block',reducedMotion:'reduce'});const page=await ctx.newPage();const requested=new Set(),finished=new Set();page.on('request',r=>requested.add(r.url()));page.on('requestfinished',r=>finished.add(r.url()));
            await page.goto('http://127.0.0.1:4174'+PATH,{waitUntil:'load',timeout:60000});await waitDeep(page);await sleep(5200);
            const before=Object.fromEntries(LAZY.map(n=>[n,[...requested].some(u=>u.includes('/'+n))]));console.log(`LAZY_BEFORE_SCROLL_${label}=`+JSON.stringify(before));if(Object.values(before).some(Boolean))throw new Error('lazy asset requested before scroll');
            await deep(page,doc=>doc.querySelector('#sat-inv6-program-timeline-section').scrollIntoView({block:'center'}));const deadline=Date.now()+15000;while(Date.now()<deadline&&!LAZY.every(n=>[...finished].some(u=>u.includes('/'+n))))await sleep(250);
            const after=Object.fromEntries(LAZY.map(n=>[n,{requested:[...requested].some(u=>u.includes('/'+n)),finished:[...finished].some(u=>u.includes('/'+n))}]));const state=await deep(page,(doc,names)=>Object.fromEntries(names.map(n=>{const i=[...doc.images].find(x=>(x.getAttribute('src')||'').includes(n));return[n,i?{complete:i.complete,naturalWidth:i.naturalWidth,naturalHeight:i.naturalHeight,w:i.getBoundingClientRect().width,h:i.getBoundingClientRect().height}:null]})),LAZY);
            console.log(`LAZY_AFTER_SCROLL_${label}=`+JSON.stringify(after));console.log(`LAZY_STATE_${label}=`+JSON.stringify(state));if(Object.values(after).some(x=>!x.requested||!x.finished)||Object.values(state).some(x=>!x||!x.complete||x.naturalWidth<=0||x.w<=0||x.h<=0))throw new Error('lazy scroll QA failed');await ctx.close();
          }
          async function functional(browser,label,port){const ctx=await browser.newContext({viewport:{width:1366,height:768},serviceWorkers:'block',reducedMotion:'reduce'});const page=await ctx.newPage();await page.goto(`http://127.0.0.1:${port}${PATH}`,{waitUntil:'load',timeout:60000});await waitDeep(page);await sleep(2500);const s=await deep(page,doc=>({countdown:!!doc.querySelector('#countdownOverlay'),carousel:!!doc.querySelector('#fixedFrameCarousel'),location:!!doc.querySelector('#sat-inv6-green-location-exact'),collage:!!doc.querySelector('#sat-inv6-photo-collage'),dress:!!doc.querySelector('#dressCodeSection'),program:!!doc.querySelector('#sat-inv6-program-timeline-section'),rsvp:!!doc.querySelector('#rsvpSection .sat-inv6-rsvp-button'),rsvpBound:doc.querySelector('#rsvpSection .sat-inv6-rsvp-button')?.getAttribute('data-sat-rsvp-bound')==='1',gift:!!doc.querySelector('#sat-inv6-gift-paper-wrap'),music:!!doc.querySelector('.sat-inv6-music-free-host'),faq:!!doc.querySelector('.sat-inv6-faq-host'),closing:!!doc.querySelector('#sat-inv6-final-thanks-section')}));const faq=await deep(page,doc=>{const b=doc.querySelector('.sat-inv6-faq-q');if(!b)return false;const i=b.closest('.sat-inv6-faq-item');b.click();const a=i.classList.contains('is-open');b.click();return a&&!i.classList.contains('is-open');});console.log(`FUNCTIONAL_${label}=`+JSON.stringify({...s,faqToggle:faq}));if(Object.values({...s,faqToggle:faq}).some(v=>v!==true))throw new Error('functional QA failed '+label);await ctx.close();}
          function diff(a,b){const A=PNG.sync.read(fs.readFileSync(a)),B=PNG.sync.read(fs.readFileSync(b));if(A.width!==B.width||A.height!==B.height)return{sizeMismatch:true};let n=0,minX=A.width,minY=A.height,maxX=-1,maxY=-1;for(let y=0;y<A.height;y++)for(let x=0;x<A.width;x++){const i=(y*A.width+x)*4;let d=false;for(let c=0;c<4;c++)if(A.data[i+c]!==B.data[i+c]){d=true;break;}if(d){n++;minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y);}}return{width:A.width,height:A.height,differentPixels:n,percentage:n/(A.width*A.height)*100,bbox:n?{minX,minY,maxX,maxY}:null};}
          async function shot(browser,port,w,h,state,out){const ctx=await browser.newContext({viewport:{width:w,height:h},serviceWorkers:'block',reducedMotion:'reduce'});const page=await ctx.newPage();await page.addInitScript(()=>{const R=Date,f=Date.parse('2026-08-28T20:00:00Z');class D extends R{constructor(...a){super(...(a.length?a:[f]));}static now(){return f}}D.parse=R.parse;D.UTC=R.UTC;window.Date=D;});await page.goto(`http://127.0.0.1:${port}${PATH}`,{waitUntil:'load',timeout:60000});await waitDeep(page);await sleep(2200);if(state!=='first'){await page.evaluate(()=>{const g=document.querySelector('#tapGuard');if(g)g.style.visibility='hidden';});const sel=state==='mid'?'#sat-inv6-green-location-exact':'#sat-inv6-program-timeline-section';await deep(page,(doc,s)=>doc.querySelector(s).scrollIntoView({block:'center'}),sel);await sleep(state==='lazy'?5500:1200);if(state==='lazy')await deep(page,(doc,names)=>{const st=doc.createElement('style');st.textContent=names.map(n=>`img[src*="${n}"]`).join(',')+'{visibility:hidden!important}';doc.head.appendChild(st);},LAZY);}await page.screenshot({path:out});await ctx.close();}
          async function visual(browser,w,h,tag){for(const state of ['first','mid','lazy']){const a=`/tmp/base-${tag}-${state}.png`,b=`/tmp/head-${tag}-${state}.png`;await shot(browser,4175,w,h,state,a);await shot(browser,4174,w,h,state,b);const d=diff(a,b);console.log(`PIXEL_${tag.toUpperCase()}_${state.toUpperCase()}=`+JSON.stringify(d));if(d.sizeMismatch||d.differentPixels!==0)throw new Error(`pixel diff ${tag} ${state}`);}}
          (async()=>{const browser=await chromium.launch({headless:true});const bd=await measure(browser,'BASE_DESKTOP',4175,1366,768),hd=await measure(browser,'HEAD_DESKTOP',4174,1366,768),bm=await measure(browser,'BASE_MOBILE',4175,390,844),hm=await measure(browser,'HEAD_MOBILE',4174,390,844);const cd=classify(bd.issues,hd.issues),cm=classify(bm.issues,hm.issues);console.log('ISSUE_CLASS_DESKTOP='+JSON.stringify(cd));console.log('ISSUE_CLASS_MOBILE='+JSON.stringify(cm));if(cd.HEAD_ONLY.length||cm.HEAD_ONLY.length)throw new Error('HEAD_ONLY issues present');const sd=bd.summary.bytes-hd.summary.bytes,sm=bm.summary.bytes-hm.summary.bytes;console.log('SAVINGS_DESKTOP='+JSON.stringify({bytes:sd,percentage:sd/bd.summary.bytes*100,requests:bd.summary.requests-hd.summary.requests}));console.log('SAVINGS_MOBILE='+JSON.stringify({bytes:sm,percentage:sm/bm.summary.bytes*100,requests:bm.summary.requests-hm.summary.requests}));if(sd<=0||sm<=0)throw new Error('no byte savings');await lazyQA(browser,'DESKTOP',1366,768);await lazyQA(browser,'MOBILE',390,844);await functional(browser,'BASE',4175);await functional(browser,'HEAD',4174);await visual(browser,1366,768,'desktop');await visual(browser,390,844,'mobile');await browser.close();})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/phase3b-playwright/qa.cjs
