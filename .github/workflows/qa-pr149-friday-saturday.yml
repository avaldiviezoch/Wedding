name: QA PR149 date artifact timing

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  actions: read

jobs:
  timing:
    if: github.event.pull_request.number == 149
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download prior routed QA artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 33172178942 -R avaldiviezoch/Wedding -n pr149-friday-saturday-routed-qa-v2 -D qa-artifact

      - name: Print exact date race timing
        run: |
          python3 - <<'PY'
          import json
          p='qa-artifact/report.json'
          with open(p,encoding='utf-8') as f: r=json.load(f)
          for key,v in r['runs'].items():
              q=v['before']['qa']
              samples=v['samples']
              first_friday=next((s for s in samples if s.get('state',{}).get('friday',0)>0),None)
              first_saturday=next((s for s in samples if s.get('state',{}).get('saturday',0)>0),None)
              print(f"TIMING|{key}|registerAtMs={q.get('registerAt')}|clearAtMs={q.get('clearAt')}|callbacksAtClear={q.get('callbacksAtClear')}|finalCallbacks={v['after'].get('callbacks')}|firstFridayMs={first_friday.get('at') if first_friday else 'NONE'}|firstSaturdayMs={first_saturday.get('at') if first_saturday else 'NONE'}|finalFriday={v['after']['state'].get('friday')}|finalSaturday={v['after']['state'].get('saturday')}")
              for e in q.get('events',[]):
                  print(f"EVENT|{key}|{json.dumps(e,separators=(',',':'))}")
          PY
