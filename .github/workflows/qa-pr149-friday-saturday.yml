name: QA PR149 Friday Saturday routed

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  qa:
    if: github.event.pull_request.number == 149
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout BASE
        uses: actions/checkout@v4
        with:
          ref: 4356e7dbcaa389c0f8f3efdf93415b8885626080
          path: qa/base

      - name: Checkout PR HEAD under test
        uses: actions/checkout@v4
        with:
          ref: 31c70fb5477b121ebcd50f0ab86d7b5168316fd3
          path: qa/head

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install ephemeral Chromium
        run: |
          mkdir -p qa-run
          cd qa-run
          npm init -y >/dev/null
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Serve BASE and PR in runner
        run: |
          python3 -m http.server 4173 --directory qa/base > /tmp/base-http.log 2>&1 &
          python3 -m http.server 4174 --directory qa/head > /tmp/head-http.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:4173/invitaciones/invitacion_6/ >/dev/null
          curl --fail http://127.0.0.1:4174/invitaciones/invitacion_6/ >/dev/null

      - name: Probe raw failures, route verified local equivalents, and certify date corrector
        working-directory: qa-run
        run: |
          cat > qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';

          const ROOT=path.resolve('artifacts');
          fs.mkdirSync(ROOT,{recursive:true});
          const targets={
            base:{url:'http://127.0.0.1:4173/invitaciones/invitacion_6/',root:path.resolve('../qa/base'),sha:'4356e7dbcaa389c0f8f3efdf93415b8885626080'},
            pr:{url:'http://127.0.0.1:4174/invitaciones/invitacion_6/',root:path.resolve('../qa/head'),sha:'31c70fb5477b121ebcd50f0ab86d7b5168316fd3'}
          };
          const viewports={desktop:{width:1366,height:768},mobile:{width:390,height:844}};
          const browser=await chromium.launch({headless:true});
          const report={rawOriginal:{},mappings:{},runs:{}};
          const sha256=b=>crypto.createHash('sha256').update(b).digest('hex');
          const mime=p=>({'.js':'application/javascript; charset=utf-8','.css':'text/css; charset=utf-8','.html':'text/html; charset=utf-8','.json':'application/json; charset=utf-8','.png':'image/png','.jpg':'image/jpeg','.jpeg':'image/jpeg','.gif':'image/gif','.webp':'image/webp','.svg':'image/svg+xml','.mp3':'audio/mpeg','.mp4':'video/mp4','.woff':'font/woff','.woff2':'font/woff2','.ttf':'font/ttf','.otf':'font/otf'}[path.extname(p).toLowerCase()]||'application/octet-stream');

          async function enter(page){
            await page.locator('#tapGuard').waitFor({state:'attached',timeout:15000});
            await page.locator('#tapGuard').click({position:{x:20,y:20}}).catch(()=>{});
            await page.waitForTimeout(700);
            await page.evaluate(()=>{
              try{
                const d1=document.querySelector('#invite')?.contentDocument;
                const d2=d1?.querySelector('#inviteFrame')?.contentDocument;
                const d3=d2?.querySelector('#inv5')?.contentDocument;
                const v=d3?.getElementById('entryVideo');
                if(v){try{if(Number.isFinite(v.duration)&&v.duration>0)v.currentTime=Math.max(0,v.duration-.05);}catch(_){};v.dispatchEvent(new Event('ended'));}
              }catch(_){}
            });
          }

          async function discoverRaw(kind){
            const t=targets[kind];
            const ctx=await browser.newContext({viewport:viewports.desktop,reducedMotion:'reduce'});
            const page=await ctx.newPage();
            const failed=[];
            page.on('requestfailed',r=>{if(r.url().startsWith('https://raw.githubusercontent.com/'))failed.push({url:r.url(),failure:r.failure()?.errorText||''});});
            await page.goto(t.url,{waitUntil:'domcontentloaded',timeout:30000});
            await enter(page).catch(()=>{});
            await page.waitForTimeout(6500);
            report.rawOriginal[kind]=[...new Map(failed.map(x=>[x.url,x])).values()];
            await ctx.close();
          }

          async function verifyMappings(kind){
            const t=targets[kind];
            const out=[];
            for(const item of report.rawOriginal[kind]||[]){
              const u=new URL(item.url);
              const parts=u.pathname.split('/').filter(Boolean).map(decodeURIComponent);
              const [owner,repo,ref,...rest]=parts;
              const rel=rest.join('/');
              const local=path.resolve(t.root,rel);
              const inside=local===t.root||local.startsWith(t.root+path.sep);
              const exists=inside&&fs.existsSync(local)&&fs.statSync(local).isFile();
              const rec={url:item.url,failure:item.failure,owner,repo,ref,repoPath:rel,localPath:exists?path.relative(t.root,local):null,exists,mime:exists?mime(local):null,remoteHash:null,localHash:exists?sha256(fs.readFileSync(local)):null,exactEquivalent:false,remoteFetchStatus:null};
              if(owner==='avaldiviezoch'&&repo==='Wedding'&&exists){
                try{
                  const res=await fetch(item.url,{redirect:'follow'});
                  rec.remoteFetchStatus=res.status;
                  if(res.ok){const buf=Buffer.from(await res.arrayBuffer());rec.remoteHash=sha256(buf);rec.exactEquivalent=rec.remoteHash===rec.localHash;}
                }catch(e){rec.remoteFetchStatus='fetch-error:'+String(e);}
              }
              out.push(rec);
            }
            report.mappings[kind]=out;
          }

          async function addInstrumentation(page){
            await page.addInitScript(()=>{
              const started=performance.now();
              const nativeSetInterval=window.setInterval.bind(window);
              const nativeClearInterval=window.clearInterval.bind(window);
              window.__qaDate={started,registered:false,registerAt:null,callbacks:0,callbacksAtClear:null,cleared:false,clearAt:null,events:[],id:null};
              const countVisible=()=>{
                try{
                  const d1=document.querySelector('#invite')?.contentDocument;
                  const d2=d1?.querySelector('#inviteFrame')?.contentDocument;
                  const doc=d2?.querySelector('#inv5')?.contentDocument;
                  if(!doc?.body)return {friday:0,saturday:0,nodes:[]};
                  const walker=doc.createTreeWalker(doc.body,NodeFilter.SHOW_TEXT);
                  let n,friday=0,saturday=0;const nodes=[];
                  while((n=walker.nextNode())){
                    const v=n.nodeValue?.trim(); if(v!=='Viernes'&&v!=='Sábado')continue;
                    const p=n.parentElement;if(!p)continue;
                    if(['SCRIPT','STYLE','NOSCRIPT','TEMPLATE'].includes(p.tagName))continue;
                    const cs=doc.defaultView.getComputedStyle(p);
                    if(cs.display==='none'||cs.visibility==='hidden'||Number(cs.opacity)===0||p.getClientRects().length===0)continue;
                    if(v==='Viernes')friday++;else saturday++;
                    nodes.push({value:v,tag:p.tagName,className:p.className,id:p.id});
                  }
                  return {friday,saturday,nodes};
                }catch(e){return {friday:0,saturday:0,nodes:[],error:String(e)};}
              };
              window.__qaCountVisibleDate=countVisible;
              window.setInterval=(fn,ms,...args)=>{
                const src=String(fn);
                const isSecond=ms===250&&src.includes('createTreeWalker')&&src.includes('Viernes')&&src.includes('attempts >= 160')&&!src.includes('patchWeddingDay()');
                if(!isSecond)return nativeSetInterval(fn,ms,...args);
                window.__qaDate.registered=true;window.__qaDate.registerAt=performance.now()-started;
                const wrapped=(...inner)=>{
                  const before=countVisible();window.__qaDate.callbacks++;
                  const callbackNo=window.__qaDate.callbacks;
                  const at=performance.now()-started;
                  let ret;
                  try{return (ret=fn(...inner));}
                  finally{const after=countVisible();window.__qaDate.events.push({callbackNo,at,before,after});}
                };
                const id=nativeSetInterval(wrapped,ms,...args);window.__qaDate.id=id;return id;
              };
              window.clearInterval=(id)=>{
                if(window.__qaDate.id===id&&!window.__qaDate.cleared){window.__qaDate.cleared=true;window.__qaDate.clearAt=performance.now()-started;window.__qaDate.callbacksAtClear=window.__qaDate.callbacks;window.__qaDate.events.push({type:'clearInterval',at:window.__qaDate.clearAt,callbacks:window.__qaDate.callbacks,state:countVisible()});}
                return nativeClearInterval(id);
              };
            });
          }

          async function runRouted(kind,vpName){
            const t=targets[kind];
            const ctx=await browser.newContext({viewport:viewports[vpName],reducedMotion:'reduce'});
            const page=await ctx.newPage();
            await addInstrumentation(page);
            const verified=(report.mappings[kind]||[]).filter(x=>x.exactEquivalent);
            const intercepted=[];
            for(const m of verified){
              await page.route(m.url,async route=>{
                const body=fs.readFileSync(path.resolve(t.root,m.repoPath));
                intercepted.push({url:m.url,localPath:m.localPath,mime:m.mime,bytes:body.length});
                await route.fulfill({status:200,contentType:m.mime,body,headers:{'access-control-allow-origin':'*','cache-control':'no-store'}});
              });
            }
            const events={consoleError:[],pageerror:[],requestfailed:[],http:[]};
            page.on('console',m=>{if(m.type()==='error')events.consoleError.push(m.text());});
            page.on('pageerror',e=>events.pageerror.push(String(e)));
            page.on('requestfailed',r=>events.requestfailed.push({url:r.url(),failure:r.failure()?.errorText||''}));
            page.on('response',r=>{if(r.status()>=400)events.http.push({status:r.status(),url:r.url()});});
            await page.goto(t.url,{waitUntil:'domcontentloaded',timeout:30000});
            await enter(page);
            const samples=[];
            for(let i=0;i<120;i++){
              const s=await page.evaluate(()=>({at:performance.now()-window.__qaDate.started,state:window.__qaCountVisibleDate(),callbacks:window.__qaDate.callbacks,cleared:window.__qaDate.cleared}));
              const prev=samples.at(-1);
              if(!prev||JSON.stringify(prev.state)!==JSON.stringify(s.state)||prev.callbacks!==s.callbacks||prev.cleared!==s.cleared)samples.push(s);
              await page.waitForTimeout(100);
            }
            const final1=await page.evaluate(()=>({state:window.__qaCountVisibleDate(),qa:structuredClone(window.__qaDate)}));
            await page.waitForTimeout(1500);
            const final2=await page.evaluate(()=>({state:window.__qaCountVisibleDate(),callbacks:window.__qaDate.callbacks,cleared:window.__qaDate.cleared}));
            const deep=page.frameLocator('#invite').frameLocator('#inviteFrame').frameLocator('#inv5');
            const dateText=final2.state.saturday?'Sábado':'Viernes';
            const dateLoc=deep.getByText(dateText,{exact:true}).first();
            const shotDir=path.join(ROOT,'screenshots');fs.mkdirSync(shotDir,{recursive:true});
            if(await dateLoc.count()){
              const parent=dateLoc.locator('xpath=ancestor::*[self::section or self::div][1]');
              await (await parent.count()?parent:dateLoc).screenshot({path:path.join(shotDir,`${kind}-${vpName}-date.png`),animations:'disabled'}).catch(()=>{});
            }
            report.runs[`${kind}-${vpName}`]={sha:t.sha,viewport:viewports[vpName],intercepted:[...new Map(intercepted.map(x=>[x.url,x])).values()],samples,final:final1,after1500:final2,events};
            await ctx.close();
          }

          for(const kind of Object.keys(targets)){await discoverRaw(kind);await verifyMappings(kind);}
          for(const vp of Object.keys(viewports))for(const kind of Object.keys(targets))await runRouted(kind,vp);
          await browser.close();

          fs.writeFileSync(path.join(ROOT,'report.json'),JSON.stringify(report,null,2));
          const lines=[];
          for(const kind of Object.keys(targets)){
            for(const r of report.rawOriginal[kind]||[])lines.push(`ORB_ORIGINAL|${kind}|${r.failure}|${r.url}`);
            for(const m of report.mappings[kind]||[])lines.push(`MAP|${kind}|exact=${m.exactEquivalent}|exists=${m.exists}|mime=${m.mime}|${m.url}|${m.localPath||'NO_LOCAL'}|remoteHash=${m.remoteHash||'NA'}|localHash=${m.localHash||'NA'}`);
          }
          for(const [key,r] of Object.entries(report.runs)){
            const q=r.final.qa;const s=r.after1500.state;
            lines.push(`RESULT|${key}|friday=${s.friday}|saturday=${s.saturday}|registered=${q.registered}|callbacks=${r.after1500.callbacks}|cleared=${r.after1500.cleared}|callbacksAtClear=${q.callbacksAtClear}|clearAtMs=${q.clearAt}|callbacksStableAfter1500=${q.callbacksAtClear===r.after1500.callbacks}|consoleError=${r.events.consoleError.length}|pageerror=${r.events.pageerror.length}|requestfailed=${r.events.requestfailed.length}|http=${r.events.http.length}`);
            lines.push(`INTERCEPTED|${key}|${r.intercepted.map(x=>x.url+' -> '+x.localPath).join(' ; ')}`);
            for(const e of q.events)if(e.type==='clearInterval'||e.after?.friday||e.after?.saturday)lines.push(`CALLBACK_EVENT|${key}|${JSON.stringify(e)}`);
            for(const f of r.events.requestfailed)lines.push(`FAIL_AFTER_ROUTE|${key}|${f.failure}|${f.url}`);
          }
          fs.writeFileSync(path.join(ROOT,'summary.txt'),lines.join('\n')+'\n');
          console.log('===== PR149 DATE QA SUMMARY =====');
          console.log(lines.join('\n'));
          console.log('===== END PR149 DATE QA SUMMARY =====');
          EOF
          node qa.mjs

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr149-friday-saturday-routed-qa
          path: qa-run/artifacts
          if-no-files-found: error
          retention-days: 30
