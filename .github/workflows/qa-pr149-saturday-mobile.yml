name: QA PR149 Saturday mobile

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  validate-mobile:
    if: github.event.pull_request.number == 149
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout functional HEAD
        uses: actions/checkout@v4
        with:
          ref: a30d58c6555dda61e6165fb6c8ff120eab3f4084
          path: qa/pr

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install ephemeral Chromium
        run: |
          mkdir -p qa-run && cd qa-run
          npm init -y >/dev/null
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Serve PR
        run: |
          python3 -m http.server 4174 --directory qa/pr >/tmp/pr-http.log 2>&1 &
          sleep 2

      - name: Validate Saturday mobile dynamically
        working-directory: qa-run
        run: |
          cat > validate-mobile.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';

          const ROOT=path.resolve('../qa/pr');
          const OUT=path.resolve('artifacts');
          fs.mkdirSync(OUT,{recursive:true});
          const APP_URL='http://127.0.0.1:4174/invitaciones/invitacion_6/';
          const SHA='a30d58c6555dda61e6165fb6c8ff120eab3f4084';
          const names=['video_de_saludo_2.mp4','video_entrada.mp4','fecha_regresiva_2.png','sake_binks.mp3','marco_de_fotos_2.png'];
          const mime={'.png':'image/png','.mp4':'video/mp4','.mp3':'audio/mpeg'};
          const rel=n=>'invitaciones/invitacion_6/'+n;
          const hash=p=>crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const html=fs.readFileSync(path.join(ROOT,'invitaciones/invitacion_6/invitacion_6_base_final.html'),'utf8');
          for(const n of names){const p=path.join(ROOT,rel(n));if(!fs.existsSync(p)||!html.includes(`'${n}'`))throw new Error('Unverified checkout asset '+n);}
          if(typeof globalThis.URL!=='function') throw new Error('globalThis.URL unavailable');
          new globalThis.URL('https://raw.githubusercontent.com/avaldiviezoch/Wedding/main/sake_binks.mp3');

          const browser=await chromium.launch({headless:true});
          const c=await browser.newContext({viewport:{width:390,height:844},reducedMotion:'reduce'});
          const p=await c.newPage();
          const net=[]; const js=[]; const routed=[];

          await p.addInitScript(()=>{
            const t0=performance.now();
            const events=[]; const ids=new WeakMap(); let seq=0; let timerSeq=0;
            const id=n=>{if(!n||typeof n!=='object')return null;if(!ids.has(n))ids.set(n,++seq);return ids.get(n)};
            const frame=()=>{try{return {url:location.href,frameId:frameElement?.id||'',name:window.name||''}}catch(_){return {url:location.href,frameId:'?',name:window.name||''}}};
            const slim=n=>{try{return {id:id(n),nodeName:n?.nodeName||null,isConnected:!!n?.isConnected,text:n?.textContent?.slice?.(0,120)??null,parentId:id(n?.parentNode),parentName:n?.parentNode?.nodeName||null,outerHTML:n?.outerHTML?.slice?.(0,500)??null}}catch(e){return {err:String(e)}}};
            const push=(type,data={})=>events.push({at:performance.now()-t0,type,frame:frame(),...data});
            const deepDate=()=>{try{const d1=document.querySelector('#invite')?.contentDocument,d2=d1?.querySelector('#inviteFrame')?.contentDocument,d=d2?.querySelector('#inv5')?.contentDocument,row=d?.querySelector('.invite-date-row');return {row:row?.textContent?.replace(/\s+/g,' ').trim()||null,viernes:[...d?.querySelectorAll?.('.invite-date-row span')||[]].filter(x=>x.textContent.trim()==='Viernes').length,sabado:[...d?.querySelectorAll?.('.invite-date-row span')||[]].filter(x=>x.textContent.trim()==='Sábado').length}}catch(e){return {error:String(e)}}};
            window.__satQA={events,snapshot:()=>events.slice(),deepDate};
            push('frame-init',{readyState:document.readyState});

            const origSI=window.setInterval,origCI=window.clearInterval;
            const timerMeta=new Map();
            window.setInterval=function(cb,delay,...args){
              const regStack=new Error('INTERVAL_REGISTER').stack||'';
              const qid=++timerSeq; let nativeId;
              const wrapped=typeof cb==='function'?function(...cbArgs){if(timerMeta.get(nativeId)?.visual)push('visual-corrector-callback',{qid,delay,observed:deepDate()});return cb.apply(this,cbArgs)}:cb;
              nativeId=origSI.call(this,wrapped,delay,...args);
              const visual=regStack.includes('visual-fidelity.js')&&Number(delay)===250;
              timerMeta.set(nativeId,{qid,delay,visual,regStack});
              if(visual)push('visual-corrector-register',{qid,delay,stack:regStack});
              return nativeId;
            };
            window.clearInterval=function(nativeId){const m=timerMeta.get(nativeId);if(m?.visual)push('visual-corrector-clearInterval',{qid:m.qid,delay:m.delay,observed:deepDate(),callbacksAtClear:events.filter(e=>e.type==='visual-corrector-callback'&&e.qid===m.qid).length});return origCI.call(this,nativeId)};

            const ep=Element.prototype,ih=Object.getOwnPropertyDescriptor(ep,'innerHTML');
            if(ih?.set&&ih?.get)Object.defineProperty(ep,'innerHTML',{configurable:ih.configurable,enumerable:ih.enumerable,get:ih.get,set:function(v){const s=String(v);if(this?.classList?.contains?.('invite-date-row')&&(s.includes('Viernes')||s.includes('Sábado')))push('date-row-innerHTML',{target:slim(this),newValue:s,stack:new Error('DATE_ROW_BUILD').stack});return ih.set.call(this,v)}});

            const attach=()=>{if(!document.documentElement)return false;const mo=new MutationObserver(ms=>{for(const m of ms){if(m.type==='childList'){for(const n of m.removedNodes){if(n.nodeType===1&&(n.matches?.('.invite-date-row')||n.querySelector?.('.invite-date-row')))push('date-row-remove',{parent:slim(m.target),node:slim(n.matches?.('.invite-date-row')?n:n.querySelector('.invite-date-row'))});}for(const n of m.addedNodes){if(n.nodeType===1&&(n.matches?.('.invite-date-row')||n.querySelector?.('.invite-date-row')))push('date-row-add',{parent:slim(m.target),node:slim(n.matches?.('.invite-date-row')?n:n.querySelector('.invite-date-row'))});}}else if(m.type==='characterData'&&(['Viernes','Sábado'].includes((m.oldValue||'').trim())||['Viernes','Sábado'].includes((m.target.nodeValue||'').trim())))push('date-text-mutation',{oldValue:m.oldValue,newValue:m.target.nodeValue,target:slim(m.target)});}});mo.observe(document.documentElement,{subtree:true,childList:true,characterData:true,characterDataOldValue:true});push('observer-attached');return true};
            if(!attach()){const s=origSI.call(window,()=>{if(attach())origCI.call(window,s)},1)}
          });

          await p.route('https://raw.githubusercontent.com/**',async r=>{
            const u=new globalThis.URL(r.request().url()),parts=u.pathname.split('/').filter(Boolean).map(decodeURIComponent);
            const [owner,repo,ref,...rest]=parts,n=rest.at(-1);
            if(owner==='avaldiviezoch'&&repo==='Wedding'&&ref==='main'&&names.includes(n)){
              const local=path.join(ROOT,rel(n));
              routed.push({url:r.request().url(),asset:n,local:rel(n),hash:hash(local)});
              return r.fulfill({status:200,contentType:mime[path.extname(n)],body:fs.readFileSync(local),headers:{'access-control-allow-origin':'*','cache-control':'no-store'}});
            }
            return r.continue();
          });

          p.on('console',m=>{if(m.type()==='error'||m.type()==='warning')js.push({type:'console.'+m.type(),text:m.text()})});
          p.on('pageerror',e=>js.push({type:'pageerror',text:e.message,stack:e.stack}));
          p.on('requestfailed',r=>net.push({type:'requestfailed',url:r.url(),failure:r.failure()?.errorText||''}));
          p.on('response',r=>{if(r.status()>=400)net.push({type:'http',status:r.status(),url:r.url()})});

          await p.goto(APP_URL,{waitUntil:'domcontentloaded',timeout:30000});
          await p.locator('#tapGuard').waitFor({state:'attached',timeout:15000});
          await p.locator('#tapGuard').click({position:{x:20,y:20}}).catch(()=>{});
          await p.waitForTimeout(700);
          await p.evaluate(()=>{try{const d1=document.querySelector('#invite')?.contentDocument,d2=d1?.querySelector('#inviteFrame')?.contentDocument,d=d2?.querySelector('#inv5')?.contentDocument,v=d?.getElementById('entryVideo');if(v){try{if(Number.isFinite(v.duration)&&v.duration>0)v.currentTime=Math.max(0,v.duration-.05)}catch(_){}v.dispatchEvent(new Event('ended'));}}catch(_){}});
          await p.waitForTimeout(3000);

          const deepFrame=p.frames().find(f=>f.url().includes('invitacion_5_base.html'));
          if(!deepFrame)throw new Error('Deep inv5 frame not found');
          const row=deepFrame.locator('.invite-date-row').last();
          await row.waitFor({state:'visible',timeout:10000});
          await row.screenshot({path:path.join(OUT,'mobile-date-row.png')});

          const final=await deepFrame.evaluate(()=>{
            const rendered=n=>{const e=n.parentElement;if(!e)return false;const s=getComputedStyle(e);return s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity)!==0&&e.getClientRects().length>0};
            let viernes=0,sabado=0;const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;
            while((n=w.nextNode())){const v=n.nodeValue?.trim();if(!rendered(n))continue;if(v==='Viernes')viernes++;if(v==='Sábado')sabado++;}
            const r=document.querySelector('.invite-date-row');return {viernes,sabado,row:r?.textContent?.replace(/\s+/g,' ').trim()||null,rowHTML:r?.outerHTML||null};
          });

          const frameEvents=[];
          for(const f of p.frames()){try{const ev=await f.evaluate(()=>window.__satQA?.snapshot?.()||[]);for(const e of ev)frameEvents.push(e)}catch(_){}}
          const builds=frameEvents.filter(e=>e.type==='date-row-innerHTML');
          const callbacks=frameEvents.filter(e=>e.type==='visual-corrector-callback');
          const clears=frameEvents.filter(e=>e.type==='visual-corrector-clearInterval');
          const lastClear=clears.at(-1)?.at??null;
          const callbacksAfter15=lastClear==null?[]:callbacks.filter(e=>e.at>lastClear+1500);
          const knownNet=net.filter(e=>e.type==='requestfailed'&&e.url==='https://raw.githubusercontent.com/avaldiviezoch/Wedding/main/sake_binks.mp3'&&e.failure==='net::ERR_ABORTED');
          const blockingNet=net.filter(e=>!knownNet.includes(e));
          const out={viewport:{width:390,height:844},sha:SHA,final,routed,js,net,knownNet,blockingNet,builds,callbacks,clears,callbacksAfter15,events:frameEvents};
          fs.writeFileSync(path.join(OUT,'mobile.json'),JSON.stringify(out,null,2));
          console.log(`RESULT|mobile|${JSON.stringify({final,builds:builds.map(e=>({at:e.at,newValue:e.newValue})),callbacks:callbacks.map(e=>({at:e.at,observed:e.observed})),clears:clears.map(e=>({at:e.at,observed:e.observed,callbacksAtClear:e.callbacksAtClear})),callbacksAfter15:callbacksAfter15.length,jsErrors:js.length,knownNet,blockingNet,routed:routed.map(x=>x.asset)})}`);
          if(final.viernes!==0)throw new Error(`mobile: Viernes final != 0`);
          if(final.sabado<1||final.row!=='Sábado162027')throw new Error(`mobile: canonical Saturday row missing: ${JSON.stringify(final)}`);
          if(builds.length<1||builds.some(e=>e.newValue.includes('Viernes'))||builds.some(e=>!e.newValue.includes('Sábado')))throw new Error(`mobile: a reconstruction did not generate Saturday directly`);
          if(clears.length<1)throw new Error(`mobile: visual-fidelity clearInterval not observed`);
          if(callbacksAfter15.length!==0)throw new Error(`mobile: visual corrector callbacks continued 1.5s after clearInterval`);
          if(js.length)throw new Error(`mobile: JS console/page errors present: ${JSON.stringify(js)}`);
          if(blockingNet.length)throw new Error(`mobile: blocking network failures present: ${JSON.stringify(blockingNet)}`);
          for(const n of names)if(!routed.some(x=>x.asset===n))throw new Error(`mobile: ORB asset was not intercepted: ${n}`);
          if(knownNet.length>1)throw new Error(`mobile: unexpected duplicate known MP3 aborts: ${JSON.stringify(knownNet)}`);
          if(knownNet.length===1)console.log('KNOWN NON-BLOCKING QA NETWORK ABORT|sake_binks.mp3|net::ERR_ABORTED');
          await c.close();
          await browser.close();
          EOF
          node --check validate-mobile.mjs
          node validate-mobile.mjs

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr149-saturday-mobile-validation
          path: qa-run/artifacts
          if-no-files-found: error
          retention-days: 30
