name: Upgrade RSVP Native

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-rsvp-native.yml'
      - '.github/triggers/upgrade_rsvp_native.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrar RSVP en Invitados
        run: python3 .github/triggers/upgrade_rsvp_native.py

      - name: Validar JavaScript
        run: |
          cp app_integral/js/modules/invitados/index.js /tmp/invitados-rsvp.mjs
          cp app_integral/js/modules/invitados/rsvp-service.js /tmp/rsvp-service.mjs
          cp app_integral/js/modules/invitados/rsvp-public.js /tmp/rsvp-public.mjs
          node --check /tmp/invitados-rsvp.mjs
          node --check /tmp/rsvp-service.mjs
          node --check /tmp/rsvp-public.mjs

      - name: Validar integración heredada
        run: |
          grep -q "js/modules/invitados/index.js?v=20260814-1205-rsvp1" app_integral/applu.html
          grep -q "js/modules/invitados/index.js?v=20260814-1205-rsvp1" applu.html
          python3 - <<'PY'
          from pathlib import Path
          import base64, json
          text=Path('app_integral/js/legacy/applu-script-01.js').read_text(encoding='utf-8')
          start=text.find('const MODULES = ')+len('const MODULES = ')
          end=text.find(';\n',start)
          modules=json.loads(text[start:end])
          decoded=base64.b64decode(modules['invitados']['html']).decode('utf-8')
          assert 'MIGRANDIA_RSVP_SYNC' in decoded
          assert 'RSVP nativo' in decoded
          print('INVITADOS_RSVP_BRIDGE_OK')
          PY

      - name: Compilar reglas Firestore
        run: npx --yes firebase-tools emulators:exec --only firestore --project demo-migrandia "echo FIRESTORE_RULES_OK"

      - name: Guardar cambios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app_integral/applu.html applu.html app_integral/js/legacy/applu-script-01.js
          if git diff --cached --quiet; then
            echo 'Sin cambios estructurales'
            exit 0
          fi
          git commit -m 'Integrar RSVP nativo en Invitados'
          git push origin HEAD:main
