name: Ajuste Nuestra Boda invitacion 1

on:
  push:
    paths:
      - '.github/workflows/ajuste-nuestra-boda-invitacion-1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Bajar ligeramente Nuestra Boda
        shell: bash
        run: >-
          python3 -c "from pathlib import Path; p=Path('invitacion_1.html'); t=p.read_text(encoding='utf-8'); old='.invite-main-title{\n  top:51.2%;'; new='.invite-main-title{\n  top:52.0%;'; assert old in t, 'No se encontro la posicion actual'; p.write_text(t.replace(old,new,1), encoding='utf-8')"

      - name: Validar cambio
        shell: bash
        run: grep -Fq '.invite-main-title{' invitacion_1.html && grep -Fq 'top:52.0%;' invitacion_1.html

      - name: Commit y limpiar workflow temporal
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ajuste-nuestra-boda-invitacion-1.yml
          git add invitacion_1.html
          git commit -m "Bajar ligeramente Nuestra Boda en invitacion 1"
          git push origin main
