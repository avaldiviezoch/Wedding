name: Ajuste Nuestra Boda invitacion 1

on:
  push:
    paths:
      - '.github/workflows/ajuste-nuestra-boda-invitacion-1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Bajar ligeramente Nuestra Boda
        shell: bash
        run: >-
          python3 -c "from pathlib import Path; p=Path('invitacion_1.html'); t=p.read_text(encoding='utf-8'); old1='.invite-main-title{\n  top:51.2%;'; new1='.invite-main-title{\n  top:52.0%;'; old2='  .invite-main-title{\n    top:51.5%;'; new2='  .invite-main-title{\n    top:52.3%;'; assert old1 in t, 'No se encontro posicion general'; assert old2 in t, 'No se encontro posicion movil'; t=t.replace(old1,new1,1).replace(old2,new2,1); p.write_text(t, encoding='utf-8')"

      - name: Validar cambio
        shell: bash
        run: grep -Fq 'top:52.0%;' invitacion_1.html && grep -Fq 'top:52.3%;' invitacion_1.html

      - name: Commit y limpiar workflow temporal
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ajuste-nuestra-boda-invitacion-1.yml
          git add invitacion_1.html
          git commit -m "Bajar ligeramente Nuestra Boda en invitacion 1"
          git push origin main
