name: Homogeneizar ubicación invitaciones
"on":
  push:
    paths:
      - .github/triggers/homogeneizar-ubicacion.txt
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar cambios
        run: python3 .github/scripts/homogeneizar_ubicacion_4_invitaciones.py
      - name: Validar
        run: |
          grep -q -- '-12.081273940768412' invitacion_1.html
          grep -q -- '-12.081273940768412' invitacion_2.html
          grep -q -- '-12.081273940768412' invitacion_3.html
          grep -q -- '-12.081273940768412' invitacion_4.html
          ! grep -q 'Casa Acapulco' invitacion_1.html
          ! grep -q 'Casa Acapulco' invitacion_2.html
          ! grep -q 'Casa Acapulco' invitacion_3.html
          ! grep -q 'Casa Acapulco' invitacion_4.html
      - name: Limpiar temporales
        run: rm -f .github/scripts/homogeneizar_ubicacion_4_invitaciones.py .github/workflows/homogeneizar-ubicacion-invitaciones.yml .github/triggers/homogeneizar-ubicacion.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Homogeneizar ubicación en las 4 invitaciones"
          git push
