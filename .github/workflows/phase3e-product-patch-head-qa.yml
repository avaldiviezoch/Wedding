name: Phase 3E product patch and HEAD QA
on:
  push:
    branches: [perf/invitacion6-phase3e-audio-video-network]
    paths: ['.github/workflows/phase3e-product-patch-head-qa.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-and-qa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/invitacion6-phase3e-audio-video-network
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact three-string product patch
        shell: bash
        run: |
          set -euo pipefail
          FILE=invitaciones/invitacion_6/invitacion_5_base.html
          cp "$FILE" /tmp/phase3e-before.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('invitaciones/invitacion_6/invitacion_5_base.html')
          b=p.read_bytes()
          reps=[
            (b'https://raw.githubusercontent.com/avaldiviezoch/Wedding/main/sake_binks.mp3',b'./sake_binks.mp3'),
            (b'https://raw.githubusercontent.com/avaldiviezoch/Wedding/main/video_entrada.mp4',b'./video_entrada.mp4'),
            (b'https://raw.githubusercontent.com/avaldiviezoch/Wedding/main/video_de_saludo_2.mp4',b'./video_de_saludo_2.mp4'),
          ]
          for old,new in reps:
            n=b.count(old)
            print('MATCH',old.decode(),n)
            if n != 1: raise SystemExit(f'expected exactly one match, got {n}: {old!r}')
            b=b.replace(old,new,1)
          p.write_bytes(b)
          PY
          python3 - <<'PY'
          from pathlib import Path
          base=Path('/tmp/phase3e-before.html').read_bytes()
          head=Path('invitaciones/invitacion_6/invitacion_5_base.html').read_bytes()
          expected=base
          for old,new in [
            (b'https://raw.githubusercontent.com/avaldiviezoch/Wedding/main/sake_binks.mp3',b'./sake_binks.mp3'),
            (b'https://raw.githubusercontent.com/avaldiviezoch/Wedding/main/video_entrada.mp4',b'./video_entrada.mp4'),
            (b'https://raw.githubusercontent.com/avaldiviezoch/Wedding/main/video_de_saludo_2.mp4',b'./video_de_saludo_2.mp4')]: expected=expected.replace(old,new,1)
          assert head==expected, 'bytes outside authorized substitutions changed'
          print('BYTE_SAFE=true')
          PY
          git diff --check
          git diff -- "$FILE"
      - name: Install isolated Playwright
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/phase3e-playwright
          mkdir -p /tmp/phase3e-playwright
          cd /tmp/phase3e-playwright
          npm init -y >/dev/null
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          test ! -e "$GITHUB_WORKSPACE/package-lock.json"
      - name: Browser HEAD QA through real iframe architecture
        shell: bash
        env:
          NODE_PATH: /tmp/phase3e-playwright/node_modules
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/phase3e-http.log 2>&1 & PID=$!; trap 'kill $PID || true' EXIT; sleep 2
          node <<'NODE'
          const {chromium}=require('playwright');
          const targets=['sake_binks.mp3','video_entrada.mp4','video_de_saludo_2.mp4'];
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function mediaState(page){return await page.evaluate(()=>{
            const fs=[window,...Array.from(document.querySelectorAll('iframe')).map(x=>{try{return x.contentWindow}catch{return null}}).filter(Boolean)];
            function walk(w,out=[]){try{out.push(w);for(const f of w.document.querySelectorAll('iframe')){try{if(f.contentWindow&&!out.includes(f.contentWindow))walk(f.contentWindow,out)}catch{}}}catch{}return out}
            const wins=walk(window); let audio=null,entry=null,saludo=null;
            for(const w of wins){try{for(const e of w.document.querySelectorAll('audio')){if((e.src||'').includes('sake_binks.mp3')) audio={src:e.getAttribute('src'),currentSrc:e.currentSrc,readyState:e.readyState,networkState:e.networkState,paused:e.paused,loop:e.loop,preload:e.preload,currentTime:e.currentTime}}
              for(const e of w.document.querySelectorAll('video')){const u=e.currentSrc||e.src||'';const o={src:e.getAttribute('src'),currentSrc:e.currentSrc,readyState:e.readyState,networkState:e.networkState,paused:e.paused,preload:e.preload,muted:e.muted,loop:e.loop,playsInline:e.playsInline,currentTime:e.currentTime};if(u.includes('video_entrada.mp4'))entry=o;if(u.includes('video_de_saludo_2.mp4'))saludo=o}}
            catch{}}
            return {audio,entry,saludo,frames:wins.length};
          })}
          async function run(label,width,height){
            const browser=await chromium.launch({headless:true}); const context=await browser.newContext({viewport:{width,height},serviceWorkers:'block'}); const page=await context.newPage();
            let stage='T0';const reqs=[],fails=[],errs=[];page.on('console',m=>{if(m.type()==='error')errs.push(m.text())});page.on('request',r=>{if(targets.some(x=>r.url().includes(x)))reqs.push({stage,url:r.url(),type:r.resourceType()})});page.on('requestfailed',r=>{if(targets.some(x=>r.url().includes(x)))fails.push({stage,url:r.url(),error:r.failure()?.errorText})});
            await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'domcontentloaded'});await sleep(1500);stage='T1';const before=await mediaState(page);
            stage='T2';await page.mouse.click(Math.floor(width/2),Math.floor(height/2));await sleep(1000);const after1=await mediaState(page);stage='T3';await sleep(3500);const during=await mediaState(page);stage='T4';await sleep(3500);const reveal=await mediaState(page);
            stage='T5';for(const f of page.frames()){try{await f.evaluate(async()=>{for(let y=0;y<document.body.scrollHeight;y+=Math.max(400,innerHeight*.8)){scrollTo(0,y);await new Promise(r=>setTimeout(r,80))}scrollTo(0,document.body.scrollHeight)})}catch{}}await sleep(1000);const final=await mediaState(page);
            const perf=await page.evaluate(()=>performance.getEntriesByType('resource').map(r=>({name:r.name,transferSize:r.transferSize,encodedBodySize:r.encodedBodySize,startTime:r.startTime})));const sum=(a,k)=>a.reduce((s,x)=>s+(x[k]||0),0);const metrics={requests:perf.length,transfer:sum(perf,'transferSize'),encoded:sum(perf,'encodedBodySize'),first3:sum(perf.filter(x=>x.startTime<=3000),'transferSize'),first5:sum(perf.filter(x=>x.startTime<=5000),'transferSize')};
            const raw=reqs.filter(x=>x.url.includes('raw.githubusercontent.com')); const orb=fails.filter(x=>x.url.includes('raw.githubusercontent.com')&&String(x.error).includes('ORB'));
            console.log('PHASE3E_HEAD='+JSON.stringify({label,viewport:{width,height},rawRequests:raw.length,rawOrb:orb.length,reqs,fails,errs,states:{before,after1,during,reveal,final},metrics}));
            if(raw.length!==0) throw new Error(label+' raw requests remain: '+raw.length);
            await browser.close();
          }
          (async()=>{await run('desktop',1366,768);await run('mobile',390,844)})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Repository tests
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm test
          test ! -e package-lock.json
      - name: Commit product file only
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "invitaciones/invitacion_6/invitacion_5_base.html"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add invitaciones/invitacion_6/invitacion_5_base.html
          git commit -m "perf(inv6): replace broken raw media URLs with local assets"
          git push origin HEAD:perf/invitacion6-phase3e-audio-video-network
