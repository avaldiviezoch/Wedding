name: Corregir boton Invitar

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-invite-feedback.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar parche
        run: python3 scripts/fix_invite_feedback.py

      - name: Validar JavaScript
        shell: bash
        run: |
          cp app_integral/js/services/firebase.js /tmp/firebase.mjs
          cp app_integral/js/modules/configuracion/weddings.js /tmp/weddings.mjs
          node --check /tmp/firebase.mjs
          node --check /tmp/weddings.mjs
          grep -q "listWeddingInvitations" app_integral/js/services/firebase.js
          grep -q "Invitación pendiente" app_integral/js/modules/configuracion/weddings.js
          grep -q "z-index:10200" app_integral/css/modules/weddings.css

      - name: Commit corrección
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app_integral
          git diff --cached --quiet && exit 0
          git commit -m "Corregir feedback y estado del boton Invitar"
          git push origin HEAD:main
