name: Agregar te esperamos 2
on:
  push:
    paths:
      - '.github/triggers/agregar-te-esperamos-2.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar cambio
        shell: python
        run: |
          from pathlib import Path
          p=Path('invitacion_2.html')
          s=p.read_text(encoding='utf-8')
          old='<h2 class="final-title">Te esperamos</h2>\n          <p class="wait-message">'
          new='<h2 class="final-title">Te esperamos</h2>\n          <img class="te-esperamos-gif" src="https://raw.githubusercontent.com/avaldiviezoch/Wedding/main/te_esperamos_2.gif?v=20260812-1" alt="Animación de despedida" loading="lazy">\n          <p class="wait-message">'
          if old not in s:
              raise SystemExit('No se encontro el titulo Te esperamos')
          s=s.replace(old,new,1)
          css='''\n    /* ===== GIF TE ESPERAMOS — INVITACION 2 ===== */\n    .te-esperamos-gif{\n      display:block;\n      width:min(38vw,230px);\n      max-width:230px;\n      height:auto;\n      margin:12px auto 14px;\n      background:transparent;\n      filter:drop-shadow(0 7px 10px rgba(88,72,54,.08));\n      animation:teEsperamosFloat 4.8s ease-in-out infinite;\n    }\n    @keyframes teEsperamosFloat{\n      0%,100%{transform:translateY(0);}\n      50%{transform:translateY(-5px);}\n    }\n    @media(max-width:520px){\n      .te-esperamos-gif{width:min(48vw,200px);max-width:200px;margin:10px auto 12px;}\n    }\n'''
          if 'GIF TE ESPERAMOS — INVITACION 2' not in s:
              s=s.replace('</style>',css+'\n  </style>',1)
          p.write_text(s,encoding='utf-8')
      - name: Validar
        run: |
          grep -q 'te_esperamos_2.gif' invitacion_2.html
          grep -q 'class="te-esperamos-gif"' invitacion_2.html
          grep -q 'GIF TE ESPERAMOS' invitacion_2.html
      - name: Limpiar temporales
        run: |
          rm -f .github/workflows/agregar-te-esperamos-2.yml
          rm -f .github/triggers/agregar-te-esperamos-2.txt
      - name: Commit
        run: |
          git config user.name avaldiviezoch
          git config user.email 155109177+avaldiviezoch@users.noreply.github.com
          git add invitacion_2.html .github/workflows/agregar-te-esperamos-2.yml .github/triggers/agregar-te-esperamos-2.txt
          git commit -m 'Agregar gif Te esperamos en invitacion 2'
          git push
