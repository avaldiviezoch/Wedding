  letter-spacing:2px;
  color:#7C8069 !important;
  text-transform:uppercase;
}

.dj-music-panel{
  width:min(100%,460px);
  max-height:0;
  overflow:hidden;
  opacity:0;
  transform:translateY(-8px);
  margin:0 auto;
  transition:max-height .55s ease,opacity .4s ease,transform .45s ease,margin .45s ease;
}

.dj-music-panel.open{
  max-height:620px;
  opacity:1;
  transform:translateY(0);
  margin-top:14px;
}

.dj-music-form{
  padding:20px 18px;
  border-radius:24px;
  background:rgba(251,248,239,.72);
  border:1px solid rgba(102,112,63,.18);
