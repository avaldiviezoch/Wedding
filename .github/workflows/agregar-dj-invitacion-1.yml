name: Agregar DJ invitacion 1
on:
  push:
    paths:
      - '.github/workflows/agregar-dj-invitacion-1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar cambio
        run: |
          echo '' | base64 -d > /tmp/patch_dj.py
          python /tmp/patch_dj.py
      - name: Validar
        run: |
          grep -q "musica_dj_1.gif" invitacion_1.html
          grep -q "musicGuestName" invitacion_1.html
          grep -q "MUSIC_INVITATION_NAME" invitacion_1.html
      - name: Commit y limpiar workflow temporal
        run: |
          rm .github/workflows/agregar-dj-invitacion-1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add invitacion_1.html .github/workflows/agregar-dj-invitacion-1.yml
          git commit -m "Agregar pedidos musicales DJ a invitación 1"
          git push
