          section = r'''

<!-- ===== DJ PEDIDOS MUSICALES — INVITACION 1 ===== -->
<section class="reveal-section dj-music-section" id="musicSection" aria-label="Pedidos musicales para el DJ">
  <div class="dj-music-card">
    <div class="dj-music-kicker">Nuestra banda sonora</div>
    <h2 class="dj-music-title">Pedidos musicales</h2>
    <p class="dj-music-copy">¿Hay una canción que te gustaría escuchar durante la recepción o la fiesta? Déjanos tu pedido para considerarlo con anticipación.</p>
    <p class="dj-music-warning">El DJ no aceptará pedidos musicales durante la celebración, así que este será el momento para compartirnos tu canción.</p>

    <div class="dj-music-image-stage" id="musicImageStage" role="button" tabindex="0" aria-controls="music-request-panel" aria-expanded="false" onclick="openMusicRequest()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openMusicRequest();}">
      <img class="dj-music-image" src="https://raw.githubusercontent.com/avaldiviezoch/Wedding/main/musica_dj_1.gif" alt="DJ animado para dejar un pedido musical" loading="lazy">
    </div>

    <p class="dj-music-hint">Toca el DJ para dejar tu canción</p>

    <div id="music-request-panel" class="dj-music-panel">
      <div class="dj-music-form">
        <input id="musicGuestName" class="dj-music-field" type="text" maxlength="100" autocomplete="name" placeholder="Tu nombre completo">
        <input id="musicSongName" class="dj-music-field" type="text" maxlength="150" placeholder="Nombre de la canción">
        <input id="musicArtistName" class="dj-music-field" type="text" maxlength="150" placeholder="Artista">
        <textarea id="musicComment" class="dj-music-field" maxlength="300" placeholder="Comentario o dedicatoria (opcional)"></textarea>
        <button id="submitMusicBtn" class="dj-music-send" type="button" onclick="sendMusicRequest()">Enviar pedido musical →</button>
      </div>
    </div>

    <p id="music-success" class="dj-music-success">¡Pedido musical enviado! 🎵</p>
  </div>
</section>
'''

          js = r'''

<script>
// ===== PEDIDOS MUSICALES — MISMO FORMULARIO / DESTINO DE LAS OTRAS INVITACIONES =====
const MUSIC_REQUEST_URL = "https://script.google.com/macros/s/AKfycbzrxfoPVuu5u1ZOn570xnSQfOeLHnt5oK8wiuksxKZCEpAVWkwehR5LlNZVJNkTJFli/exec";
const MUSIC_INVITATION_NAME = "Invitación 1";

function launchMusicNotes(stage,total=8){
  if(!stage) return;
  const notes=['♪','♫','♩'];
  for(let i=0;i<total;i++){
    const note=document.createElement('span');
    note.className='dj-note-particle';
    note.textContent=notes[Math.floor(Math.random()*notes.length)];
    note.style.setProperty('--dx',`${-110+Math.random()*220}px`);
    note.style.setProperty('--dy',`${-80-Math.random()*105}px`);
    note.style.setProperty('--rot',`${-35+Math.random()*70}deg`);
    note.style.animationDelay=`${i*45}ms`;
    stage.appendChild(note);
    setTimeout(()=>note.remove(),1900+i*45);
  }
}

function openMusicRequest(){
  const panel=document.getElementById('music-request-panel');
  const stage=document.getElementById('musicImageStage');
  if(!panel) return;

  const willOpen=!panel.classList.contains('open');
  panel.classList.toggle('open',willOpen);

  if(stage){
    stage.setAttribute('aria-expanded',String(willOpen));
    launchMusicNotes(stage,8);
  }

  if(willOpen){
    setTimeout(()=>{
      const input=document.getElementById('musicGuestName');
      if(input) input.focus({preventScroll:true});
    },450);
  }
}

function buildMusicRequestId(){
  const now=new Date();
  const pad=n=>String(n).padStart(2,'0');
  const date=`${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}`;
  const time=`${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
  const random=Math.random().toString(36).slice(2,7).toUpperCase();
  return `PM-${date}-${time}-${random}`;
}

function sendMusicRequest(){
  const name=(document.getElementById('musicGuestName')?.value||'').trim();
  const song=(document.getElementById('musicSongName')?.value||'').trim();
  const artist=(document.getElementById('musicArtistName')?.value||'').trim();
  const comment=(document.getElementById('musicComment')?.value||'').trim();
  const button=document.getElementById('submitMusicBtn');
  const panel=document.getElementById('music-request-panel');
  const success=document.getElementById('music-success');

  if(!name || !song || !artist){
    alert('Por favor completa tu nombre, la canción y el artista.');
    return;
  }

  const requestId=buildMusicRequestId();
  const sentAt=new Date().toISOString();

  if(button){
    button.disabled=true;
    button.textContent='Enviando...';
  }

  fetch(MUSIC_REQUEST_URL,{
    method:'POST',
    mode:'no-cors',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      fecha_hora:sentAt,
      fechaHora:sentAt,
      nombre:name,
      cancion:song,
      artista:artist,
      invitacion:MUSIC_INVITATION_NAME,
      estado:'Pendiente',
      id:requestId,
      observacion:'',
      comentario:comment
    })
  }).catch(()=>{}).finally(()=>{
    if(panel) panel.classList.remove('open');
    if(success) success.style.display='block';
    if(button){
      button.disabled=false;
      button.textContent='Enviar pedido musical →';
    }
    ['musicGuestName','musicSongName','musicArtistName','musicComment'].forEach(id=>{
      const field=document.getElementById(id);
      if(field) field.value='';
    });
    const stage=document.getElementById('musicImageStage');
    if(stage){
      stage.setAttribute('aria-expanded','false');
      launchMusicNotes(stage,12);
    }
  });
}
</script>
'''

          if '</style>' not in s or '<footer>' not in s or '</body>' not in s:
              raise SystemExit('No se encontraron anclas esperadas en invitacion_1.html')

          s = s.replace('</style>', css + '\n</style>', 1)
          s = s.replace('<footer>', section + '\n<footer>', 1)
          s = s.replace('</body>', js + '\n</body>', 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validar
        run: |
          grep -q "DJ PEDIDOS MUSICALES — INVITACION 1" invitacion_1.html
          grep -q "musica_dj_1.gif" invitacion_1.html
          grep -q 'MUSIC_INVITATION_NAME = "Invitación 1"' invitacion_1.html
          grep -q "musicGuestName" invitacion_1.html
          grep -q "musicSongName" invitacion_1.html
          grep -q "musicArtistName" invitacion_1.html
          grep -q "musicComment" invitacion_1.html
          grep -q "AKfycbzrxfoPVuu5u1ZOn570xnSQfOeLHnt5oK8wiuksxKZCEpAVWkwehR5LlNZVJNkTJFli" invitacion_1.html

      - name: Commit y limpiar workflow temporal
        run: |
          rm .github/workflows/agregar-dj-invitacion-1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add invitacion_1.html .github/workflows/agregar-dj-invitacion-1.yml
          git commit -m "Agregar pedidos musicales DJ a invitación 1"
