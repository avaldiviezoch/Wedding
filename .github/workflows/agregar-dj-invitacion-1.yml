name: Agregar DJ invitacion 1
on:
  push:
    paths:
      - '.github/workflows/agregar-dj-invitacion-1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Agregar seccion DJ
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('invitacion_1.html')
          s = p.read_text(encoding='utf-8')

          marker = 'DJ PEDIDOS MUSICALES — INVITACION 1'
          if marker in s:
              raise SystemExit('La sección DJ ya existe; no se duplica.')

          css = r'''

/* ===== DJ PEDIDOS MUSICALES — INVITACION 1 ===== */
.dj-music-section{
