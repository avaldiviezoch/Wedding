  color:#303827 !important;
  margin:0 0 10px !important;
}

.dj-music-copy{
  max-width:430px;
  margin:0 auto 10px !important;
  font-family:"Cormorant Garamond",serif;
  font-size:17px;
  line-height:1.55;
  color:#4F5741 !important;
}

.dj-music-warning{
  max-width:440px;
  margin:12px auto 12px !important;
  padding:11px 14px;
  border:1px solid rgba(102,112,63,.18);
  border-radius:18px;
  font-family:"Montserrat",sans-serif;
  font-size:12px;
  line-height:1.55;
  color:#66703F !important;
