  color:#8B8B59;
  text-transform:uppercase;
  margin-bottom:7px;
}

.dj-music-title{
  font-family:"Great Vibes",cursive !important;
  font-size:clamp(52px,11vw,76px) !important;
  line-height:1 !important;
