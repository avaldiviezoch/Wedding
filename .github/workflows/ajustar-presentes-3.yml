name: Ajustar presentes invitacion 3
on:
  push:
    paths:
      - '.github/workflows/ajustar-presentes-3.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar Presentes
        run: python .github/scripts/ajustar-presentes-3.py
      - name: Validar
        run: |
          grep -q '¿Quieres dejarnos un detalle?' invitacion_3.html
          grep -q 'Lo más importante para nosotros es compartir este día contigo' invitacion_3.html
          grep -q '← Volver a la animación' invitacion_3.html
      - name: Commit y limpiar temporales
        run: |
          rm .github/scripts/ajustar-presentes-3.py .github/workflows/ajustar-presentes-3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add invitacion_3.html .github/scripts/ajustar-presentes-3.py .github/workflows/ajustar-presentes-3.yml
          git commit -m "Suavizar sección Presentes en invitación 3"
          git push
