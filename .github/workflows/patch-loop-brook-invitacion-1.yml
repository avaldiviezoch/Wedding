name: Patch loop video y Brook invitacion 1

on:
  push:
    paths:
      - '.github/workflows/patch-loop-brook-invitacion-1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Corregir loop del video y agregar Brook antes de creditos
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('invitacion_1.html')
          text = path.read_text(encoding='utf-8')

          old_video = '  autoplay\n  playsinline'
          new_video = '  autoplay\n  loop\n  playsinline'
          if old_video not in text:
              raise RuntimeError('No se encontro el bloque autoplay/playsinline del hero-video')
          text = text.replace(old_video, new_video, 1)

          old_loop_false = '  heroVideo.loop = false;'
          if old_loop_false not in text:
              raise RuntimeError('No se encontro heroVideo.loop = false')
          text = text.replace(old_loop_false, '  heroVideo.loop = true;', 1)

          old_remove_loop = '  heroVideo.removeAttribute("loop");'
          if old_remove_loop not in text:
              raise RuntimeError('No se encontro removeAttribute loop')
          text = text.replace(old_remove_loop, '  heroVideo.setAttribute("loop", "");', 1)

          footer_marker = '  <h2>Antonio y Lucero</h2>\n\n  <div class="footer-credits">'
          footer_new = (
              '  <h2>Antonio y Lucero</h2>\n\n'
              '  <div class="footer-brook-loop" aria-label="Brook acompañando el cierre de la invitación" '
              'style="width:70px;height:auto;margin:24px auto 18px;display:flex;align-items:center;justify-content:center;pointer-events:none;">\n'
              '    <img src="https://raw.githubusercontent.com/avaldiviezoch/Wedding/main/brook.gif" '
              'alt="Brook tocando Sake de Binks" '
              'style="width:100%;height:auto;display:block;object-fit:contain;background:transparent;filter:drop-shadow(0 0 2px rgba(0,0,0,.08));animation:brookFloat 2.5s ease-in-out infinite;">\n'
              '  </div>\n\n'
              '  <div class="footer-credits">'
          )
          if footer_marker not in text:
              raise RuntimeError('No se encontro el marcador del footer')
          text = text.replace(footer_marker, footer_new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validar cambios
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          t = Path('invitacion_1.html').read_text(encoding='utf-8')
          checks = [
              'autoplay\n  loop\n  playsinline',
              'heroVideo.loop = true;',
              'heroVideo.setAttribute("loop", "");',
              'class="footer-brook-loop"',
              'width:70px',
              'brook.gif'
          ]
          for c in checks:
              assert c in t, c
          assert 'heroVideo.loop = false;' not in t
          assert 'heroVideo.removeAttribute("loop");' not in t
          print('Validacion OK')
          PY

      - name: Commit y limpiar workflow temporal
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-loop-brook-invitacion-1.yml
          git add invitacion_1.html
          git commit -m "Corregir loop del video y agregar Brook final en invitacion 1"
          git push origin main
