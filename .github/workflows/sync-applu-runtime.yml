name: Sync public applu runtime

on:
  push:
    paths:
      - 'app_integral/js/modules/invitados/**'
      - '.github/workflows/sync-applu-runtime.yml'

permissions:
  contents: write

jobs:
  bump-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update public runtime version
        shell: bash
        run: |
          VERSION="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          python - <<'PY'
          import os, re
          from pathlib import Path
          p = Path('applu.html')
          text = p.read_text(encoding='utf-8')
          version = os.environ.get('VERSION_OVERRIDE') or os.popen('date -u +%Y%m%d%H%M%S').read().strip()
          sha = os.environ.get('GITHUB_SHA','')[:7]
          version = f"{version}-{sha}" if sha else version
          text = re.sub(r'runtime-loader\.js\?v=[^\"]+', f'runtime-loader.js?v={version}', text)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit public entry update
        shell: bash
        run: |
          if git diff --quiet -- applu.html; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add applu.html
          git commit -m "Actualizar runtime público [skip ci]"
          git push
