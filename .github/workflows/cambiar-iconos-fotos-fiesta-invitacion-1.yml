name: Cambiar iconos Fotos y Fiesta invitacion 1

on:
  push:
    paths:
      - '.github/workflows/cambiar-iconos-fotos-fiesta-invitacion-1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reemplazar iconos
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('invitacion_1.html')
          t = p.read_text(encoding='utf-8')

          old_fotos = 'https://raw.githubusercontent.com/avaldiviezoch/Wedding/main/PAREJA.gif'
          new_fotos = 'https://raw.githubusercontent.com/avaldiviezoch/Wedding/main/fotos_1.gif'
          old_fiesta = 'https://raw.githubusercontent.com/avaldiviezoch/Wedding/main/BAILANDO.gif'
          new_fiesta = 'https://raw.githubusercontent.com/avaldiviezoch/Wedding/main/fiesta_1.gif'

          assert old_fotos in t, 'No se encontro icono actual de Fotos'
          assert old_fiesta in t, 'No se encontro icono actual de Fiesta'

          t = t.replace(old_fotos, new_fotos, 1)
          t = t.replace(old_fiesta, new_fiesta, 1)
          p.write_text(t, encoding='utf-8')
          PY

      - name: Validar
        shell: bash
        run: |
          grep -Fq 'Wedding/main/fotos_1.gif' invitacion_1.html
          grep -Fq 'Wedding/main/fiesta_1.gif' invitacion_1.html

      - name: Commit y limpiar workflow temporal
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cambiar-iconos-fotos-fiesta-invitacion-1.yml
          git add invitacion_1.html
          git commit -m "Cambiar iconos de Fotos y Fiesta en invitacion 1"
          git push origin main
