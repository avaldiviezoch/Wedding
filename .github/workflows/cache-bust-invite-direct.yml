name: Sincronizar Invitaciones integradas

on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/cache-bust-invite-direct.txt'
      - 'app_integral/js/modules/configuracion/invite-direct.js'
      - 'app_integral/js/modules/invitaciones/index.js'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-invitations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sincronizar carga aislada de Invitaciones
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, re, time
          sha = os.environ.get('GITHUB_SHA', '')[:8] or 'manual'
          stamp = time.strftime('%Y%m%d%H%M%S')
          invite_version = f'{stamp}-{sha}-invitaciones'
          direct_version = f'{stamp}-{sha}-direct'
          native_tag = f'  <script src="js/modules/invitaciones/index.js?v={invite_version}"></script>\n'
          legacy_pattern = r'(\s*<script src="js/legacy/applu-script-01\.js\?v=[^"\']+"></script>)'

          for name in ('applu.html', 'app_integral/applu.html'):
              p = Path(name)
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              text = re.sub(
                  r'\s*<script src="js/modules/invitaciones/index\.js\?v=[^"\']+"></script>\s*',
                  '\n',
                  text
              )
              text, n = re.subn(legacy_pattern, '\n' + native_tag + r'\1', text, count=1)
              if not n:
                  raise SystemExit(f'No se encontró router legado en {name}')
              text = text.replace('Gestión de los cuatro modelos', 'Gestión de 5 invitaciones')
              text = re.sub(
                  r'js/modules/configuracion/invite-direct\.js\?v=[^"\']+',
                  f'js/modules/configuracion/invite-direct.js?v={direct_version}',
                  text
              )
              p.write_text(text, encoding='utf-8')
          PY
      - name: Crear Pull Request de sincronización
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then exit 0; fi
          BRANCH="automation/sync-invitations-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add applu.html app_integral/applu.html
          git commit -m "Sincronizar Invitaciones en App LU"
          git push --set-upstream origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "Automatización — Sincronizar Invitaciones integradas" --body "Sincroniza las referencias de Invitaciones después de cambios en sus fuentes. Requiere Repository validation y revisión antes del merge."
