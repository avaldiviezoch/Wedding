name: Phase 3F final lossless batch
on:
  push:
    branches: [perf/invitacion6-phase3f-static-assets]
    paths: ['.github/workflows/phase3f-final-batch.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate-and-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/invitacion6-phase3f-static-assets
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lock BASE and clean productive scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=f1fa0a031e0bc4d1070371e872195ddea6716a51
          git merge-base --is-ancestor "$BASE" HEAD
          test -z "$(git diff --name-only "$BASE" HEAD -- . ':!.github/workflows/phase3f-final-batch.yml')"
          test ! -e package-lock.json
          echo "BRANCH_HEAD=$(git rev-parse HEAD)"
      - name: Install isolated QA tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y python3-pil pngcrush >/dev/null
          rm -rf /tmp/phase3f-playwright
          mkdir -p /tmp/phase3f-playwright
          cd /tmp/phase3f-playwright
          npm init -y >/dev/null
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chrome >/dev/null
          test ! -e "$GITHUB_WORKSPACE/package-lock.json"
      - name: Rebuild nine PNG candidates and enforce lossless gates
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import subprocess,tempfile,shutil,json
          from pathlib import Path
          from PIL import Image,ImageChops
          items=[
            ('invitaciones/invitacion_6/assets/foto_pareja_6_2png.png',4699530,3401664),
            ('invitaciones/invitacion_6/assets/Primera_entrada_6.png',4079764,2785777),
            ('invitaciones/invitacion_6/assets/foto_pareja_6_1.png',2571875,1771248),
            ('invitaciones/invitacion_6/fondo_dress_code_5.png',2122476,1628062),
            ('invitaciones/invitacion_6/assets/foto_pareja_final_6_1.png',1290848,903917),
            ('invitaciones/invitacion_6/ubicacion_local_2.png',2008324,1636224),
            ('invitaciones/invitacion_6/assets/foto_pareja_final_6_2.png',1204446,839151),
            ('invitaciones/invitacion_6/assets/foto_cortada_superior_6_1.png',1005004,682472),
            ('invitaciones/invitacion_6/assets/foto_cortada_superior_6_2.png',809702,554481),
          ]
          rows=[]
          for s,base_bytes,expected in items:
            p=Path(s)
            if p.stat().st_size!=base_bytes: raise SystemExit(f'BASE_SIZE_MISMATCH {s} {p.stat().st_size}')
            td=Path(tempfile.mkdtemp(prefix='p3f_final_')); out=td/p.name
            try:
              subprocess.run(['pngcrush','-q','-brute','-reduce',str(p),str(out)],check=True)
              a=Image.open(p).convert('RGBA'); b=Image.open(out).convert('RGBA')
              dims=a.size==b.size
              pixels=dims and ImageChops.difference(a,b).getbbox() is None
              alpha=dims and a.getchannel('A').tobytes()==b.getchannel('A').tobytes()
              got=out.stat().st_size
              if not (dims and pixels and alpha): raise SystemExit(f'LOSSLESS_GATE_FAIL {s} dims={dims} pixels={pixels} alpha={alpha}')
              if got!=expected: raise SystemExit(f'CANDIDATE_SIZE_MISMATCH {s} got={got} expected={expected}')
              shutil.copyfile(out,p)
              rows.append({'path':s,'base':base_bytes,'head':got,'saving':base_bytes-got,'dimensions_equal':dims,'pixel_equivalence':pixels,'alpha_preserved':alpha})
            finally: shutil.rmtree(td,ignore_errors=True)
          print('PHASE3F_PNG_GATES='+json.dumps(rows))
          print('PHASE3F_REAL_SAVINGS='+str(sum(x['saving'] for x in rows)))
          PY
      - name: Prove local canonical copies and replace only two broken RAW image refs
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import hashlib,json,urllib.request,urllib.error
          pairs=[
            ('fecha_regresiva_2.png','https://raw.githubusercontent.com/avaldiviezoch/Wedding/main/fecha_regresiva_2.png?v=20260716-2','./fecha_regresiva_2.png'),
            ('marco_de_fotos_2.png','https://raw.githubusercontent.com/avaldiviezoch/Wedding/main/marco_de_fotos_2.png','./marco_de_fotos_2.png'),
          ]
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          proof=[]
          target=Path('invitaciones/invitacion_6/invitacion_5_base.html')
          text=target.read_text('utf-8')
          for name,raw,local in pairs:
            paths=[f'invitaciones/invitacion_6/{name}',f'invitaciones/invitacion_5/{name}',f'invitaciones/invitacion_2/{name}']
            if not all(Path(p).is_file() for p in paths): raise SystemExit('LOCAL_COPY_MISSING '+name)
            hs=[sha(p) for p in paths]
            if len(set(hs))!=1: raise SystemExit('LOCAL_CANONICAL_SHA_MISMATCH '+name)
            try:
              req=urllib.request.Request(raw,method='HEAD',headers={'User-Agent':'phase3f-audit'})
              urllib.request.urlopen(req,timeout=20); status=200
            except urllib.error.HTTPError as e: status=e.code
            except Exception as e: status=str(e)
            if text.count(raw)!=1: raise SystemExit(f'RAW_COUNT_FAIL {name} count={text.count(raw)}')
            text=text.replace(raw,local,1)
            proof.append({'name':name,'raw_status':status,'canonical_sha256':hs[0],'copies':paths,'replacement':local})
          target.write_text(text,'utf-8')
          print('PHASE3F_RAW_PROOF='+json.dumps(proof))
          PY
          git diff --check
      - name: Enforce productive diff allowlist
        shell: bash
        run: |
          set -euo pipefail
          BASE=f1fa0a031e0bc4d1070371e872195ddea6716a51
          cat >/tmp/allowed.txt <<'EOF'
          invitaciones/invitacion_6/assets/Primera_entrada_6.png
          invitaciones/invitacion_6/assets/foto_cortada_superior_6_1.png
          invitaciones/invitacion_6/assets/foto_cortada_superior_6_2.png
          invitaciones/invitacion_6/assets/foto_pareja_6_1.png
          invitaciones/invitacion_6/assets/foto_pareja_6_2png.png
          invitaciones/invitacion_6/assets/foto_pareja_final_6_1.png
          invitaciones/invitacion_6/assets/foto_pareja_final_6_2.png
          invitaciones/invitacion_6/fondo_dress_code_5.png
          invitaciones/invitacion_6/invitacion_5_base.html
          invitaciones/invitacion_6/ubicacion_local_2.png
          EOF
          git diff --name-only "$BASE" -- . ':!.github/workflows/phase3f-final-batch.yml' | sort >/tmp/actual.txt
          diff -u /tmp/allowed.txt /tmp/actual.txt
          test "$(git diff --numstat "$BASE" -- invitaciones/invitacion_6/invitacion_5_base.html | awk '{print $1":"$2}')" = "2:2"
      - name: Prepare exact BASE worktree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/phase3f-base
          git worktree add --detach /tmp/phase3f-base f1fa0a031e0bc4d1070371e872195ddea6716a51
      - name: Browser BASE vs HEAD network visual image and functional QA
        shell: bash
        env:
          NODE_PATH: /tmp/phase3f-playwright/node_modules
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory /tmp/phase3f-base >/tmp/p3f-base-http.log 2>&1 & P1=$!
          python3 -m http.server 4174 --directory "$GITHUB_WORKSPACE" >/tmp/p3f-head-http.log 2>&1 & P2=$!
          trap 'kill $P1 $P2 || true' EXIT
          sleep 2
          cat >/tmp/phase3f-qa.js <<'NODE'
          const {chromium}=require('playwright');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const targetPaths={
            'foto_pareja_6_2png.png':'assets/foto_pareja_6_2png.png','Primera_entrada_6.png':'assets/Primera_entrada_6.png','foto_pareja_6_1.png':'assets/foto_pareja_6_1.png','fondo_dress_code_5.png':'fondo_dress_code_5.png','foto_pareja_final_6_1.png':'assets/foto_pareja_final_6_1.png','ubicacion_local_2.png':'ubicacion_local_2.png','foto_pareja_final_6_2.png':'assets/foto_pareja_final_6_2.png','foto_cortada_superior_6_1.png':'assets/foto_cortada_superior_6_1.png','foto_cortada_superior_6_2.png':'assets/foto_cortada_superior_6_2.png'};
          const rawNames=['fecha_regresiva_2.png','marco_de_fotos_2.png'];
          async function stabilize(page){for(const f of page.frames()){try{await f.addStyleTag({content:'*,*::before,*::after{animation:none!important;transition:none!important;caret-color:transparent!important}video,canvas,img[src*=".gif"]{visibility:hidden!important}'});await f.evaluate(async()=>{try{await document.fonts.ready}catch{};document.querySelectorAll('video,audio').forEach(x=>{try{x.pause()}catch{}})})}catch{}}await sleep(400)}
          async function findEntry(page){for(const f of page.frames()){try{if(await f.locator('#entryScreen').count())return f}catch{}}return null}
          async function scrollAll(page,ratio){for(const f of page.frames()){try{await f.evaluate(r=>scrollTo(0,document.body.scrollHeight*r),ratio)}catch{}}await sleep(900)}
          async function scanFeatures(page){const out={countdown:false,carousel:false,ubicacion:false,collage:false,dress:false,timeline:false,rsvp:false,regalo:false,musica:false,faq:false,cierre:false};for(const f of page.frames()){try{const x=await f.evaluate(()=>{const t=(document.body?.innerText||'').toLowerCase();const srcs=[...document.querySelectorAll('img,source')].map(e=>e.currentSrc||e.src||'');return {countdown:!!document.querySelector('#countdownOverlay')||/[0-9]+\s*(días|dias|horas)/.test(t),carousel:!!document.querySelector('#fixedFrameCarousel')||document.querySelectorAll('.fixed-photo-dot').length>0,ubicacion:/ubicaci|cómo llegar|como llegar/.test(t)||srcs.some(s=>s.includes('ubicacion_local_2.png')),collage:srcs.some(s=>s.includes('foto_pareja_6_1.png'))&&srcs.some(s=>s.includes('foto_pareja_6_2png.png')),dress:/dress code|vestimenta/.test(t),timeline:/programaci|itinerario/.test(t)||srcs.some(s=>/inicio_de_boda_6_3|brindis_6_3|comida_6_2|fiesta_6_2|fin_boda_6_2/.test(s)),rsvp:/confirmar|asistencia|rsvp/.test(t),regalo:/regalo/.test(t),musica:/música|musica/.test(t),faq:/preguntas|frecuentes/.test(t),cierre:/te esperamos|gracias/.test(t)}});for(const k of Object.keys(out))out[k]=out[k]||x[k]}catch{}}return out}
          async function run(kind,label,port,w,h){
            const browser=await chromium.launch({channel:'chrome',headless:true,args:['--autoplay-policy=no-user-gesture-required']});const context=await browser.newContext({viewport:{width:w,height:h},serviceWorkers:'block'});const page=await context.newPage();let stage='T0';const events=[],fails=[],consoleErr=[];page.on('request',r=>events.push({url:r.url(),frame:r.frame()?.url()||'',stage}));page.on('requestfailed',r=>fails.push({url:r.url(),error:r.failure()?.errorText||'',stage}));page.on('console',m=>{if(m.type()==='error')consoleErr.push(m.text())});
            await page.goto(`http://127.0.0.1:${port}/invitaciones/invitacion_6/`,{waitUntil:'domcontentloaded'});await sleep(1500);const frames=page.frames();if(frames.length!==4||!frames.some(f=>f.url().includes('invitacion_5_base.html')))throw new Error(`${kind}-${label}: frame gate ${frames.length}`);const preFeatures=await scanFeatures(page);await stabilize(page);await page.screenshot({path:`/tmp/${kind}-${label}-ENTRY.png`});
            const ef=await findEntry(page);if(!ef)throw new Error('entry frame missing');let interaction={};if(kind==='head'){const pre=await ef.evaluate(()=>({audio:[...document.querySelectorAll('audio')].filter(a=>(a.currentSrc||a.src).includes('sake_binks.mp3')).length,entry:!!document.querySelector('#entryVideo')}));if(pre.audio!==1||!pre.entry)throw new Error('audio/entry pre gate')}
            stage='T2';const guard=ef.locator('#tapGuard');if(await guard.count())await guard.click();else await ef.locator('#entryScreen').click({force:true});await sleep(6500);stage='T3';if(kind==='head'){interaction=await ef.evaluate(()=>{const a=document.querySelector('#bgMusic'),v=document.querySelector('#entryVideo'),e=document.querySelector('#entryScreen');return {audioOk:!!a&&a.loop&&a.currentTime>0,audioTime:a?.currentTime||0,videoOk:!!v&&v.currentTime>0,videoTime:v?.currentTime||0,videoEnded:!!v?.ended,reveal:!e||getComputedStyle(e).display==='none'||getComputedStyle(e).visibility==='hidden'||parseFloat(getComputedStyle(e).opacity||'1')<.1}});if(!interaction.audioOk||!interaction.videoOk||!interaction.reveal)throw new Error('ENTRY_MEDIA_GATE '+JSON.stringify(interaction))}
            await stabilize(page);await page.screenshot({path:`/tmp/${kind}-${label}-FIRST.png`});await scrollAll(page,.5);stage='T4';await stabilize(page);await page.screenshot({path:`/tmp/${kind}-${label}-MID.png`});await scrollAll(page,1);stage='T5';await sleep(1200);const postFeatures=await scanFeatures(page);await stabilize(page);await page.screenshot({path:`/tmp/${kind}-${label}-FINAL.png`});
            const all=[],rendered=[];for(const f of page.frames()){try{const p=await f.evaluate(()=>performance.getEntriesByType('resource').map(r=>({name:r.name,startTime:r.startTime,transferSize:r.transferSize,encodedBodySize:r.encodedBodySize})));all.push(...p);const r=await f.evaluate(names=>{const z=[];for(const n of names){for(const el of document.querySelectorAll('*')){const src=el.currentSrc||el.src||'';const bg=getComputedStyle(el).backgroundImage||'';if(src.includes(n)||bg.includes(n)){const b=el.getBoundingClientRect();z.push({name:n,w:b.width,h:b.height,tag:el.tagName})}}}return z},Object.keys(targetPaths));rendered.push(...r)}catch{}}
            const sum=(a,k)=>a.reduce((s,x)=>s+(x[k]||0),0);const rawReq=events.filter(e=>e.url.includes('raw.githubusercontent.com')&&rawNames.some(n=>e.url.includes(n)));const rawOrb=fails.filter(e=>e.url.includes('raw.githubusercontent.com')&&rawNames.some(n=>e.url.includes(n))&&e.error.includes('ORB'));const metrics={requests:all.length,totalTransfer:sum(all,'transferSize'),first3:sum(all.filter(x=>x.startTime<=3000),'transferSize'),first5:sum(all.filter(x=>x.startTime<=5000),'transferSize')};
            const probe=await page.evaluate(async({paths,port})=>{const out={};for(const [n,p] of Object.entries(paths)){out[n]=await new Promise(resolve=>{const i=new Image();i.onload=()=>resolve({complete:i.complete,naturalWidth:i.naturalWidth,naturalHeight:i.naturalHeight});i.onerror=()=>resolve({complete:i.complete,naturalWidth:i.naturalWidth,naturalHeight:i.naturalHeight,error:true});i.src=`http://127.0.0.1:${port}/invitaciones/invitacion_6/${p}`})}return out},{paths:targetPaths,port});
            if(kind==='head'){if(rawReq.length||rawOrb.length)throw new Error('RAW_HEAD_GATE');for(const [n,d] of Object.entries(probe))if(!d.complete||d.naturalWidth<=0||d.naturalHeight<=0)throw new Error('IMAGE_HEAD_GATE '+n+' '+JSON.stringify(d))}
            const result={kind,label,frameCount:page.frames().length,metrics,rawRequests:rawReq.length,rawOrb:rawOrb.length,probe,rendered,preFeatures,postFeatures,interaction,failures:fails.filter(x=>rawNames.some(n=>x.url.includes(n))),consoleErrors:consoleErr};console.log('PHASE3F_RESULT='+JSON.stringify(result));await browser.close();return result}
          (async()=>{const all={};for(const [label,w,h] of [['desktop',1366,768],['mobile',390,844]]){const b=await run('base',label,4173,w,h);const hres=await run('head',label,4174,w,h);if(JSON.stringify(b.preFeatures)!==JSON.stringify(hres.preFeatures)||JSON.stringify(b.postFeatures)!==JSON.stringify(hres.postFeatures))throw new Error('FUNCTIONAL_PARITY_FAIL '+label+' '+JSON.stringify({basePre:b.preFeatures,headPre:hres.preFeatures,basePost:b.postFeatures,headPost:hres.postFeatures}));for(const n of Object.keys(targetPaths)){const x=b.probe[n],y=hres.probe[n];if(x.naturalWidth!==y.naturalWidth||x.naturalHeight!==y.naturalHeight)throw new Error('NATURAL_DIM_PARITY '+label+' '+n)}console.log('PHASE3F_FUNCTIONAL_PARITY='+JSON.stringify({label,pre:b.preFeatures,post:b.postFeatures,headEntry:hres.interaction}));all[label]={base:b,head:hres}}})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/phase3f-qa.js
          python3 <<'PY'
          from PIL import Image,ImageChops
          import json
          rows=[]
          for vp in ('desktop','mobile'):
            for state in ('ENTRY','FIRST','MID','FINAL'):
              a=Image.open(f'/tmp/base-{vp}-{state}.png').convert('RGBA');b=Image.open(f'/tmp/head-{vp}-{state}.png').convert('RGBA')
              if a.size!=b.size: raise SystemExit(f'PIXEL_SIZE_FAIL {vp} {state}')
              d=ImageChops.difference(a,b);different=0 if d.getbbox() is None else sum(1 for px in d.getdata() if px!=(0,0,0,0))
              rows.append({'viewport':vp,'state':state,'differentPixels':different,'dynamic_gif_video_masked':True})
          print('PHASE3F_PIXEL='+json.dumps(rows))
          PY
      - name: Repository tests
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm test
          test ! -e package-lock.json
      - name: Final product diff and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain | awk '$2=="package-lock.json"{print}')"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add invitaciones/invitacion_6/assets/foto_pareja_6_2png.png invitaciones/invitacion_6/assets/Primera_entrada_6.png invitaciones/invitacion_6/assets/foto_pareja_6_1.png invitaciones/invitacion_6/fondo_dress_code_5.png invitaciones/invitacion_6/assets/foto_pareja_final_6_1.png invitaciones/invitacion_6/ubicacion_local_2.png invitaciones/invitacion_6/assets/foto_pareja_final_6_2.png invitaciones/invitacion_6/assets/foto_cortada_superior_6_1.png invitaciones/invitacion_6/assets/foto_cortada_superior_6_2.png invitaciones/invitacion_6/invitacion_5_base.html
          git diff --cached --quiet && { echo 'No productive diff'; exit 1; }
          git commit -m 'perf(inv6): optimize final static PNG assets losslessly'
          git push origin HEAD:perf/invitacion6-phase3f-static-assets
          echo "PRODUCT_HEAD=$(git rev-parse HEAD)"
