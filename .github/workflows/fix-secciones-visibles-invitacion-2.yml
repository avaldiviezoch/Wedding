name: Corregir secciones visibles invitacion 2
on:
  push:
    paths:
      - '.github/workflows/fix-secciones-visibles-invitacion-2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corregir visibilidad permanente
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('invitacion_2.html')
          s = p.read_text(encoding='utf-8')

          # Corrige etiqueta dañada de ubicación
          s = s.replace(
              '<section class="location-section aria-label="Ubicación de la boda">',
              '<section class="location-section" aria-label="Ubicación de la boda">'
          )

          replacements = [
              (
                  """          if (entry.isIntersecting) {\n            restartHandsAnimation();\n          } else {\n            handsSection.classList.remove('is-visible');\n          }""",
                  """          if (entry.isIntersecting) {\n            restartHandsAnimation();\n            handsObserver.unobserve(entry.target);\n          }"""
              ),
              (
                  """          if (entry.isIntersecting) {\n            restartCrewAnimation();\n          } else {\n            crewSection.classList.remove('is-visible');\n          }""",
                  """          if (entry.isIntersecting) {\n            restartCrewAnimation();\n            crewObserver.unobserve(entry.target);\n          }"""
              ),
              (
                  """          if (entry.isIntersecting) {\n            restartItineraryAnimation();\n          } else {\n            itinerarySection.classList.remove('is-visible');\n          }""",
                  """          if (entry.isIntersecting) {\n            restartItineraryAnimation();\n            itineraryObserver.unobserve(entry.target);\n          }"""
              ),
              (
                  """          if (entry.isIntersecting) {\n            restartDresscodeAnimation();\n          } else {\n            dresscodeSection.classList.remove('is-visible');\n          }""",
                  """          if (entry.isIntersecting) {\n            restartDresscodeAnimation();\n            dresscodeObserver.unobserve(entry.target);\n          }"""
              ),
              (
                  """          if (entry.isIntersecting) {\n            entry.target.classList.add('is-visible');\n          } else {\n            entry.target.classList.remove('is-visible');\n          }""",
                  """          if (entry.isIntersecting) {\n            entry.target.classList.add('is-visible');\n            finalObserver.unobserve(entry.target);\n          }"""
              )
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit('No se encontró uno de los bloques de visibilidad esperados')
              s = s.replace(old, new, 1)

          # Actualiza comentarios para reflejar el nuevo comportamiento
          s = s.replace('Se reinicia cada vez que la sección vuelve a entrar en pantalla.', 'Se ejecuta una sola vez y permanece visible.')
          s = s.replace('Se repite cuando la sección sale y vuelve a entrar en pantalla.', 'Se ejecuta una sola vez y permanece visible.')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validar corrección
        run: |
          grep -q 'handsObserver.unobserve(entry.target)' invitacion_2.html
          grep -q 'crewObserver.unobserve(entry.target)' invitacion_2.html
          grep -q 'itineraryObserver.unobserve(entry.target)' invitacion_2.html
          grep -q 'dresscodeObserver.unobserve(entry.target)' invitacion_2.html
          grep -q 'finalObserver.unobserve(entry.target)' invitacion_2.html
          grep -q '<section class="location-section" aria-label="Ubicación de la boda">' invitacion_2.html
          ! grep -q '<section class="location-section aria-label=' invitacion_2.html

      - name: Commit y limpiar workflow temporal
        run: |
          rm .github/workflows/fix-secciones-visibles-invitacion-2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add invitacion_2.html .github/workflows/fix-secciones-visibles-invitacion-2.yml
          git commit -m "Evitar que desaparezcan secciones de invitacion 2"
          git push
