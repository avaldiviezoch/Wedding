name: Phase 3B byte-safe patch

on:
  push:
    branches:
      - perf/invitacion6-phase3b-assets-loading

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/perf/invitacion6-phase3b-assets-loading'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/invitacion6-phase3b-assets-loading
          fetch-depth: 0
      - name: Apply five localized lazy-loading attributes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,hashlib
          p=Path('invitaciones/invitacion_6/inv6_correcta_ultimos_gifs.js')
          before=p.read_bytes()
          blob=subprocess.check_output(['git','hash-object',str(p)],text=True).strip()
          expected_blob='62f16d68f202ba3993cf128309239a1d321a8b2d'
          print('BASE_BLOB='+blob)
          if blob != expected_blob: raise SystemExit('unexpected source blob')
          names=[
            b'sat-inv6-program-ceremonia-gif',
            b'sat-inv6-program-brindis-gif',
            b'sat-inv6-program-comida-gif',
            b'sat-inv6-program-fiesta-gif',
            b'sat-inv6-program-fin-gif',
          ]
          out=before
          for cls in names:
            marker=b'class="'+cls+b'"\n                  src='
            replacement=b'class="'+cls+b'"\n                  loading="lazy"\n                  decoding="async"\n                  src='
            count=out.count(marker)
            print(cls.decode()+'_COUNT='+str(count))
            if count != 1: raise SystemExit('pattern count != 1 for '+cls.decode())
            out=out.replace(marker,replacement,1)
          if out==before: raise SystemExit('no change')
          p.write_bytes(out)
          reread=p.read_bytes()
          if reread!=out: raise SystemExit('write mismatch')
          print('SOURCE_SHA256_BEFORE='+hashlib.sha256(before).hexdigest())
          print('SOURCE_SHA256_AFTER='+hashlib.sha256(out).hexdigest())
          print('BYTES_ADDED='+str(len(out)-len(before)))
          PY
          git diff --check
          git diff --numstat -- invitaciones/invitacion_6/inv6_correcta_ultimos_gifs.js
          git diff -- invitaciones/invitacion_6/inv6_correcta_ultimos_gifs.js
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "invitaciones/invitacion_6/inv6_correcta_ultimos_gifs.js"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add invitaciones/invitacion_6/inv6_correcta_ultimos_gifs.js
          git commit -m "perf(inv6): defer below-fold timeline gifs"
          git push origin HEAD:perf/invitacion6-phase3b-assets-loading
