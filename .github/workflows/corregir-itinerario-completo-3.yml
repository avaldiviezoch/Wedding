name: Corregir itinerario completo 3
on:
  push:
    paths:
      - '.github/workflows/corregir-itinerario-completo-3.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar itinerario completo
        run: python .github/scripts/patch_itinerario_3.py
      - name: Validar
        run: |
          grep -q 'ITINERARIO_COMPLETO_INVITACION_3_V2' invitacion_3.html
          grep -q 'Recepción de invitados' invitacion_3.html
          grep -q 'Maridaje &amp; Banquete' invitacion_3.html
          grep -q 'Primer baile de novios' invitacion_3.html
          grep -q '8:00 p. m. en adelante' invitacion_3.html
      - name: Commit y limpiar
        run: |
          rm .github/scripts/patch_itinerario_3.py
          rm .github/workflows/corregir-itinerario-completo-3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add invitacion_3.html .github/scripts/patch_itinerario_3.py .github/workflows/corregir-itinerario-completo-3.yml
          git commit -m "Igualar programación de invitación 3 con invitaciones 1 y 2"
          git push
