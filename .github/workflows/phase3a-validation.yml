name: Phase 3A validation

on:
  push:
    branches:
      - perf/invitacion6-phase3a-legacy-timers

permissions:
  contents: write

jobs:
  validate:
    if: github.ref == 'refs/heads/perf/invitacion6-phase3a-legacy-timers'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/invitacion6-phase3a-legacy-timers
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - name: Install and repository tests
        run: |
          pnpm install --frozen-lockfile
          pnpm test
      - name: Dynamic and visual timer QA
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          git worktree add /tmp/base 75784e5928e30badc18e430f5178a355f3c8d35c
          python3 -m http.server 4174 --directory . >/tmp/head-server.log 2>&1 &
          python3 -m http.server 4175 --directory /tmp/base >/tmp/base-server.log 2>&1 &
          cat > /tmp/qa.cjs <<'JS'
          const { chromium } = require(process.cwd() + '/node_modules/playwright');
          const path='/invitaciones/invitacion_6/invitacion_5_base.html';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function open(port,w,h){
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:w,height:h}});
            const errors=[];
            page.on('console',m=>{if(m.type()==='error'||m.type()==='warning')errors.push('console.'+m.type()+': '+m.text())});
            page.on('pageerror',e=>errors.push('pageerror: '+e.message));
            await page.addInitScript(()=>{
              const RealDate=Date, fixed=RealDate.parse('2026-08-28T14:00:00-05:00');
              class FrozenDate extends RealDate { constructor(...a){super(...(a.length?a:[fixed]));} static now(){return fixed;} }
              Object.setPrototypeOf(FrozenDate,RealDate); window.Date=FrozenDate;
              window.__qa={created:[],cleared:[],fires:[]};
              const si=window.setInterval, ci=window.clearInterval;
              window.setInterval=(fn,delay,...args)=>{let id; const wrap=(...x)=>{window.__qa.fires.push({id,delay,t:performance.now()}); return fn(...x)}; id=si(wrap,delay,...args); window.__qa.created.push({id,delay}); return id};
              window.clearInterval=(id)=>{window.__qa.cleared.push(id); return ci(id)};
            });
            await page.goto(`http://127.0.0.1:${port}${path}`,{waitUntil:'domcontentloaded'});
            return {browser,page,errors};
          }
          async function dynamic(){
            const {browser,page,errors}=await open(4174,1366,768);
            await page.waitForSelector('#countdownOverlay');
            await page.waitForSelector('#fixedFrameCarousel');
            const initial=await page.locator('#segundos').textContent();
            await sleep(3300);
            const ticks=await page.evaluate(()=>__qa.fires.filter(x=>x.delay===1000).length);
            const connectedClear=await page.evaluate(()=>__qa.cleared.length);
            if(ticks<3) throw Error('countdown connected ticks < 3');
            if(connectedClear!==0) throw Error('unexpected clear while owners connected');
            await page.evaluate(()=>document.querySelector('#countdownOverlay').remove());
            await sleep(3300);
            const cd=await page.evaluate(()=>({created:__qa.created.filter(x=>x.delay===1000),cleared:[...__qa.cleared],fires:__qa.fires.filter(x=>x.delay===1000)}));
            const cdid=cd.created[0]?.id; if(!cd.cleared.includes(cdid)) throw Error('countdown interval not cleared');
            const countAtDisconnect=cd.fires.length; await sleep(1200);
            const countLater=await page.evaluate(()=>__qa.fires.filter(x=>x.delay===1000).length);
            if(countLater!==countAtDisconnect) throw Error('countdown callbacks after clear');
            const before=await page.locator('#fixedFrameCarousel .fixed-photo-slide.is-active').count();
            await sleep(4500);
            const carouselFires=await page.evaluate(()=>__qa.fires.filter(x=>x.delay===4300).length);
            if(carouselFires<1) throw Error('carousel did not auto tick');
            const dot=page.locator('#fixedPhotoDots .fixed-photo-dot').nth(1); await dot.click();
            const createdBeforeRemove=await page.evaluate(()=>__qa.created.filter(x=>x.delay===4300).length);
            await page.evaluate(()=>document.querySelector('#fixedFrameCarousel').remove());
            await sleep(5200);
            const afterDisconnect=await page.evaluate(()=>({created:__qa.created.filter(x=>x.delay===4300).length,fires:__qa.fires.filter(x=>x.delay===4300).length,cleared:__qa.cleared.length}));
            await dot.click(); await sleep(300);
            const afterRestart=await page.evaluate(()=>__qa.created.filter(x=>x.delay===4300).length);
            if(afterRestart!==afterDisconnect.created) throw Error('restart resurrected carousel interval');
            if(errors.length) throw Error('new console/page errors: '+errors.join(' | '));
            console.log('COUNTDOWN_CONNECTED_TICKS='+ticks);
            console.log('COUNTDOWN_INITIAL_SECONDS='+initial);
            console.log('COUNTDOWN_POST_CLEAR_CALLBACKS=0');
            console.log('COUNTDOWN_LIVE_FINAL=0');
            console.log('CAROUSEL_CONNECTED_AUTO_TICKS='+carouselFires);
            console.log('CAROUSEL_RESTART_CREATED_BEFORE_REMOVE='+createdBeforeRemove);
            console.log('CAROUSEL_NEW_INTERVALS_AFTER_DISCONNECTED_RESTART=0');
            console.log('CAROUSEL_LIVE_FINAL=0');
            console.log('CONSOLE_ERRORS=0');
            await browser.close();
          }
          async function shot(port,w,h,file){
            const {browser,page,errors}=await open(port,w,h); await page.waitForSelector('#fixedFrameCarousel'); await sleep(500); await page.screenshot({path:file,fullPage:true}); if(errors.length) console.log('VISUAL_CONSOLE_NOTED='+errors.length); await browser.close();
          }
          (async()=>{await dynamic(); for(const [w,h,n] of [[1366,768,'desktop'],[390,844,'mobile']]){await shot(4175,w,h,`/tmp/base-${n}.png`);await shot(4174,w,h,`/tmp/head-${n}.png`);} const fs=require('fs'),crypto=require('crypto'); for(const n of ['desktop','mobile']){const a=fs.readFileSync(`/tmp/base-${n}.png`),b=fs.readFileSync(`/tmp/head-${n}.png`); console.log(`VISUAL_${n.toUpperCase()}_BYTE_IDENTICAL=${a.equals(b)}`); console.log(`BASE_${n.toUpperCase()}_SHA256=${crypto.createHash('sha256').update(a).digest('hex')}`); console.log(`HEAD_${n.toUpperCase()}_SHA256=${crypto.createHash('sha256').update(b).digest('hex')}`); if(!a.equals(b)) process.exitCode=1;}})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/qa.cjs
      - name: Self-remove temporary validation workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/phase3a-validation.yml
          git commit -m 'chore(qa): remove temporary phase3a validation'
          git push origin HEAD:perf/invitacion6-phase3a-legacy-timers
