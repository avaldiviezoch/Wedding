name: App integral auth audit

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/app-integral-auth-audit.yml'

permissions:
  contents: write

jobs:
  patch-auth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar correcciones
        run: python3 .github/scripts/app_integral_auth_audit_patch.py

      - name: Validar JavaScript
        run: |
          cp app_integral/js/services/firebase.js /tmp/firebase.mjs
          cp app_integral/js/legacy/applu-script-01.js /tmp/applu-script.js
          cp app_integral/js/modules/configuracion/weddings.js /tmp/weddings.mjs
          cp app_integral/js/modules/configuracion/weddings-legacy.js /tmp/weddings-legacy.mjs
          node --check /tmp/firebase.mjs
          node --check /tmp/applu-script.js
          node --check /tmp/weddings.mjs
          node --check /tmp/weddings-legacy.mjs

      - name: Validar guardas y versión única
        run: |
          grep -q 'body.auth-locked .modules' app_integral/css/core/auth-guard.css
          grep -q 'logoutInProgress' app_integral/js/services/firebase.js
          grep -q 'auth-hydrating' app_integral/js/services/firebase.js
          grep -q 'firebase.js?v=20260814-1047-auth3' app_integral/applu.html
          grep -q 'firebase.js?v=20260814-1047-auth3' app_integral/js/modules/configuracion/weddings.js
          grep -q 'firebase.js?v=20260814-1047-auth3' app_integral/js/modules/configuracion/weddings-legacy.js
          grep -q 'auth-guard.css?v=20260814-1047-auth3' app_integral/applu.html
          echo AUTH_AUDIT_TESTS_OK

      - name: Guardar cambios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app_integral
          if git diff --cached --quiet; then
            echo 'Sin cambios'
            exit 0
          fi
          git commit -m 'Auditar y estabilizar autenticación de app_integral'
          git push origin HEAD:main
