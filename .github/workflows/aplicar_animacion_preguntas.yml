name: Aplicar animacion preguntas invitacion 3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aplicar_animacion_preguntas.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar cambios
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/apply.py
          python3 /tmp/apply.py
          rm -f .github/workflows/aplicar_animacion_preguntas.yml

      - name: Guardar cambios
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No hay cambios por guardar"
          else
            git commit -m "Animar ilustraciones de preguntas en invitacion 3"
            git push
          fi
