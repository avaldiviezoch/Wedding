name: Aplicar animacion preguntas invitacion 3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aplicar_animacion_preguntas.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar animaciones y limpiar prueba
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('invitacion_3.html')
          text = path.read_text(encoding='utf-8')
          marker = '/* ANIMACIONES APROBADAS: ILUSTRACIONES DE PREGUNTAS */'

          css = r'''

    /* ANIMACIONES APROBADAS: ILUSTRACIONES DE PREGUNTAS */
    #preguntas .faq details .faq-illustration {
      will-change: transform, opacity;
      transform-origin: center center;
    }

    #preguntas .faq details:not([open]) .faq-illustration {
      opacity: 0;
      transform: translateY(14px) scale(.97);
    }

    #preguntas .faq details:nth-child(1)[open] .faq-illustration {
      animation: faqPicInOne .66s cubic-bezier(.22,.88,.3,1.16) both;
    }

    #preguntas .faq details:nth-child(2)[open] .faq-illustration {
      animation: faqPicInTwo .7s cubic-bezier(.18,.9,.28,1.18) both;
    }

    #preguntas .faq details:nth-child(3)[open] .faq-illustration {
      animation: faqPicInThree .68s cubic-bezier(.22,.86,.28,1.12) both;
    }

    #preguntas .faq details:nth-child(1)[open] .faq-illustration img {
      transform-origin: 50% 82%;
      animation: faqPicIdleOne 4.8s ease-in-out .7s infinite;
    }

    #preguntas .faq details:nth-child(2)[open] .faq-illustration img {
      transform-origin: 50% 55%;
      animation: faqPicIdleTwo 4s ease-in-out .75s infinite;
    }

    #preguntas .faq details:nth-child(3)[open] .faq-illustration img {
      transform-origin: 50% 80%;
      animation: faqPicIdleThree 4.4s ease-in-out .72s infinite;
    }

    @keyframes faqPicInOne {
      0%   { opacity: 0; transform: translateY(20px) scale(.96) rotate(-2deg); }
      68%  { opacity: 1; transform: translateY(-3px) scale(1.015) rotate(.7deg); }
      100% { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
    }

    @keyframes faqPicInTwo {
      0%   { opacity: 0; transform: translateY(10px) scale(.86); }
      62%  { opacity: 1; transform: translateY(-2px) scale(1.045); }
      82%  { transform: translateY(1px) scale(.988); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes faqPicInThree {
      0%   { opacity: 0; transform: translateY(17px) scale(.97) rotate(1.8deg); }
      70%  { opacity: 1; transform: translateY(-2px) scale(1.01) rotate(-.7deg); }
      100% { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
    }

    @keyframes faqPicIdleOne {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50%      { transform: translateY(-4px) rotate(.7deg); }
    }

    @keyframes faqPicIdleTwo {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.018); }
    }

    @keyframes faqPicIdleThree {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50%      { transform: translateY(-3px) rotate(1deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      #preguntas .faq details .faq-illustration,
      #preguntas .faq details .faq-illustration img {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
    }
'''

          if marker not in text:
              pos = text.rfind('</style>')
              if pos == -1:
                  raise SystemExit('No se encontro </style> en invitacion_3.html')
              text = text[:pos] + css + '\n  ' + text[pos:]
              path.write_text(text, encoding='utf-8')

          preview = Path('invitacion_3_animacion_preguntas.html')
          if preview.exists():
              preview.unlink()
          PY

          rm -f .github/workflows/aplicar_animacion_preguntas.yml

      - name: Guardar cambios
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add invitacion_3.html invitacion_3_animacion_preguntas.html .github/workflows/aplicar_animacion_preguntas.yml || true
          if git diff --cached --quiet; then
            echo "No hay cambios por guardar"
          else
            git commit -m "Animar ilustraciones de preguntas en invitacion 3"
            git push
          fi
