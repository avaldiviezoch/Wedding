name: Aplicar halo invitacion 4

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/aplicar-halo-invitacion-4.yml

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar halo global
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('invitacion_4.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* ===== AJUSTE_VISUAL_4_20260813 ===== */'
          css = r'''
/* ===== HALO_GLOBAL_TEXTO_INVITACION_4_20260813 ===== */
.invitacion p,
.invitacion h1,
.invitacion h2,
.invitacion h3,
.invitacion h4,
.invitacion span:not(.muestra-color),
.invitacion time,
.invitacion label,
.invitacion summary,
.invitacion a,
.invitacion button,
.invitacion .etiqueta-seccion,
.invitacion .texto-adicional,
.invitacion .subtitulo-adicional,
.invitacion .dresscode-intro,
.invitacion .dresscode-colors-title,
.invitacion .dresscode-note-final,
.invitacion .aviso-musica,
.invitacion .nota-itinerario,
.invitacion .texto-ubicacion,
.invitacion .hora-itinerario,
.invitacion .nombre-itinerario,
.invitacion .pregunta-cantidad,
.invitacion .mensaje-formulario {
  text-shadow:
    0 0 2px rgba(244,238,223,1),
    0 0 6px rgba(244,238,223,.96),
    0 0 10px rgba(244,238,223,.84),
    0 1px 14px rgba(244,238,223,.68) !important;
}

.invitacion .nombres,
.invitacion .fecha,
.invitacion .titulo-primer-fondo,
.invitacion .titulo-ubicacion,
.invitacion .titulo-itinerario,
.invitacion .titulo-adicional {
  text-shadow:
    0 0 3px rgba(244,238,223,1),
    0 0 8px rgba(244,238,223,.98),
    0 0 14px rgba(244,238,223,.86),
    0 2px 18px rgba(244,238,223,.72) !important;
}
'''
          if 'HALO_GLOBAL_TEXTO_INVITACION_4_20260813' not in s:
              if marker not in s:
                  raise SystemExit('No se encontro el marcador visual')
              s = s.replace(marker, css + '\n' + marker, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add invitacion_4.html
          git diff --cached --quiet && exit 0
          git commit -m "Aplicar halo a todos los textos de invitación 4"
          git push origin HEAD:main
