name: Fix responsive portada Mi Gran Dia

on:
  push:
    paths:
      - '.github/workflows/fix-home-responsive-20260816.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Aplicar responsive real a portada
        shell: python
        run: |
          from pathlib import Path

          for filename in ['applu.html', 'app_integral/applu.html']:
              p = Path(filename)
              s = p.read_text(encoding='utf-8')
              marker = '  <link rel="stylesheet" href="css/modules/auth-premium.css?v=20260814-1144-auth1">'
              responsive = '  <link rel="stylesheet" href="css/core/home-responsive.css?v=20260816-1345-home3">'
              if responsive not in s:
                  if marker not in s:
                      raise SystemExit(f'No se encontro marcador CSS en {filename}')
                  s = s.replace(marker, marker + '\n' + responsive, 1)
              s = s.replace('js/core/menu-fast.js?v=20260814-1540-menufast2', 'js/core/menu-fast.js?v=20260816-1345-home3')
              p.write_text(s, encoding='utf-8')

          css_path = Path('app_integral/css/core/home-responsive.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* responsive-648x755-home3 */'
          if marker not in css:
              css += r'''

/* responsive-648x755-home3 */
@media (min-width:481px) and (max-width:700px){
  .drawer{
    padding-top:max(58px,calc(env(safe-area-inset-top) + 52px)) !important;
    padding-left:max(10px,env(safe-area-inset-left)) !important;
    padding-right:max(10px,env(safe-area-inset-right)) !important;
    padding-bottom:max(10px,env(safe-area-inset-bottom)) !important;
  }

  .drawer-content{
    width:100% !important;
    max-width:none !important;
    margin:0 !important;
    gap:10px !important;
    padding:0 0 max(14px,env(safe-area-inset-bottom)) !important;
  }

  .drawer-title{
    padding:14px 16px 13px !important;
    border-radius:18px !important;
  }

  .drawer-title .eyebrow{
    margin-bottom:5px !important;
    font-size:7px !important;
  }

  .drawer-title h1{
    font-size:clamp(22px,5.2vw,28px) !important;
    line-height:1.04 !important;
    letter-spacing:.045em !important;
  }

  .drawer-title p{
    margin-top:7px !important;
    font-size:10px !important;
    line-height:1.35 !important;
  }

  .account-card.show{
    display:flex !important;
    min-height:52px !important;
    height:auto !important;
    overflow:visible !important;
    padding:8px 11px !important;
    border-radius:16px !important;
    align-items:center !important;
  }

  .account-user{
    min-height:36px !important;
  }

  .account-avatar{
    width:36px !important;
    height:36px !important;
    flex-basis:36px !important;
  }

  .account-copy strong{
    font-size:10px !important;
  }

  .account-copy span,
  .cloud-state{
    font-size:7px !important;
  }

  .countdown-card{
    padding:11px 12px !important;
    border-radius:18px !important;
  }

  .countdown-head{
    margin-bottom:8px !important;
  }

  .countdown{
    gap:6px !important;
  }

  .time-box{
    padding:9px 3px !important;
    border-radius:13px !important;
  }

  .time-box strong{
    font-size:17px !important;
  }

  .time-box span{
    margin-top:4px !important;
    font-size:6px !important;
  }

  .modules{
    gap:8px !important;
  }

  .module{
    border-radius:16px !important;
  }

  .module-toggle{
    min-height:50px !important;
    padding:9px 12px !important;
  }

  .module-name{
    font-size:11px !important;
  }

  .module-description{
    font-size:7.5px !important;
  }

  .copyright{
    font-size:7px !important;
  }
}

@media (min-width:481px) and (max-width:700px) and (max-height:800px){
  .drawer{
    padding-top:max(52px,calc(env(safe-area-inset-top) + 46px)) !important;
  }

  .drawer-content{
    gap:8px !important;
  }

  .drawer-title{
    padding:11px 14px !important;
  }

  .drawer-title h1{
    font-size:clamp(20px,4.8vw,26px) !important;
  }

  .drawer-title p{
    margin-top:5px !important;
  }

  .account-card.show{
    min-height:46px !important;
    padding-block:6px !important;
  }

  .countdown-card{
    padding:9px 10px !important;
  }

  .time-box{
    padding:7px 3px !important;
  }

  .module-toggle{
    min-height:46px !important;
    padding:8px 11px !important;
  }
}
'''
              css_path.write_text(css, encoding='utf-8')

      - name: Validar cambios
        shell: bash
        run: |
          grep -q 'home-responsive.css?v=20260816-1345-home3' applu.html
          grep -q 'home-responsive.css?v=20260816-1345-home3' app_integral/applu.html
          grep -q 'menu-fast.js?v=20260816-1345-home3' applu.html
          grep -q 'responsive-648x755-home3' app_integral/css/core/home-responsive.css

      - name: Guardar cambios
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-home-responsive-20260816.yml
          git add applu.html app_integral/applu.html app_integral/css/core/home-responsive.css
          git commit -m "Corregir responsive real de portada"
          git push origin main
