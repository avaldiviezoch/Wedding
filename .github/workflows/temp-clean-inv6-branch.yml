name: temp-clean-inv6-branch

on:
  push:
    branches:
      - feat/inv6-green-section

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep only requested Invitation 6 change
        run: |
          git fetch origin main
          git checkout origin/main -- invitaciones/invitacion_6/index.html
          rm -f invitaciones/invitacion_6/inv6_green_section.js
          git rm .github/workflows/temp-clean-inv6-branch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: keep only requested Invitation 6 change"
          git push origin HEAD:feat/inv6-green-section
