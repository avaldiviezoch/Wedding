name: Quitar GIF extra Dress Code invitacion 1
"on":
  push:
    paths:
      - '.github/triggers/quitar-gif-dresscode-1.txt'
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar correccion
        run: python .github/scripts/quitar_gif_dresscode_1.py
      - name: Validar
        run: |
          grep -q 'assets/invitacion_1/dresscode_bg_1.jpg' invitacion_1.html
          if grep -q 'dresscode-motion-gif' invitacion_1.html; then exit 1; fi
      - name: Limpiar temporales
        run: |
          rm -f .github/workflows/quitar-gif-dresscode-1.yml
          rm -f .github/triggers/quitar-gif-dresscode-1.txt
          rm -f .github/scripts/quitar_gif_dresscode_1.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add invitacion_1.html .github/workflows/quitar-gif-dresscode-1.yml .github/triggers/quitar-gif-dresscode-1.txt .github/scripts/quitar_gif_dresscode_1.py
          git commit -m 'Restaurar Dress Code invitacion 1 sin GIF duplicado'
          git push
