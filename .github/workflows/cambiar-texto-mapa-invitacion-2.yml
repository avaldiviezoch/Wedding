name: Cambiar texto mapa invitacion 2

on:
  push:
    paths:
      - '.github/workflows/cambiar-texto-mapa-invitacion-2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Cambiar Llevar al mapa por Ver ubicación
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('invitacion_2.html')
          t = p.read_text(encoding='utf-8')
          old = '>Llevar al mapa</a>'
          new = '>Ver ubicación</a>'
          if old not in t:
              raise SystemExit('No se encontró el texto del botón')
          t = t.replace(old, new, 1)
          p.write_text(t, encoding='utf-8')
          PY

      - name: Validar
        shell: bash
        run: |
          grep -Fq '>Ver ubicación</a>' invitacion_2.html

      - name: Commit y limpiar workflow temporal
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cambiar-texto-mapa-invitacion-2.yml
          git add invitacion_2.html
          git commit -m "Cambiar botón de mapa a Ver ubicación en invitacion 2"
          git push origin main
