name: Patch invitacion 1

on:
  push:
    paths:
      - '.github/workflows/patch-invitacion-1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Aplicar cambios solicitados
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('invitacion_1.html')
          text = path.read_text(encoding='utf-8')
          original = text

          # 1. "Nuestra Boda" un poco más pequeño.
          text = text.replace(
              'font-size:clamp(60px,17vw,118px);',
              'font-size:clamp(56px,16.2vw,112px);',
              1
          )

          # 2. Fecha correcta en la tarjeta principal.
          text = text.replace('<span>2026</span>', '<span>2027</span>', 1)

          # 3. Corregir la sección de la imagen de invitación que quedó abierta.
          marker = '\n\n<section class="reveal-section countdown-elegant-section">'
          if marker in text and '\n\n</section>\n\n<section class="reveal-section countdown-elegant-section">' not in text:
              text = text.replace(
                  marker,
                  '\n\n</section>\n\n<section class="reveal-section countdown-elegant-section">',
                  1
              )

          # 4. Ubicación.
          text = text.replace(
              '<div class="church-place-name">Casa Acapulco</div>',
              '<div class="church-place-name">Residencia Privada</div>',
              1
          )
          text = text.replace(
              '<p class="church-address">\n        Calle Acapulco 480\n      </p>',
              '<p class="church-address">\n        Calle Acapulco 480, La Molina\n      </p>',
              1
          )

          # 5. Video inicial: mantenerlo en reproducción y sin pantalla negra.
          text = text.replace(
              '<video id="sobreVideo" muted playsinline webkit-playsinline preload="auto" disablepictureinpicture controlslist="nodownload noplaybackrate nofullscreen">',
              '<video id="sobreVideo" muted loop playsinline webkit-playsinline preload="auto" disablepictureinpicture controlslist="nodownload noplaybackrate nofullscreen">',
              1
          )
          text = text.replace(
              '  video.playsInline = true;\n',
              '  video.playsInline = true;\n  video.loop = true;\n',
              1
          )

          # 6. Video principal de entrada: reiniciar antes de los frames negros finales.
          text = text.replace(
              '  const LOOP_END_MARGIN = 0.95;',
              '  const LOOP_END_MARGIN = 1.80;',
              1
          )

          # Refuerzo del loop del hero: comprueba el final con mayor frecuencia que timeupdate.
          loop_anchor = '''  heroVideo.addEventListener("timeupdate", () => {\n    const end = loopEnd();\n\n    if(end && heroVideo.currentTime >= end){\n      try{\n        heroVideo.currentTime = LOOP_START;\n      }catch(e){}\n      heroVideo.play().catch(() => {});\n    }\n  });\n'''
          loop_replacement = loop_anchor + '''\n  const heroLoopGuard = setInterval(() => {\n    if(document.hidden) return;\n    const end = loopEnd();\n    if(end && heroVideo.currentTime >= end){\n      try{\n        heroVideo.currentTime = LOOP_START;\n      }catch(e){}\n      heroVideo.play().catch(() => {});\n    }\n  }, 80);\n\n  heroVideo.addEventListener("emptied", () => clearInterval(heroLoopGuard), { once:true });\n'''
          if loop_anchor in text and 'const heroLoopGuard = setInterval' not in text:
              text = text.replace(loop_anchor, loop_replacement, 1)

          # Refuerzo por si el video del sobre llegara al final antes de la transición.
          intro_anchor = '''video.addEventListener("timeupdate", () => {\n  if(iniciado && videoIntroDisponible && video.currentTime >= 4.53){\n    activarTransicion();\n  }\n});\n'''
          intro_replacement = intro_anchor + '''\nvideo.addEventListener("ended", () => {\n  if(!transicion){\n    try{\n      video.currentTime = 0.001;\n    }catch(e){}\n    video.play().catch(() => {});\n  }\n});\n'''
          if intro_anchor in text and 'video.addEventListener("ended", () =>' not in text:
              text = text.replace(intro_anchor, intro_replacement, 1)

          # 7. Cronograma oficial.
          new_schedule = '''    <div class="schedule-timeline">\n\n      <div class="schedule-item">\n        <div class="schedule-time">03:00 p.m. – 04:00 p.m.</div>\n        <div class="schedule-dot">♥</div>\n        <div class="schedule-content">\n          <div class="schedule-icon">\n            <img src="https://raw.githubusercontent.com/avaldiviezoch/Wedding/main/ENTRADA.gif" alt="Recepción de invitados">\n          </div>\n          <h3>Recepción de invitados</h3>\n        </div>\n      </div>\n\n      <div class="schedule-item">\n        <div class="schedule-time">04:00 p.m. – 05:00 p.m.</div>\n        <div class="schedule-dot">♥</div>\n        <div class="schedule-content">\n          <div class="schedule-icon">\n            <img src="https://raw.githubusercontent.com/avaldiviezoch/Wedding/main/PAREJA.gif" alt="Ceremonia">\n          </div>\n          <h3>Ceremonia</h3>\n        </div>\n      </div>\n\n      <div class="schedule-item">\n        <div class="schedule-time">05:00 p.m. – 06:00 p.m.</div>\n        <div class="schedule-dot">♥</div>\n        <div class="schedule-content">\n          <div class="schedule-icon">\n            <img src="https://raw.githubusercontent.com/avaldiviezoch/Wedding/main/PAREJA.gif" alt="Fotos">\n          </div>\n          <h3>Fotos</h3>\n        </div>\n      </div>\n\n      <div class="schedule-item">\n        <div class="schedule-time">06:00 p.m. – 06:30 p.m.</div>\n        <div class="schedule-dot">♥</div>\n        <div class="schedule-content">\n          <div class="schedule-icon">\n            <img src="https://raw.githubusercontent.com/avaldiviezoch/Wedding/main/COPAS.gif" alt="Brindis">\n          </div>\n          <h3>Brindis</h3>\n        </div>\n      </div>\n\n      <div class="schedule-item">\n        <div class="schedule-time">06:30 p.m. – 07:30 p.m.</div>\n        <div class="schedule-dot">♥</div>\n        <div class="schedule-content">\n          <div class="schedule-icon">\n            <img src="https://raw.githubusercontent.com/avaldiviezoch/Wedding/main/PLATOS.gif" alt="Maridaje y banquete">\n          </div>\n          <h3>Maridaje &amp; Banquete</h3>\n        </div>\n      </div>\n\n      <div class="schedule-item">\n        <div class="schedule-time">07:30 p.m. – 08:00 p.m.</div>\n        <div class="schedule-dot">♥</div>\n        <div class="schedule-content">\n          <div class="schedule-icon">\n            <img src="https://raw.githubusercontent.com/avaldiviezoch/Wedding/main/BAILANDO.gif" alt="Primer baile de novios">\n          </div>\n          <h3>Primer baile de novios</h3>\n        </div>\n      </div>\n\n      <div class="schedule-item">\n        <div class="schedule-time">08:00 p.m. en adelante</div>\n        <div class="schedule-dot">♥</div>\n        <div class="schedule-content">\n          <div class="schedule-icon">\n            <img src="https://raw.githubusercontent.com/avaldiviezoch/Wedding/main/BAILANDO.gif" alt="Fiesta">\n          </div>\n          <h3>Fiesta</h3>\n        </div>\n      </div>\n\n    </div>'''

          schedule_pattern = re.compile(
              r'    <div class="schedule-timeline">.*?    </div>\n\n  </div>\n\n</section>',
              re.S
          )
          replacement = new_schedule + '\n\n  </div>\n\n</section>'
          text, n = schedule_pattern.subn(replacement, text, count=1)
          if n != 1:
              raise RuntimeError('No se pudo localizar de forma única el cronograma actual.')

          if text == original:
              raise RuntimeError('El parche no produjo cambios; se detiene para evitar un commit vacío.')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validar HTML básico
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          t = Path('invitacion_1.html').read_text(encoding='utf-8')
          assert t.count('<section') == t.count('</section>'), (t.count('<section'), t.count('</section>'))
          assert 'Residencia Privada' in t
          assert 'Calle Acapulco 480, La Molina' in t
          assert '03:00 p.m. – 04:00 p.m.' in t
          assert '08:00 p.m. en adelante' in t
          assert '<span>2027</span>' in t
          assert 'const LOOP_END_MARGIN = 1.80;' in t
          assert 'const heroLoopGuard = setInterval' in t
          print('Validación OK')
          PY

      - name: Commit del HTML y limpieza del workflow temporal
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-invitacion-1.yml
          git add invitacion_1.html
          git commit -m "Actualizar video, ubicación y cronograma de invitación 1"
          git push origin main
