name: Cache bust Auth Guard

on:
  push:
    branches: [main]
    paths:
      - 'app_integral/css/core/auth-guard.css'

permissions:
  contents: write
  pull-requests: write

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Actualizar version de auth-guard
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, time
          version = time.strftime('%Y%m%d%H%M%S')
          for name in ('applu.html', 'app_integral/applu.html'):
              p = Path(name)
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              text, n = re.subn(r'css/core/auth-guard\.css\?v=[^"\']+', f'css/core/auth-guard.css?v={version}', text)
              if n:
                  p.write_text(text, encoding='utf-8')
          PY
      - name: Crear Pull Request de cache bust
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then exit 0; fi
          BRANCH="automation/cache-bust-auth-guard-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add applu.html app_integral/applu.html
          git commit -m "Actualizar version del guard de autenticacion"
          git push --set-upstream origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "Automatización — Cache bust Auth Guard" --body "Actualiza las referencias de auth-guard después de un cambio en su fuente. Requiere Repository validation y revisión antes del merge."
