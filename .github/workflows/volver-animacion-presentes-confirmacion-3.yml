name: Volver animacion presentes confirmacion 3
on:
  push:
    paths:
      - '.github/workflows/volver-animacion-presentes-confirmacion-3.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar ajuste
        run: |
          echo ' n'''
if old_toggle not in s:
    raise SystemExit("No se encontró el bloque toggleRSVP esperado.")
s = s.replace(old_toggle, new_toggle, 1)

p.write_text(s, encoding="utf-8")
' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Validar
        run: |
          grep -q 'VOLVER_ANIMACION_PRESENTES_CONFIRMACION_3' invitacion_3.html
          grep -q 'id="rsvpBackToGif"' invitacion_3.html
          grep -q 'function resetRsvpToGif' invitacion_3.html
          grep -q '← Volver a la animación' invitacion_3.html
      - name: Commit y limpiar
        run: |
          rm .github/workflows/volver-animacion-presentes-confirmacion-3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add invitacion_3.html .github/workflows/volver-animacion-presentes-confirmacion-3.yml
          git commit -m "Permitir volver a animaciones en presentes y confirmación"
          git push
