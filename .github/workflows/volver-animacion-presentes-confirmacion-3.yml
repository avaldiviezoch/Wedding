name: Volver animacion presentes confirmacion 3
on:
  push:
    paths:
      - '.github/workflows/volver-animacion-presentes-confirmacion-3.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar ajuste
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('invitacion_3.html')
          s = p.read_text(encoding='utf-8')
          marker = 'VOLVER_ANIMACION_PRESENTES_CONFIRMACION_3'
          if marker in s:
              raise SystemExit('El ajuste ya existe; no duplicar.')

          old_gift = '<button class="gift-envelope-back" id="giftEnvelopeBack" type="button">Volver al sobre</button>'
          new_gift = '<button class="gift-envelope-back" id="giftEnvelopeBack" type="button">← Volver a la animación</button>'
          if old_gift not in s:
              raise SystemExit('No se encontró el regreso de Presentes.')
          s = s.replace(old_gift, new_gift, 1)

          old_success = '<p id="rsvp-success" class="rsvp-success-msg">Gracias, confirmación enviada ✨</p>'
          new_success = '''<p id="rsvp-success" class="rsvp-success-msg">Gracias, confirmación enviada ✨</p>
                    <button id="rsvpBackToGif" class="rsvp-back-to-gif" type="button">← Volver a la animación</button>'''
          if old_success not in s:
              raise SystemExit('No se encontró el mensaje de Confirmación.')
          s = s.replace(old_success, new_success, 1)

          css = '''
          /* VOLVER_ANIMACION_PRESENTES_CONFIRMACION_3 */
          .gift-envelope-back,
          .rsvp-back-to-gif{
            appearance:none;
            border:0;
            background:transparent;
            color:#1f5f9c;
            font-family:Georgia,"Times New Roman",serif;
            font-size:13px;
            line-height:1.35;
            cursor:pointer;
            padding:4px 2px;
            text-decoration:underline;
            text-underline-offset:4px;
            -webkit-tap-highlight-color:transparent;
          }
          .rsvp-back-to-gif{
            display:none;
            position:relative;
            z-index:8;
            width:max-content;
            max-width:calc(100% - 28px);
            margin:13px auto 0;
          }
          .rsvp-experience.show-form .rsvp-back-to-gif{display:block;}
          .rsvp-experience.show-form .rsvp-success-msg{
            position:relative;
            left:auto;
            bottom:auto;
            transform:none;
            width:min(calc(100% - 28px),430px);
            margin:12px auto 0;
          }
          '''
          if '</style>' not in s:
              raise SystemExit('No se encontró style.')
          s = s.replace('</style>', css + '\n</style>', 1)

          old_toggle = '''    function toggleRSVP(){
                openRsvpFromImage();
              }

              const rsvpStartLayer = document.getElementById('rsvpStartLayer');'''
          new_toggle = '''    function toggleRSVP(){
                openRsvpFromImage();
              }

              function resetRsvpToGif(){
                clearTimeout(rsvpRevealTimer);
                rsvpRevealTimer = null;
                rsvpStarted = false;
                attendanceValue = "";
                guestAmount = 1;

                const experience = document.getElementById('rsvpExperience');
                const gif = document.getElementById('rsvpPlayingGif');
                const panel = document.getElementById('rsvp-panel');
                const success = document.getElementById('rsvp-success');
                const guestWrap = document.getElementById('guest-count-wrap');
                const guestCounter = document.getElementById('guestCount');
                const guestName = document.getElementById('guestName');

                if(experience) experience.classList.remove('is-playing','show-form');
                if(panel){
                  panel.classList.remove('show');
                  panel.setAttribute('aria-hidden','true');
                }
                if(gif) gif.removeAttribute('src');
                if(success) success.style.display = 'none';
                if(guestWrap) guestWrap.classList.remove('show');
                if(guestCounter) guestCounter.textContent = '1';
                if(guestName) guestName.value = '';
                document.querySelectorAll('.rsvp-option-btn').forEach(btn => btn.classList.remove('active'));
                prepareRsvpPoster();
              }

              const rsvpBackToGif = document.getElementById('rsvpBackToGif');
              if(rsvpBackToGif){
                rsvpBackToGif.addEventListener('click', resetRsvpToGif);
              }

              const rsvpStartLayer = document.getElementById('rsvpStartLayer');'''
          if old_toggle not in s:
              raise SystemExit('No se encontró toggleRSVP.')
          s = s.replace(old_toggle, new_toggle, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validar
        run: |
          grep -q 'VOLVER_ANIMACION_PRESENTES_CONFIRMACION_3' invitacion_3.html
          grep -q 'id="rsvpBackToGif"' invitacion_3.html
          grep -q 'function resetRsvpToGif' invitacion_3.html
      - name: Commit y limpiar
        run: |
          rm .github/workflows/volver-animacion-presentes-confirmacion-3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add invitacion_3.html .github/workflows/volver-animacion-presentes-confirmacion-3.yml
          git commit -m "Permitir volver a animaciones en presentes y confirmación"
          git push
