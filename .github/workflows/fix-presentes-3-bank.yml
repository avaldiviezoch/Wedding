name: Ajustar fecha y halo invitacion 4
"on":
  push:
    paths:
      - '.github/triggers/fix-presentes-3-bank.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      CSS_B64: 
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar ajuste
        run: |
          python3 -c "import os,base64,re; from pathlib import Path; p=Path('invitacion_4.html'); s=p.read_text(encoding='utf-8'); s=re.sub(r'\n\s*/\* ===== AJUSTE_FECHA_HALO_4_20260813 ===== \*/.*?/\* ===== FIN_AJUSTE_FECHA_HALO_4_20260813 ===== \*/\s*','\n',s,flags=re.S); css=base64.b64decode(os.environ['CSS_B64']).decode(); s=s.replace('</style>',css+'\n</style>',1); p.write_text(s,encoding='utf-8')"
      - name: Validar
        run: |
          grep -q 'AJUSTE_FECHA_HALO_4_20260813' invitacion_4.html
          grep -q 'background:transparent !important' invitacion_4.html
          grep -q 'fechaLlegada4' invitacion_4.html
      - name: Commit
        run: |
          git config user.name 'avaldiviezoch'
          git config user.email '155109177+avaldiviezoch@users.noreply.github.com'
          git add invitacion_4.html
          git diff --cached --quiet || git commit -m 'Quitar fondo fecha mejorar halo y animacion invitacion 4'
          git push
