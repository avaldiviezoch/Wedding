name: Phase 3A isolated QA

on:
  push:
    branches:
      - perf/invitacion6-phase3a-legacy-timers

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/invitacion6-phase3a-legacy-timers
          fetch-depth: 0

      - name: Prepare isolated BASE and Playwright
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/phase3a-base 75784e5928e30badc18e430f5178a355f3c8d35c
          mkdir -p /tmp/phase3a-playwright
          cd /tmp/phase3a-playwright
          npm init -y >/dev/null
          npm install --no-save playwright@1.55.0 pngjs@7.0.0
          npx playwright install --with-deps chromium

      - name: Start immutable HEAD and BASE servers
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4174 --bind 127.0.0.1 > /tmp/head-http.log 2>&1 &
          (cd /tmp/phase3a-base && python3 -m http.server 4175 --bind 127.0.0.1 > /tmp/base-http.log 2>&1 &)
          sleep 2
          curl -fsS http://127.0.0.1:4174/invitaciones/invitacion_6/invitacion_5_base.html >/dev/null
          curl -fsS http://127.0.0.1:4175/invitaciones/invitacion_6/invitacion_5_base.html >/dev/null

      - name: Dynamic and visual timer QA
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/phase3a-playwright/qa.cjs <<'NODE'
          const { chromium } = require('/tmp/phase3a-playwright/node_modules/playwright');
          const { PNG } = require('/tmp/phase3a-playwright/node_modules/pngjs');
          const fs = require('fs');
          const PATH='/invitaciones/invitacion_6/invitacion_5_base.html';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));

          function classify(base,head){
            const B=new Set(base), H=new Set(head);
            return {
              BASE_ONLY:[...B].filter(x=>!H.has(x)),
              HEAD_ONLY:[...H].filter(x=>!B.has(x)),
              COMMON:[...B].filter(x=>H.has(x))
            };
          }

          async function functional(browser) {
            const ctx=await browser.newContext({viewport:{width:1366,height:768},reducedMotion:'reduce'});
            const page=await ctx.newPage();
            await page.addInitScript(() => {
              window.__qa={created:[],cleared:[],fired:{},next:1};
              const si=window.setInterval.bind(window), ci=window.clearInterval.bind(window);
              window.setInterval=(fn,delay,...args)=>{
                const qid=window.__qa.next++;
                const wrapped=(...cbargs)=>{window.__qa.fired[qid]=(window.__qa.fired[qid]||0)+1;return fn(...cbargs)};
                const native=si(wrapped,delay,...args);
                window.__qa.created.push({qid,native,delay,at:performance.now()});
                return native;
              };
              window.clearInterval=(id)=>{window.__qa.cleared.push({native:id,at:performance.now()});return ci(id)};
            });
            await page.goto('http://127.0.0.1:4174'+PATH,{waitUntil:'load'});
            await page.waitForSelector('#countdownOverlay',{state:'attached'});
            await page.waitForSelector('#fixedFrameCarousel',{state:'attached'});
            console.log('COUNTDOWN_OWNER_ATTACHED=true');
            console.log('CAROUSEL_OWNER_ATTACHED=true');
            console.log('DOT_SELECTOR=#fixedPhotoDots .fixed-photo-dot');
            await page.evaluate(()=>{window.__qaSavedDot=document.querySelector('#fixedPhotoDots .fixed-photo-dot')});

            await sleep(3400);
            const cConnected=await page.evaluate(()=>{
              const x=__qa.created.find(x=>x.delay===1000);
              return {x,ticks:x?(__qa.fired[x.qid]||0):0,clears:x?__qa.cleared.filter(c=>c.native===x.native).length:0,text:document.querySelector('#countdownOverlay')?.textContent||''};
            });
            console.log('COUNTDOWN_CONNECTED_TICKS='+cConnected.ticks);
            console.log('COUNTDOWN_CLEAR_WHILE_CONNECTED='+cConnected.clears);
            if(!cConnected.x||cConnected.ticks<3||cConnected.clears!==0||!cConnected.text.trim()) throw new Error('countdown connected assertion failed');
            const cBeforeRemove=cConnected.ticks;
            await page.evaluate(()=>document.querySelector('#countdownOverlay').remove());
            await sleep(3300);
            const cDisc=await page.evaluate((native)=>{
              const x=__qa.created.find(x=>x.native===native);
              const clears=__qa.cleared.filter(c=>c.native===native);
              return {ticks:__qa.fired[x.qid]||0,clears:clears.length,clearAt:clears[0]?.at||null};
            },cConnected.x.native);
            const cPost=cDisc.ticks-cBeforeRemove;
            console.log('COUNTDOWN_TICKS_AT_DISCONNECT='+cBeforeRemove);
            console.log('COUNTDOWN_CLEAR_OBSERVED='+(cDisc.clears>0));
            console.log('COUNTDOWN_POST_CLEAR_CALLBACKS='+Math.max(0,cPost-1));
            console.log('COUNTDOWN_LIVE_FINAL='+(cDisc.clears?0:1));
            if(cDisc.clears<1||Math.max(0,cPost-1)!==0) throw new Error('countdown disconnect assertion failed');

            const carBefore=await page.evaluate(()=>{const xs=__qa.created.filter(x=>x.delay===4300);return xs.reduce((n,x)=>n+(__qa.fired[x.qid]||0),0)});
            await sleep(4500);
            const carTicks=await page.evaluate(()=>{const xs=__qa.created.filter(x=>x.delay===4300);return xs.reduce((n,x)=>n+(__qa.fired[x.qid]||0),0)});
            console.log('CAROUSEL_CONNECTED_AUTO_TICKS='+(carTicks-carBefore));
            if(carTicks-carBefore<1) throw new Error('carousel connected tick missing');
            const dotResult=await page.evaluate(()=>{
              const dots=[...document.querySelectorAll('#fixedPhotoDots .fixed-photo-dot')];
              const before=__qa.created.filter(x=>x.delay===4300).length;
              if(dots.length<2) return {ok:false,count:dots.length,before,after:before};
              dots[0].click();
              return {ok:true,count:dots.length,before,after:__qa.created.filter(x=>x.delay===4300).length};
            });
            console.log('DOT_COUNT='+dotResult.count);
            console.log('CAROUSEL_DOT_CLICK_RESTART='+(dotResult.ok&&dotResult.after>dotResult.before));
            if(!dotResult.ok||dotResult.after<=dotResult.before) throw new Error('dot/restart assertion failed');
            const beforeRemove=await page.evaluate(()=>{const xs=__qa.created.filter(x=>x.delay===4300);const x=xs[xs.length-1];return {native:x.native,qid:x.qid,ticks:__qa.fired[x.qid]||0,created:xs.length}});
            await page.evaluate(()=>document.querySelector('#fixedFrameCarousel').remove());
            await sleep(5200);
            const afterRemove=await page.evaluate((b)=>({ticks:__qa.fired[b.qid]||0,clears:__qa.cleared.filter(c=>c.native===b.native).length,created:__qa.created.filter(x=>x.delay===4300).length}),beforeRemove);
            const carPost=afterRemove.ticks-beforeRemove.ticks;
            console.log('CAROUSEL_DISCONNECT_CLEAR='+(afterRemove.clears>0));
            console.log('CAROUSEL_POST_DISCONNECT_CALLBACKS='+Math.max(0,carPost-1));
            if(afterRemove.clears<1||Math.max(0,carPost-1)!==0) throw new Error('carousel disconnect assertion failed');
            const createdBeforeSaved=afterRemove.created;
            await page.evaluate(()=>window.__qaSavedDot?.dispatchEvent(new MouseEvent('click',{bubbles:true})));
            await sleep(100);
            const createdAfterSaved=await page.evaluate(()=>__qa.created.filter(x=>x.delay===4300).length);
            console.log('CAROUSEL_NEW_INTERVALS_AFTER_DISCONNECTED_RESTART='+(createdAfterSaved-createdBeforeSaved));
            if(createdAfterSaved-createdBeforeSaved!==0) throw new Error('carousel resurrected interval');
            await ctx.close();
          }

          async function capture(browser,label,port,w,h,out) {
            const ctx=await browser.newContext({viewport:{width:w,height:h},reducedMotion:'reduce'});
            const page=await ctx.newPage();
            const issues=[];
            page.on('console',m=>{if(m.type()==='error'||m.type()==='warning') issues.push(`console.${m.type()}:${m.text()}`)});
            page.on('pageerror',e=>issues.push(`pageerror:${e.message}`));
            page.on('requestfailed',r=>issues.push(`requestfailed:${r.url()}:${r.failure()?.errorText}`));
            await page.addInitScript(() => {
              const RealDate=Date, fixed=Date.parse('2026-08-28T20:00:00Z');
              class FixedDate extends RealDate { constructor(...a){super(...(a.length?a:[fixed]));} static now(){return fixed;} }
              FixedDate.parse=RealDate.parse; FixedDate.UTC=RealDate.UTC; window.Date=FixedDate;
            });
            await page.goto(`http://127.0.0.1:${port}${PATH}`,{waitUntil:'load'});
            await page.waitForSelector('#countdownOverlay',{state:'attached'});
            await page.waitForSelector('#fixedFrameCarousel',{state:'attached'});
            await sleep(1800);
            await page.screenshot({path:out,fullPage:true});
            console.log(`${label}_ISSUES=`+JSON.stringify(issues));
            await ctx.close();
            return issues;
          }

          function pixelDiff(a,b){
            const A=PNG.sync.read(fs.readFileSync(a)), B=PNG.sync.read(fs.readFileSync(b));
            if(A.width!==B.width||A.height!==B.height) return {widthA:A.width,heightA:A.height,widthB:B.width,heightB:B.height,differentPixels:null,percentage:null,bbox:null};
            let different=0,minX=A.width,minY=A.height,maxX=-1,maxY=-1;
            for(let y=0;y<A.height;y++) for(let x=0;x<A.width;x++){
              const i=(y*A.width+x)*4;
              let d=false; for(let c=0;c<4;c++) if(A.data[i+c]!==B.data[i+c]){d=true;break;}
              if(d){different++; if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y;}
            }
            return {width:A.width,height:A.height,differentPixels:different,percentage:(different/(A.width*A.height))*100,bbox:different?{minX,minY,maxX,maxY}:null};
          }

          (async()=>{
            const browser=await chromium.launch({headless:true});
            await functional(browser);
            const baseD=await capture(browser,'BASE_DESKTOP',4175,1366,768,'/tmp/base-desktop.png');
            const headD=await capture(browser,'HEAD_DESKTOP',4174,1366,768,'/tmp/head-desktop.png');
            const baseM=await capture(browser,'BASE_MOBILE',4175,390,844,'/tmp/base-mobile.png');
            const headM=await capture(browser,'HEAD_MOBILE',4174,390,844,'/tmp/head-mobile.png');
            console.log('DESKTOP_PIXEL_DIFF='+JSON.stringify(pixelDiff('/tmp/base-desktop.png','/tmp/head-desktop.png')));
            console.log('MOBILE_PIXEL_DIFF='+JSON.stringify(pixelDiff('/tmp/base-mobile.png','/tmp/head-mobile.png')));
            console.log('DESKTOP_ISSUE_CLASSIFICATION='+JSON.stringify(classify(baseD,headD)));
            console.log('MOBILE_ISSUE_CLASSIFICATION='+JSON.stringify(classify(baseM,headM)));
            const headOnly=[...new Set([...classify(baseD,headD).HEAD_ONLY,...classify(baseM,headM).HEAD_ONLY])];
            console.log('NEW_HEAD_ERRORS_ATTRIBUTABLE_TO_PHASE3A='+JSON.stringify(headOnly));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          cd /tmp/phase3a-playwright
          node qa.cjs
