name: Scan Invitados Legacy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scan-invitados.yml'
      - '.github/triggers/scan_invitados.py'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Escanear módulo invitados heredado
        run: python3 .github/triggers/scan_invitados.py
