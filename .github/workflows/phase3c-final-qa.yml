name: Phase 3C final QA

on:
  push:
    branches:
      - perf/invitacion6-phase3c-multimedia-loading

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/invitacion6-phase3c-multimedia-loading
          fetch-depth: 0

      - name: Repository tests
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
          pnpm install --frozen-lockfile
          pnpm test

      - name: Prepare immutable BASE and isolated browser
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/base cc371acee837aa0bf7ebe89189605907fcf2230d
          mkdir -p /tmp/pw && cd /tmp/pw
          npm init -y >/dev/null
          npm install --no-save playwright@1.55.0 pngjs@7.0.0
          npx playwright install --with-deps chromium
          cd "$GITHUB_WORKSPACE"
          python3 -m http.server 4174 --bind 127.0.0.1 >/tmp/head.log 2>&1 &
          (cd /tmp/base && python3 -m http.server 4175 --bind 127.0.0.1 >/tmp/base.log 2>&1 &)
          sleep 2

      - name: Measure, exercise and compare BASE vs HEAD
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/pw/qa.cjs <<'NODE'
          const {chromium}=require('/tmp/pw/node_modules/playwright');
          const {PNG}=require('/tmp/pw/node_modules/pngjs');
          const fs=require('fs');
          const P='/invitaciones/invitacion_6/index.html';
          const RAW_BROOK='raw.githubusercontent.com/avaldiviezoch/Wedding/main/invitaciones/invitacion_1/brook.gif';
          const sleep=m=>new Promise(r=>setTimeout(r,m));
          const norm=s=>String(s).replace(/http:\/\/127\.0\.0\.1:417[45]/g,'LOCAL');
          const uniq=a=>[...new Set(a.map(norm))].sort();
          async function waitDeep(p){await p.waitForFunction(()=>{try{let d=document.querySelector('#invite')?.contentDocument;d=d?.querySelector('#inviteFrame')?.contentDocument;d=d?.querySelector('#inv5')?.contentDocument;return !!d?.querySelector('#sat-inv6-program-timeline-section')}catch{return false}},null,{timeout:20000})}
          async function deep(p,fn,arg=null){return p.evaluate(({s,a})=>{let d=document.querySelector('#invite').contentDocument;d=d.querySelector('#inviteFrame').contentDocument;d=d.querySelector('#inv5').contentDocument;return(0,eval)(`(${s})`)(d,a)},{s:fn.toString(),a:arg})}
          function summary(rows){const h=rows.filter(x=>x.url.startsWith('http')),sum=a=>a.reduce((n,x)=>n+(x.bytes||0),0);return{requests:h.length,bytes:sum(h),audioBytes:sum(h.filter(x=>x.mime.startsWith('audio/'))),videoBytes:sum(h.filter(x=>x.mime.startsWith('video/'))),imageBytes:sum(h.filter(x=>x.type==='Image'||x.mime.startsWith('image/'))),bytes3s:sum(h.filter(x=>x.start<=3000)),bytes5s:sum(h.filter(x=>x.start<=5000)),audio:h.filter(x=>x.url.includes('sake_binks.mp3')).map(x=>({url:norm(x.url),bytes:x.bytes,start:Math.round(x.start),failed:x.failed,error:x.error||null})),videos:h.filter(x=>/video_(entrada|de_saludo_2)\.mp4/.test(x.url)).map(x=>({url:norm(x.url),bytes:x.bytes,start:Math.round(x.start),failed:x.failed,error:x.error||null})),brook:h.filter(x=>x.url.includes('brook.gif')).map(x=>({url:norm(x.url),bytes:x.bytes,start:Math.round(x.start),failed:x.failed,error:x.error||null}))};}
          async function measure(browser,port,w,h,label){const c=await browser.newContext({viewport:{width:w,height:h},serviceWorkers:'block',reducedMotion:'reduce'}),p=await c.newPage(),cdp=await c.newCDPSession(p),m=new Map(),issues=[];let t0=null;await cdp.send('Network.enable');cdp.on('Network.requestWillBeSent',e=>{if(t0===null)t0=e.timestamp;m.set(e.requestId,{url:e.request.url,start:(e.timestamp-t0)*1000,type:e.type,mime:'',bytes:0,failed:false})});cdp.on('Network.responseReceived',e=>{const x=m.get(e.requestId);if(x)x.mime=e.response.mimeType||''});cdp.on('Network.loadingFinished',e=>{const x=m.get(e.requestId);if(x)x.bytes=e.encodedDataLength||0});cdp.on('Network.loadingFailed',e=>{const x=m.get(e.requestId);if(x){x.failed=true;x.error=e.errorText}});p.on('console',x=>{if(['warning','error'].includes(x.type()))issues.push(`console.${x.type()}:${x.text()}`)});p.on('pageerror',e=>issues.push('pageerror:'+e.message));p.on('requestfailed',r=>issues.push(`requestfailed:${r.url()}:${r.failure()?.errorText}`));await p.goto(`http://127.0.0.1:${port}${P}`,{waitUntil:'load',timeout:60000});await waitDeep(p);await sleep(5200);const s=summary([...m.values()]);console.log(`MEASURE_${label}=`+JSON.stringify(s));console.log(`ISSUES_${label}=`+JSON.stringify(uniq(issues)));await c.close();return{s,issues:uniq(issues)}}
          async function reps(browser,port,w,h,prefix){const a=[];for(let i=1;i<=3;i++)a.push(await measure(browser,port,w,h,`${prefix}_${i}`));return a}
          function chooseBase(a){const full=a.filter(x=>x.s.brook.some(b=>b.url.includes(RAW_BROOK)&&b.bytes>9000000));return (full.length?full:a).sort((x,y)=>y.s.bytes-x.s.bytes)[0]}
          function chooseHead(a){return [...a].sort((x,y)=>x.s.bytes-y.s.bytes)[Math.floor(a.length/2)]}
          function classify(b,h){const A=new Set(uniq(b)),B=new Set(uniq(h));return{BASE_ONLY:[...A].filter(x=>!B.has(x)),HEAD_ONLY:[...B].filter(x=>!A.has(x)),COMMON:[...A].filter(x=>B.has(x))}}
          async function enter(p){await p.locator('#tapGuard').dispatchEvent('pointerup');await sleep(300);const media=await deep(p,d=>{const a=d.querySelector('#bgMusic'),v=d.querySelector('#entryVideo'),s=d.querySelector('#saludoVideo');return{audio:{exists:!!a,preload:a?.getAttribute('preload'),loop:a?.loop,paused:a?.paused,readyState:a?.readyState},entry:{exists:!!v,preload:v?.getAttribute('preload'),muted:v?.muted,playsinline:v?.hasAttribute('playsinline'),paused:v?.paused,readyState:v?.readyState},saludo:{exists:!!s,preload:s?.getAttribute('preload'),autoplay:s?.autoplay,muted:s?.muted,loop:s?.loop,playsinline:s?.hasAttribute('playsinline'),readyState:s?.readyState}}});console.log('MEDIA_AFTER_TAP='+JSON.stringify(media));if(!media.audio.exists||!media.entry.exists||!media.saludo.exists)throw Error('media nodes missing');await deep(p,d=>d.querySelector('#entryVideo').dispatchEvent(new Event('ended')));await sleep(1400);const st=await deep(p,d=>({mainHidden:d.querySelector('#mainInvitation')?.classList.contains('hidden'),entryHidden:d.querySelector('#entryScreen')?.classList.contains('hidden')}));if(st.mainHidden||!st.entryHidden)throw Error('entry reveal failed');return media}
          async function functional(browser,port,label){const c=await browser.newContext({viewport:{width:1366,height:768},serviceWorkers:'block',reducedMotion:'reduce'}),p=await c.newPage();await p.goto(`http://127.0.0.1:${port}${P}`,{waitUntil:'load'});await waitDeep(p);const media=await enter(p);const state=await deep(p,d=>({mainVisible:!d.querySelector('#mainInvitation')?.classList.contains('hidden'),countdown:[...d.querySelectorAll('[id*=countdown],[class*=countdown]')].map(x=>x.id||x.className).slice(0,20),carousel:[...d.querySelectorAll('[id*=Carousel],[id*=carousel],[class*=carousel]')].map(x=>x.id||x.className).slice(0,20),location:!!d.querySelector('#sat-inv6-green-location-exact'),collage:!!d.querySelector('#sat-inv6-photo-collage'),dress:!!d.querySelector('#dressCodeSection'),timeline:!!d.querySelector('#sat-inv6-program-timeline-section'),rsvp:!!d.querySelector('#rsvpSection'),gift:!!d.querySelector('#sat-inv6-gift-paper-wrap,#inv5GiftInRsvp'),music:!!d.querySelector('.sat-inv6-music-free-host,#musicSection'),faq:!!d.querySelector('.sat-inv6-faq-host,#faqSection'),closing:!!d.querySelector('#sat-inv6-final-thanks-section,#esperamosSection')}));for(const k of ['mainVisible','location','collage','dress','timeline','rsvp','gift','music','faq','closing'])if(!state[k])throw Error('missing '+k+' '+label);const faq=await deep(p,d=>{const q=d.querySelector('.sat-inv6-faq-q,details.faq-item summary');if(!q)return false;const item=q.closest('.sat-inv6-faq-item,details.faq-item');q.click();const open=item.classList.contains('is-open')||item.open===true;q.click();return open});if(!faq)throw Error('faq failed '+label);await deep(p,d=>{const e=d.querySelector('#sat-inv6-final-thanks-section,#esperamosSection');d.defaultView.scrollTo(0,Math.max(0,e.offsetTop-d.defaultView.innerHeight*.25))});await sleep(1800);const brook=await deep(p,d=>[...d.querySelectorAll('img')].filter(x=>(x.getAttribute('src')||'').includes('brook.gif')).map(x=>({src:x.getAttribute('src'),currentSrc:x.currentSrc,complete:x.complete,nw:x.naturalWidth,nh:x.naturalHeight,w:x.getBoundingClientRect().width,h:x.getBoundingClientRect().height})));console.log(`FUNCTIONAL_${label}=`+JSON.stringify({state,faq,media,brook}));if(!brook.some(x=>x.complete&&x.nw>0&&x.w>0&&x.h>0))throw Error('Brook render failed '+label);await c.close();return{state,media}}
          function diff(a,b){const A=PNG.sync.read(fs.readFileSync(a)),B=PNG.sync.read(fs.readFileSync(b));let n=0,minX=A.width,minY=A.height,maxX=-1,maxY=-1;if(A.width!==B.width||A.height!==B.height)return{sizeMismatch:true};for(let y=0;y<A.height;y++)for(let x=0;x<A.width;x++){let i=(y*A.width+x)*4,d=false;for(let q=0;q<4;q++)if(A.data[i+q]!==B.data[i+q]){d=true;break}if(d){n++;minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y)}}return{differentPixels:n,percentage:n/(A.width*A.height)*100,bbox:n?{minX,minY,maxX,maxY}:null}}
          async function shot(browser,port,w,h,zone,out){const c=await browser.newContext({viewport:{width:w,height:h},serviceWorkers:'block',reducedMotion:'reduce'}),p=await c.newPage();await p.addInitScript(()=>{const R=Date,f=Date.parse('2026-08-28T20:00:00Z');class D extends R{constructor(...a){super(...(a.length?a:[f]))}static now(){return f}}D.parse=R.parse;D.UTC=R.UTC;window.Date=D});await p.goto(`http://127.0.0.1:${port}${P}`,{waitUntil:'load'});await waitDeep(p);if(zone==='entry'){await p.evaluate(()=>document.querySelectorAll('video').forEach(v=>{try{v.pause();v.currentTime=.001}catch{}}));await sleep(450)}else{await enter(p);await deep(p,d=>d.querySelectorAll('video').forEach(v=>{try{v.pause()}catch{}}));const sel=zone==='first'?'#mainInvitation':zone==='mid'?'#sat-inv6-green-location-exact':'#sat-inv6-final-thanks-section,#esperamosSection';await deep(p,(d,s)=>{const e=d.querySelector(s);d.defaultView.scrollTo(0,Math.max(0,e.offsetTop-(s==='#mainInvitation'?0:d.defaultView.innerHeight*.25)));if(s.includes('final')){const st=d.createElement('style');st.textContent='.brook-final-gif,.sat-inv6-final-brook{visibility:hidden!important}';d.head.appendChild(st)}},sel);await sleep(zone==='final'?1800:1000)}await p.screenshot({path:out,animations:'disabled'});await c.close()}
          async function pixels(browser,w,h,tag){for(const z of ['entry','first','mid','final']){const a=`/tmp/b-${tag}-${z}.png`,c=`/tmp/h-${tag}-${z}.png`;await shot(browser,4175,w,h,z,a);await shot(browser,4174,w,h,z,c);const d=diff(a,c);console.log(`PIXEL_${tag.toUpperCase()}_${z.toUpperCase()}=`+JSON.stringify(d));if(d.sizeMismatch||d.differentPixels!==0)throw Error('pixel mismatch '+tag+' '+z)}}
          (async()=>{const b=await chromium.launch({headless:true});const BD=await reps(b,4175,1366,768,'BASE_DESKTOP'),HD=await reps(b,4174,1366,768,'HEAD_DESKTOP'),BM=await reps(b,4175,390,844,'BASE_MOBILE'),HM=await reps(b,4174,390,844,'HEAD_MOBILE');for(const [name,arr] of [['HEAD_DESKTOP',HD],['HEAD_MOBILE',HM]])for(const x of arr){if(x.s.brook.some(z=>z.url.includes(RAW_BROOK)))throw Error(name+' still requests raw Brook');const local=x.s.brook.filter(z=>z.url.includes('LOCAL/invitaciones/invitacion_6/brook.gif'));if(local.length!==1)throw Error(name+' expected exactly one local Brook request, got '+local.length)}const bd=chooseBase(BD),hd=chooseHead(HD),bm=chooseBase(BM),hm=chooseHead(HM);console.log('SELECTED_BASE_DESKTOP='+JSON.stringify(bd.s));console.log('SELECTED_HEAD_DESKTOP='+JSON.stringify(hd.s));console.log('SELECTED_BASE_MOBILE='+JSON.stringify(bm.s));console.log('SELECTED_HEAD_MOBILE='+JSON.stringify(hm.s));const sd=bd.s.bytes-hd.s.bytes,sm=bm.s.bytes-hm.s.bytes;console.log('SELECTED_SAVINGS_DESKTOP='+JSON.stringify({bytes:sd,percentage:sd/bd.s.bytes*100,requests:bd.s.requests-hd.s.requests}));console.log('SELECTED_SAVINGS_MOBILE='+JSON.stringify({bytes:sm,percentage:sm/bm.s.bytes*100,requests:bm.s.requests-hm.s.requests}));if(sd<9000000||sm<9000000)throw Error('expected Brook transfer saving not demonstrated');const cd=classify(bd.issues,hd.issues),cm=classify(bm.issues,hm.issues);console.log('ISSUE_CLASS_DESKTOP='+JSON.stringify(cd));console.log('ISSUE_CLASS_MOBILE='+JSON.stringify(cm));if(cd.HEAD_ONLY.length||cm.HEAD_ONLY.length)throw Error('HEAD_ONLY issues');const bf=await functional(b,4175,'BASE'),hf=await functional(b,4174,'HEAD');if(JSON.stringify(bf.state)!==JSON.stringify(hf.state)||JSON.stringify(bf.media)!==JSON.stringify(hf.media))throw Error('functional/media parity mismatch');await pixels(b,1366,768,'desktop');await pixels(b,390,844,'mobile');await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/pw/qa.cjs
