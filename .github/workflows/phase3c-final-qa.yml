name: Phase 3C final QA

on:
  push:
    branches:
      - perf/invitacion6-phase3c-multimedia-loading

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/invitacion6-phase3c-multimedia-loading
          fetch-depth: 0

      - name: Repository tests
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
          pnpm install --frozen-lockfile
          pnpm test

      - name: Prepare immutable BASE and isolated browser
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/phase3c-base cc371acee837aa0bf7ebe89189605907fcf2230d
          mkdir -p /tmp/phase3c-pw && cd /tmp/phase3c-pw
          npm init -y >/dev/null
          npm install --no-save playwright@1.55.0 pngjs@7.0.0
          npx playwright install --with-deps chromium
          cd "$GITHUB_WORKSPACE"
          python3 -m http.server 4174 --bind 127.0.0.1 >/tmp/head.log 2>&1 &
          (cd /tmp/phase3c-base && python3 -m http.server 4175 --bind 127.0.0.1 >/tmp/base.log 2>&1 &)
          sleep 2
          curl -fsS http://127.0.0.1:4174/invitaciones/invitacion_6/index.html >/dev/null
          curl -fsS http://127.0.0.1:4175/invitaciones/invitacion_6/index.html >/dev/null

      - name: Multimedia, functional, network and pixel QA
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/phase3c-pw/qa.cjs <<'NODE'
          const {chromium}=require('/tmp/phase3c-pw/node_modules/playwright');
          const {PNG}=require('/tmp/phase3c-pw/node_modules/pngjs');
          const fs=require('fs');
          const P='/invitaciones/invitacion_6/index.html';
          const TARGETS=['sake_binks.mp3','video_entrada.mp4','video_de_saludo_2.mp4','brook.gif','dress_code_6_2.gif','programacion_5.gif','fiesta_chopper_2.gif','regalo_2.gif','regalo_5_1.gif'];
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const normalize=s=>String(s).replace(/http:\/\/127\.0\.0\.1:417[45]/g,'LOCAL');
          const uniq=a=>[...new Set(a.map(normalize))].sort();
          const classify=(a,b)=>{const A=new Set(uniq(a)),B=new Set(uniq(b));return{BASE_ONLY:[...A].filter(x=>!B.has(x)),HEAD_ONLY:[...B].filter(x=>!A.has(x)),COMMON:[...A].filter(x=>B.has(x))};};
          async function waitDeep(p){await p.waitForFunction(()=>{try{let d=document.querySelector('#invite')?.contentDocument;d=d?.querySelector('#inviteFrame')?.contentDocument;d=d?.querySelector('#inv5')?.contentDocument;return !!d?.querySelector('#sat-inv6-program-timeline-section')}catch{return false}},null,{timeout:20000})}
          async function deep(p,fn,arg=null){return p.evaluate(({s,a})=>{let d=document.querySelector('#invite').contentDocument;d=d.querySelector('#inviteFrame').contentDocument;d=d.querySelector('#inv5').contentDocument;return(0,eval)(`(${s})`)(d,a)},{s:fn.toString(),a:arg})}
          async function enter(p){await p.locator('#tapGuard').dispatchEvent('pointerup');await sleep(250);const before=await deep(p,d=>{const v=d.querySelector('#entryVideo'),m=d.querySelector('#bgMusic');return{video:{exists:!!v,paused:v?.paused,muted:v?.muted,playsinline:v?.hasAttribute('playsinline'),preload:v?.getAttribute('preload'),readyState:v?.readyState},audio:{exists:!!m,paused:m?.paused,loop:m?.loop,preload:m?.getAttribute('preload'),readyState:m?.readyState}}});console.log('ENTRY_MEDIA_AFTER_TRUSTED_TAP='+JSON.stringify(before));if(!before.video.exists||!before.audio.exists)throw Error('entry media missing');await deep(p,d=>d.querySelector('#entryVideo').dispatchEvent(new Event('ended')));await sleep(1400);const after=await deep(p,d=>({mainHidden:d.querySelector('#mainInvitation')?.classList.contains('hidden'),entryHidden:d.querySelector('#entryScreen')?.classList.contains('hidden'),audioPaused:d.querySelector('#bgMusic')?.paused,audioReady:d.querySelector('#bgMusic')?.readyState}));console.log('ENTRY_AFTER_ENDED='+JSON.stringify(after));if(after.mainHidden||!after.entryHidden)throw Error('entry flow did not reveal invitation');return{before,after}}
          function summarize(rows){const sum=a=>a.reduce((n,x)=>n+(x.bytes||0),0),http=rows.filter(x=>x.url.startsWith('http'));const by=n=>http.filter(x=>x.url.includes(n));return{requests:http.length,bytes:sum(http),audioBytes:sum(http.filter(x=>x.mime.startsWith('audio/')||(x.type==='Media'&&/\.(mp3|wav|ogg)(\?|$)/i.test(x.url)))),videoBytes:sum(http.filter(x=>x.mime.startsWith('video/')||(x.type==='Media'&&/\.(mp4|webm|mov)(\?|$)/i.test(x.url)))),imageBytes:sum(http.filter(x=>x.type==='Image'||x.mime.startsWith('image/'))),requests3s:http.filter(x=>x.start<=3000).length,bytes3s:sum(http.filter(x=>x.start<=3000)),requests5s:http.filter(x=>x.start<=5000).length,bytes5s:sum(http.filter(x=>x.start<=5000)),targets:Object.fromEntries(TARGETS.map(n=>[n,by(n).map(x=>({url:normalize(x.url),start:Math.round(x.start),bytes:x.bytes,type:x.type,mime:x.mime,failed:x.failed,error:x.error||null}))]))};}
          async function measure(browser,label,port,w,h){const c=await browser.newContext({viewport:{width:w,height:h},serviceWorkers:'block',reducedMotion:'reduce'}),p=await c.newPage();const cdp=await c.newCDPSession(p);await cdp.send('Network.enable');let t0=null;const req=new Map(),issues=[];cdp.on('Network.requestWillBeSent',e=>{if(t0===null)t0=e.timestamp;req.set(e.requestId,{url:e.request.url,start:(e.timestamp-t0)*1000,type:e.type,bytes:0,mime:'',failed:false})});cdp.on('Network.responseReceived',e=>{const x=req.get(e.requestId);if(x)x.mime=e.response.mimeType||''});cdp.on('Network.loadingFinished',e=>{const x=req.get(e.requestId);if(x)x.bytes=e.encodedDataLength||0});cdp.on('Network.loadingFailed',e=>{const x=req.get(e.requestId);if(x){x.failed=true;x.error=e.errorText}});p.on('console',m=>{if(m.type()==='error'||m.type()==='warning')issues.push(`console.${m.type()}:${m.text()}`)});p.on('pageerror',e=>issues.push(`pageerror:${e.message}`));p.on('requestfailed',r=>issues.push(`requestfailed:${r.url()}:${r.failure()?.errorText}`));await p.goto(`http://127.0.0.1:${port}${P}`,{waitUntil:'load',timeout:60000});await waitDeep(p);await sleep(5200);const s=summarize([...req.values()]);console.log(`MEASURE_${label}=`+JSON.stringify(s));console.log(`ISSUES_${label}=`+JSON.stringify(uniq(issues)));await c.close();return{s,issues:uniq(issues)}}
          async function functional(browser,label,port){const c=await browser.newContext({viewport:{width:1366,height:768},serviceWorkers:'block',reducedMotion:'reduce'}),p=await c.newPage();const errs=[];p.on('pageerror',e=>errs.push(e.message));await p.goto(`http://127.0.0.1:${port}${P}`,{waitUntil:'load',timeout:60000});await waitDeep(p);const entry=await enter(p);const state=await deep(p,d=>({mainVisible:!d.querySelector('#mainInvitation')?.classList.contains('hidden'),countdownNodes:[...d.querySelectorAll('[id*=countdown],[class*=countdown]')].map(x=>x.id||x.className).slice(0,20),carouselNodes:[...d.querySelectorAll('[id*=Carousel],[id*=carousel],[class*=carousel]')].map(x=>x.id||x.className).slice(0,30),location:!!d.querySelector('#sat-inv6-green-location-exact'),collage:!!d.querySelector('#sat-inv6-photo-collage'),dress:!!d.querySelector('#dressCodeSection'),timeline:!!d.querySelector('#sat-inv6-program-timeline-section'),rsvp:!!d.querySelector('#rsvpSection'),gift:!!d.querySelector('#sat-inv6-gift-paper-wrap,#inv5GiftInRsvp'),music:!!d.querySelector('.sat-inv6-music-free-host,#musicSection'),faq:!!d.querySelector('.sat-inv6-faq-host,#faqSection'),closing:!!d.querySelector('#sat-inv6-final-thanks-section,#esperamosSection')}));for(const k of ['mainVisible','location','collage','dress','timeline','rsvp','gift','music','faq','closing'])if(!state[k])throw Error(`missing ${k} ${label}`);const faq=await deep(p,d=>{const b=d.querySelector('.sat-inv6-faq-q,details.faq-item summary');if(!b)return false;const i=b.closest('.sat-inv6-faq-item,details.faq-item');b.click();const open=i.classList.contains('is-open')||i.open===true;b.click();return open});if(!faq)throw Error('faq toggle failed '+label);await deep(p,d=>{const e=d.querySelector('#sat-inv6-final-thanks-section,#esperamosSection');d.defaultView.scrollTo(0,Math.max(0,e.offsetTop-d.defaultView.innerHeight*.3))});await sleep(1800);const brook=await deep(p,d=>{const imgs=[...d.querySelectorAll('img')].filter(x=>(x.getAttribute('src')||'').includes('brook.gif'));return imgs.map(x=>({src:x.getAttribute('src'),currentSrc:x.currentSrc,complete:x.complete,naturalWidth:x.naturalWidth,naturalHeight:x.naturalHeight,w:x.getBoundingClientRect().width,h:x.getBoundingClientRect().height,connected:x.isConnected,display:d.defaultView.getComputedStyle(x).display,visibility:d.defaultView.getComputedStyle(x).visibility}))});console.log(`FUNCTIONAL_${label}=`+JSON.stringify({...state,faqToggle:faq,entry,brook,pageErrors:errs}));if(!brook.some(x=>x.complete&&x.naturalWidth>0&&x.w>0&&x.h>0))throw Error('visible Brook invalid '+label);await c.close();return{state,brook}}
          function pd(a,b){const A=PNG.sync.read(fs.readFileSync(a)),B=PNG.sync.read(fs.readFileSync(b));if(A.width!==B.width||A.height!==B.height)return{sizeMismatch:true};let n=0,minX=A.width,minY=A.height,maxX=-1,maxY=-1;for(let y=0;y<A.height;y++)for(let x=0;x<A.width;x++){const i=(y*A.width+x)*4;let d=false;for(let q=0;q<4;q++)if(A.data[i+q]!==B.data[i+q]){d=true;break}if(d){n++;minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y)}}return{width:A.width,height:A.height,differentPixels:n,percentage:n/(A.width*A.height)*100,bbox:n?{minX,minY,maxX,maxY}:null}}
          async function shot(browser,port,w,h,zone,out){const c=await browser.newContext({viewport:{width:w,height:h},serviceWorkers:'block',reducedMotion:'reduce'}),p=await c.newPage();await p.addInitScript(()=>{const R=Date,f=Date.parse('2026-08-28T20:00:00Z');class D extends R{constructor(...a){super(...(a.length?a:[f]))}static now(){return f}}D.parse=R.parse;D.UTC=R.UTC;window.Date=D});await p.goto(`http://127.0.0.1:${port}${P}`,{waitUntil:'load',timeout:60000});await waitDeep(p);if(zone==='entry'){await p.evaluate(()=>document.querySelectorAll('video').forEach(v=>{try{v.pause();v.currentTime=.001}catch{}}));await deep(p,d=>d.querySelectorAll('video').forEach(v=>{try{v.pause()}catch{}}));await sleep(450)}else{await enter(p);await deep(p,d=>d.querySelectorAll('video').forEach(v=>{try{v.pause()}catch{}}));let sel=zone==='first'?'#mainInvitation':zone==='mid'?'#sat-inv6-green-location-exact':'#sat-inv6-final-thanks-section,#esperamosSection';await deep(p,(d,s)=>{const e=d.querySelector(s);d.defaultView.scrollTo(0,Math.max(0,e.offsetTop-(s==='#mainInvitation'?0:d.defaultView.innerHeight*.25)));if(s.includes('final')){const st=d.createElement('style');st.textContent='.brook-final-gif,.sat-inv6-final-brook{visibility:hidden!important}';d.head.appendChild(st)}},sel);await sleep(zone==='final'?1800:1000)}await p.screenshot({path:out,animations:'disabled'});await c.close()}
          async function visual(browser,w,h,tag){for(const zone of ['entry','first','mid','final']){const a=`/tmp/base-${tag}-${zone}.png`,b=`/tmp/head-${tag}-${zone}.png`;await shot(browser,4175,w,h,zone,a);await shot(browser,4174,w,h,zone,b);const d=pd(a,b);console.log(`PIXEL_${tag.toUpperCase()}_${zone.toUpperCase()}=`+JSON.stringify(d));if(d.sizeMismatch||d.differentPixels!==0)throw Error('pixel mismatch '+tag+' '+zone)}}
          (async()=>{const b=await chromium.launch({headless:true});const bd=await measure(b,'BASE_DESKTOP',4175,1366,768),hd=await measure(b,'HEAD_DESKTOP',4174,1366,768),bm=await measure(b,'BASE_MOBILE',4175,390,844),hm=await measure(b,'HEAD_MOBILE',4174,390,844);const cd=classify(bd.issues,hd.issues),cm=classify(bm.issues,hm.issues);console.log('ISSUE_CLASS_DESKTOP='+JSON.stringify(cd));console.log('ISSUE_CLASS_MOBILE='+JSON.stringify(cm));if(cd.HEAD_ONLY.length||cm.HEAD_ONLY.length)throw Error('HEAD_ONLY issues present');const sd=bd.s.bytes-hd.s.bytes,sm=bm.s.bytes-hm.s.bytes;console.log('SAVINGS_DESKTOP='+JSON.stringify({bytes:sd,percentage:sd/bd.s.bytes*100,requests:bd.s.requests-hd.s.requests}));console.log('SAVINGS_MOBILE='+JSON.stringify({bytes:sm,percentage:sm/bm.s.bytes*100,requests:bm.s.requests-hm.s.requests}));const raw='raw.githubusercontent.com/avaldiviezoch/Wedding/main/invitaciones/invitacion_1/brook.gif';const baseBrookD=bd.s.targets['brook.gif'],headBrookD=hd.s.targets['brook.gif'];console.log('BROOK_REQUESTS_BASE_DESKTOP='+JSON.stringify(baseBrookD));console.log('BROOK_REQUESTS_HEAD_DESKTOP='+JSON.stringify(headBrookD));if(!baseBrookD.some(x=>x.url.includes(raw)))throw Error('BASE raw Brook not observed');if(headBrookD.some(x=>x.url.includes(raw)))throw Error('HEAD still requests raw Brook');if(sd<=0||sm<=0)throw Error('no measurable transfer saving');const bf=await functional(b,'BASE',4175),hf=await functional(b,'HEAD',4174);if(JSON.stringify(bf.state)!==JSON.stringify(hf.state))throw Error('functional state mismatch');await visual(b,1366,768,'desktop');await visual(b,390,844,'mobile');await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/phase3c-pw/qa.cjs
