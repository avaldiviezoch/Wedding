name: Cambiar texto botón regalo invitacion 1
on:
  push:
    paths:
      - '.github/workflows/cambiar-boton-regalo-invitacion-1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cambiar texto del botón
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('invitacion_1.html')
          s = p.read_text(encoding='utf-8')
          old = 'VER DATOS PARA REGALO MONETARIO'
          new = 'OTRO TIPO DE REGALO'
          if old not in s:
              raise SystemExit('No se encontró el texto esperado')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validar
        run: |
          grep -q "OTRO TIPO DE REGALO" invitacion_1.html
          ! grep -q "VER DATOS PARA REGALO MONETARIO" invitacion_1.html
      - name: Commit y limpiar workflow temporal
        run: |
          rm .github/workflows/cambiar-boton-regalo-invitacion-1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add invitacion_1.html .github/workflows/cambiar-boton-regalo-invitacion-1.yml
          git commit -m "Cambiar botón de regalo en invitacion 1"
          git push
