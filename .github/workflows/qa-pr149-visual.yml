name: QA PR149 date runtime

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  qa:
    if: github.event.pull_request.number == 149
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout BASE
        uses: actions/checkout@v4
        with:
          ref: 4356e7dbcaa389c0f8f3efdf93415b8885626080
          path: qa/base
      - name: Checkout PR HEAD under test
        uses: actions/checkout@v4
        with:
          ref: 08e37d1c3c473ac54df105d4058e86dfa45394c1
          path: qa/head
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ephemeral Chromium
        run: |
          mkdir -p qa-run && cd qa-run
          npm init -y >/dev/null
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Serve BASE and PR in runner
        run: |
          python3 -m http.server 4173 --directory qa/base >/tmp/base-http.log 2>&1 &
          python3 -m http.server 4174 --directory qa/head >/tmp/head-http.log 2>&1 &
          sleep 2
      - name: Probe Friday Saturday lifecycle
        working-directory: qa-run
        run: |
          cat > date-probe.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true});
          const targets={base:'http://127.0.0.1:4173/invitaciones/invitacion_6/',pr:'http://127.0.0.1:4174/invitaciones/invitacion_6/'};
          const result={baseSha:'4356e7dbcaa389c0f8f3efdf93415b8885626080',prSha:'08e37d1c3c473ac54df105d4058e86dfa45394c1',targets:{}};
          for(const [kind,url] of Object.entries(targets)){
            const context=await browser.newContext({viewport:{width:1366,height:768}});
            const page=await context.newPage();
            await page.addInitScript(()=>{
              window.__qa250={scheduled:0,callbacks:0};
              const native=window.setInterval.bind(window);
              window.setInterval=(fn,ms,...args)=>{
                if(ms===250){
                  window.__qa250.scheduled++;
                  return native((...inner)=>{window.__qa250.callbacks++;return fn(...inner);},ms,...args);
                }
                return native(fn,ms,...args);
              };
            });
            const events={consoleError:[],consoleWarn:[],pageerror:[],requestfailed:[]};
            page.on('console',m=>{if(m.type()==='error')events.consoleError.push(m.text());if(m.type()==='warning')events.consoleWarn.push(m.text());});
            page.on('pageerror',e=>events.pageerror.push(String(e)));
            page.on('requestfailed',r=>events.requestfailed.push({url:r.url(),failure:r.failure()?.errorText||''}));
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
            const start=Date.now(),samples=[];
            const sample=async phase=>{
              const state=await page.evaluate(()=>{
                const d1=document.querySelector('#invite')?.contentDocument;
                const d2=d1?.querySelector('#inviteFrame')?.contentDocument;
                const d3=d2?.querySelector('#inv5')?.contentDocument;
                if(!d3?.body)return {ready:false,friday:0,saturday:0,nodes:[],qa250:window.__qa250};
                const walker=d3.createTreeWalker(d3.body,NodeFilter.SHOW_TEXT);let n;const nodes=[];
                while((n=walker.nextNode())){const v=n.nodeValue?.trim();if(v==='Viernes'||v==='Sábado')nodes.push({value:v,parent:n.parentElement?.outerHTML?.slice(0,500)||''});}
                return {ready:true,friday:nodes.filter(x=>x.value==='Viernes').length,saturday:nodes.filter(x=>x.value==='Sábado').length,nodes,qa250:{...window.__qa250}};
              });
              samples.push({ms:Date.now()-start,phase,...state});
            };
            for(let i=0;i<30;i++){await sample('pre-entry');await page.waitForTimeout(100);}
            await page.locator('#tapGuard').click({position:{x:20,y:20}}).catch(()=>{});
            await page.waitForTimeout(500);
            await page.evaluate(()=>{
              try{const d1=document.querySelector('#invite')?.contentDocument;const d2=d1?.querySelector('#inviteFrame')?.contentDocument;const d3=d2?.querySelector('#inv5')?.contentDocument;const v=d3?.getElementById('entryVideo');if(v){try{if(Number.isFinite(v.duration)&&v.duration>0)v.currentTime=Math.max(0,v.duration-.05);}catch(_){};v.dispatchEvent(new Event('ended'));}}catch(_){}
            });
            for(let i=0;i<90;i++){await sample('post-entry');await page.waitForTimeout(100);}
            const final=await page.evaluate(()=>({qa250:{...window.__qa250}}));
            result.targets[kind]={samples,final,events};
            await context.close();
          }
          fs.mkdirSync('date-artifacts',{recursive:true});
          fs.writeFileSync('date-artifacts/date-runtime.json',JSON.stringify(result,null,2));
          for(const [kind,v] of Object.entries(result.targets)){
            const transitions=[];let last='';
            for(const s of v.samples){const key=`${s.ready}:${s.friday}:${s.saturday}`;if(key!==last){transitions.push({ms:s.ms,phase:s.phase,ready:s.ready,friday:s.friday,saturday:s.saturday,qa250:s.qa250,nodes:s.nodes});last=key;}}
            fs.writeFileSync(`date-artifacts/${kind}-transitions.json`,JSON.stringify({transitions,final:v.final,events:v.events},null,2));
            console.log(kind,JSON.stringify({transitions:transitions.map(x=>({ms:x.ms,phase:x.phase,friday:x.friday,saturday:x.saturday,qa250:x.qa250})),final:v.final,errors:{consoleError:v.events.consoleError.length,pageerror:v.events.pageerror.length,requestfailed:v.events.requestfailed.length},warnings:v.events.consoleWarn.length}));
          }
          await browser.close();
          EOF
          node date-probe.mjs
      - name: Upload date QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr149-date-runtime-qa
          path: qa-run/date-artifacts
          if-no-files-found: error
          retention-days: 30
