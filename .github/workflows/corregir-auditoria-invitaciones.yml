name: Corregir auditoria invitaciones
"on":
  push:
    paths:
      - '.github/triggers/corregir-auditoria-invitaciones.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corregir invitaciones
        env:
          PATCH_B64: "      "
        run: python -c "import base64,os;exec(base64.b64decode(os.environ['PATCH_B64']))"
      - name: Validar cambios
        run: |
          ! grep -q '51999999999' invitacion_2.html
          ! grep -q '51999999999' invitacion_3.html
          grep -q '51993219142' invitacion_2.html
          grep -q '51993219142' invitacion_3.html
          grep -q 'nombre-itinerario">Fotos<' invitacion_4.html
          grep -q 'gift-copy-inline' invitacion_3.html
          grep -q 'gift-copy-inline-4' invitacion_4.html
      - name: Limpiar temporales
        run: |
          rm -f .github/workflows/corregir-auditoria-invitaciones.yml
          rm -f .github/triggers/corregir-auditoria-invitaciones.txt
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add invitacion_2.html invitacion_3.html invitacion_4.html .github/workflows/corregir-auditoria-invitaciones.yml .github/triggers/corregir-auditoria-invitaciones.txt
          git commit -m 'Corregir auditoria de invitaciones'
          git push