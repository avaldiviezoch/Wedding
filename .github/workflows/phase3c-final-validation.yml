name: Phase 3C corrected final validation

on:
  push:
    branches:
      - perf/invitacion6-phase3c-multimedia-loading

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/invitacion6-phase3c-multimedia-loading
          fetch-depth: 0
      - name: Repository tests
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
          pnpm install --frozen-lockfile
          pnpm test
      - name: Prepare BASE and browser
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/base cc371acee837aa0bf7ebe89189605907fcf2230d
          mkdir -p /tmp/pw && cd /tmp/pw
          npm init -y >/dev/null
          npm install --no-save playwright@1.55.0 pngjs@7.0.0
          npx playwright install --with-deps chromium
          cd "$GITHUB_WORKSPACE"
          python3 -m http.server 4174 --bind 127.0.0.1 >/tmp/head.log 2>&1 &
          (cd /tmp/base && python3 -m http.server 4175 --bind 127.0.0.1 >/tmp/base.log 2>&1 &)
          sleep 2
      - name: Functional network and visual parity
        run: |
          set -euo pipefail
          cat >/tmp/pw/qa.cjs <<'NODE'
          const {chromium}=require('/tmp/pw/node_modules/playwright');
          const {PNG}=require('/tmp/pw/node_modules/pngjs');
          const fs=require('fs');
          const P='/invitaciones/invitacion_6/index.html', RAW='raw.githubusercontent.com/avaldiviezoch/Wedding/main/invitaciones/invitacion_1/brook.gif';
          const sleep=m=>new Promise(r=>setTimeout(r,m));
          async function waitDeep(p){await p.waitForFunction(()=>{try{let d=document.querySelector('#invite')?.contentDocument;d=d?.querySelector('#inviteFrame')?.contentDocument;d=d?.querySelector('#inv5')?.contentDocument;return !!d?.querySelector('#sat-inv6-program-timeline-section')}catch{return false}},null,{timeout:20000})}
          async function deep(p,fn,arg=null){return p.evaluate(({s,a})=>{let d=document.querySelector('#invite').contentDocument;d=d.querySelector('#inviteFrame').contentDocument;d=d.querySelector('#inv5').contentDocument;return(0,eval)(`(${s})`)(d,a)},{s:fn.toString(),a:arg})}
          async function enter(p){await p.locator('#tapGuard').dispatchEvent('pointerup');await sleep(300);const m=await deep(p,d=>{const a=d.querySelector('#bgMusic'),v=d.querySelector('#entryVideo');return{audio:{exists:!!a,preload:a?.getAttribute('preload'),loop:a?.loop,paused:a?.paused,readyState:a?.readyState},entry:{exists:!!v,preload:v?.getAttribute('preload'),muted:v?.muted,playsinline:v?.hasAttribute('playsinline'),paused:v?.paused,readyState:v?.readyState}}});if(!m.audio.exists||!m.entry.exists)throw Error('critical media missing');await deep(p,d=>d.querySelector('#entryVideo').dispatchEvent(new Event('ended')));await sleep(1400);const s=await deep(p,d=>({mainHidden:d.querySelector('#mainInvitation')?.classList.contains('hidden'),entryHidden:d.querySelector('#entryScreen')?.classList.contains('hidden')}));if(s.mainHidden||!s.entryHidden)throw Error('entry reveal failed');return m}
          async function functional(b,port,label){const c=await b.newContext({viewport:{width:1366,height:768},serviceWorkers:'block',reducedMotion:'reduce'}),p=await c.newPage(),issues=[];p.on('console',x=>{if(['error','warning'].includes(x.type()))issues.push(`console.${x.type()}:${x.text()}`)});p.on('pageerror',e=>issues.push('pageerror:'+e.message));p.on('requestfailed',r=>issues.push(`requestfailed:${r.url()}:${r.failure()?.errorText}`));await p.goto(`http://127.0.0.1:${port}${P}`,{waitUntil:'load'});await waitDeep(p);const media=await enter(p);const state=await deep(p,d=>({mainVisible:!d.querySelector('#mainInvitation')?.classList.contains('hidden'),countdown:[...d.querySelectorAll('[id*=countdown],[class*=countdown]')].map(x=>x.id||x.className).slice(0,20),carousel:[...d.querySelectorAll('[id*=Carousel],[id*=carousel],[class*=carousel]')].map(x=>x.id||x.className).slice(0,20),location:!!d.querySelector('#sat-inv6-green-location-exact'),collage:!!d.querySelector('#sat-inv6-photo-collage'),dress:!!d.querySelector('#dressCodeSection'),timeline:!!d.querySelector('#sat-inv6-program-timeline-section'),rsvp:!!d.querySelector('#rsvpSection'),gift:!!d.querySelector('#sat-inv6-gift-paper-wrap,#inv5GiftInRsvp'),music:!!d.querySelector('.sat-inv6-music-free-host,#musicSection'),faq:!!d.querySelector('.sat-inv6-faq-host,#faqSection'),closing:!!d.querySelector('#sat-inv6-final-thanks-section,#esperamosSection')}));for(const k of ['mainVisible','location','collage','dress','timeline','rsvp','gift','music','faq','closing'])if(!state[k])throw Error('missing '+k+' '+label);const faq=await deep(p,d=>{const q=d.querySelector('.sat-inv6-faq-q,details.faq-item summary');if(!q)return false;const i=q.closest('.sat-inv6-faq-item,details.faq-item');q.click();const o=i.classList.contains('is-open')||i.open===true;q.click();return o});if(!faq)throw Error('faq failed');await deep(p,d=>{const e=d.querySelector('#sat-inv6-final-thanks-section,#esperamosSection');d.defaultView.scrollTo(0,Math.max(0,e.offsetTop-d.defaultView.innerHeight*.25))});await sleep(1800);const brook=await deep(p,d=>[...d.querySelectorAll('img')].filter(x=>(x.getAttribute('src')||'').includes('brook.gif')).map(x=>({src:x.getAttribute('src'),currentSrc:x.currentSrc,complete:x.complete,nw:x.naturalWidth,w:x.getBoundingClientRect().width,h:x.getBoundingClientRect().height})));if(!brook.some(x=>x.complete&&x.nw>0&&x.w>0&&x.h>0))throw Error('brook render failed');console.log('FUNCTIONAL_'+label+'='+JSON.stringify({state,media,faq,brook,issues:[...new Set(issues)].sort()}));await c.close();return{state,media,issues:[...new Set(issues)].sort()}}
          async function brookReq(b,port,label){const c=await b.newContext({viewport:{width:1366,height:768},serviceWorkers:'block'}),p=await c.newPage(),r=[];p.on('request',x=>{if(x.url().includes('brook.gif'))r.push(x.url())});await p.goto(`http://127.0.0.1:${port}${P}`,{waitUntil:'load'});await waitDeep(p);await sleep(5200);console.log('BROOK_'+label+'='+JSON.stringify(r));await c.close();return r}
          function pd(a,c){const A=PNG.sync.read(fs.readFileSync(a)),B=PNG.sync.read(fs.readFileSync(c));if(A.width!==B.width||A.height!==B.height)return{sizeMismatch:true};let n=0,minX=A.width,minY=A.height,maxX=-1,maxY=-1;for(let y=0;y<A.height;y++)for(let x=0;x<A.width;x++){let i=(y*A.width+x)*4,d=false;for(let q=0;q<4;q++)if(A.data[i+q]!==B.data[i+q]){d=true;break}if(d){n++;minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y)}}return{differentPixels:n,percentage:n/(A.width*A.height)*100,bbox:n?{minX,minY,maxX,maxY}:null}}
          async function shot(b,port,w,h,z,out){const c=await b.newContext({viewport:{width:w,height:h},serviceWorkers:'block',reducedMotion:'reduce'}),p=await c.newPage();await p.addInitScript(()=>{const R=Date,f=Date.parse('2026-08-28T20:00:00Z');class D extends R{constructor(...a){super(...(a.length?a:[f]))}static now(){return f}}D.parse=R.parse;D.UTC=R.UTC;window.Date=D});await p.goto(`http://127.0.0.1:${port}${P}`,{waitUntil:'load'});await waitDeep(p);if(z==='entry'){await p.evaluate(()=>document.querySelectorAll('video').forEach(v=>{try{v.pause();v.currentTime=.001}catch{}}));await sleep(450)}else{await enter(p);await deep(p,d=>d.querySelectorAll('video').forEach(v=>{try{v.pause()}catch{}}));const s=z==='first'?'#mainInvitation':z==='mid'?'#sat-inv6-green-location-exact':'#sat-inv6-final-thanks-section,#esperamosSection';await deep(p,(d,s)=>{const e=d.querySelector(s);d.defaultView.scrollTo(0,Math.max(0,e.offsetTop-(s==='#mainInvitation'?0:d.defaultView.innerHeight*.25)));if(s.includes('final')){const st=d.createElement('style');st.textContent='.brook-final-gif,.sat-inv6-final-brook{visibility:hidden!important}';d.head.appendChild(st)}},s);await sleep(z==='final'?1800:1000)}await p.screenshot({path:out,animations:'disabled'});await c.close()}
          async function pixels(b,w,h,t){for(const z of ['entry','first','mid','final']){const a=`/tmp/b-${t}-${z}.png`,c=`/tmp/h-${t}-${z}.png`;await shot(b,4175,w,h,z,a);await shot(b,4174,w,h,z,c);const d=pd(a,c);console.log(`PIXEL_${t.toUpperCase()}_${z.toUpperCase()}=`+JSON.stringify(d));if(d.sizeMismatch||d.differentPixels)throw Error('pixel mismatch '+t+' '+z)}}
          (async()=>{const b=await chromium.launch({headless:true});const br=await brookReq(b,4175,'BASE'),hr=await brookReq(b,4174,'HEAD');if(!br.some(x=>x.includes(RAW)))throw Error('base raw brook absent');if(hr.some(x=>x.includes(RAW)))throw Error('head raw brook present');const local=hr.filter(x=>x.includes('127.0.0.1:4174/invitaciones/invitacion_6/brook.gif'));if(local.length!==1)throw Error('head local Brook requests='+local.length);const bf=await functional(b,4175,'BASE'),hf=await functional(b,4174,'HEAD');if(JSON.stringify(bf.state)!==JSON.stringify(hf.state)||JSON.stringify(bf.media)!==JSON.stringify(hf.media))throw Error('functional/media parity mismatch');const norm=x=>x.replace(/127\.0\.0\.1:417[45]/g,'LOCAL');const B=new Set(bf.issues.map(norm)),H=new Set(hf.issues.map(norm)),headOnly=[...H].filter(x=>!B.has(x));console.log('HEAD_ONLY='+JSON.stringify(headOnly));if(headOnly.length)throw Error('HEAD_ONLY issues');await pixels(b,1366,768,'desktop');await pixels(b,390,844,'mobile');await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/pw/qa.cjs
