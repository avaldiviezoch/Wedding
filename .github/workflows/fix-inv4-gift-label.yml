name: Fix invitation 4 gift label

"on":
  push:
    paths:
      - .github/triggers/fix-inv4-gift-label.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix label
        run: |
          python3 -c "from pathlib import Path; p=Path('invitacion_4.html'); s=p.read_text(encoding='utf-8'); old='giftToggle.textContent = open ? \"Ocultar datos de regalo\" : \"Ver datos de regalo\";'; new='giftToggle.textContent = open ? \"Ocultar datos de regalo\" : \"Otro tipo de regalo\";'; assert old in s; p.write_text(s.replace(old,new,1),encoding='utf-8')"
      - name: Validate
        run: grep -q 'Ocultar datos de regalo.*Otro tipo de regalo' invitacion_4.html
      - name: Cleanup
        run: |
          rm -f .github/workflows/fix-inv4-gift-label.yml
          rm -f .github/triggers/fix-inv4-gift-label.txt
      - name: Commit
        run: |
          git config user.name avaldiviezoch
          git config user.email 155109177+avaldiviezoch@users.noreply.github.com
          git add -A
          git commit -m 'Corregir etiqueta dinamica de regalo en invitacion 4'
          git push
