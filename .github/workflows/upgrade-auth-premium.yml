name: Upgrade auth premium

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-auth-premium.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar diseño premium de acceso
        run: python3 .github/scripts/upgrade_auth_premium.py

      - name: Validar cambios
        run: |
          grep -q "auth-premium.css?v=20260814-1144-auth1" app_integral/applu.html
          grep -q "auth-premium.css?v=20260814-1144-auth1" applu.html
          grep -q "auth-google-icon" app_integral/applu.html
          grep -q "auth-google-icon" applu.html
          grep -q "Acceso rápido y seguro" app_integral/applu.html
          echo AUTH_PREMIUM_TESTS_OK

      - name: Guardar cambios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app_integral/applu.html applu.html
          if git diff --cached --quiet; then
            echo 'Sin cambios'
            exit 0
          fi
          git commit -m 'Mejorar diseño del acceso con Google'
          git push origin HEAD:main
