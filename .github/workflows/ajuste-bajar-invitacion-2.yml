name: Bajar texto invitacion 2

# trigger
on:
  push:
    paths:
      - '.github/workflows/ajuste-bajar-invitacion-2.yml'

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Bajar bloque de tripulacion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('invitacion_2.html')
          t=p.read_text(encoding='utf-8')
          old='''      .crew-message{\n        top:39%;\n        width:53%;\n        font-size:clamp(12px, 3.1vw, 16px);\n        line-height:1.48;\n      }'''
          new='''      .crew-message{\n        top:42%;\n        width:53%;\n        font-size:clamp(12px, 3.1vw, 16px);\n        line-height:1.48;\n      }'''
          if t.count(old)!=1:
              raise SystemExit('No se encontro exactamente una regla movil esperada')
          p.write_text(t.replace(old,new,1),encoding='utf-8')
          PY
      - name: Guardar cambio y limpiar workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ajuste-bajar-invitacion-2.yml
          git add invitacion_2.html
          git commit -m "Bajar texto de tripulacion en invitacion_2"
          git push origin main
