name: Ajuste fuerte tripulacion invitacion 2

on:
  push:
    paths:
      - '.github/workflows/patch-tripulacion-invitacion-2-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Subir mucho mas el texto de tripulacion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('invitacion_2.html')
          t = p.read_text(encoding='utf-8')
          old = '''    .crew-message{\n      position:absolute;\n      left:50%;\n      top:39.5%;'''
          new = '''    .crew-message{\n      position:absolute;\n      left:50%;\n      top:25%;'''
          if old not in t:
              raise SystemExit('No se encontro el bloque esperado')
          t = t.replace(old, new, 1)
          p.write_text(t, encoding='utf-8')
          PY

      - name: Validar
        run: |
          grep -q 'top:25%;' invitacion_2.html
          grep -q 'Toda gran aventura necesita una buena tripulación...' invitacion_2.html

      - name: Commit y limpieza
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-tripulacion-invitacion-2-v2.yml
          git add invitacion_2.html
          git commit -m "Subir mucho mas el texto de tripulacion en invitacion_2"
          git push origin main
