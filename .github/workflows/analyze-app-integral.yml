name: Analizar legacy app_integral

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/analyze-app-integral.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analizar script heredado grande
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          p=Path('app_integral/js/legacy/applu-script-01.js')
          s=p.read_text(encoding='utf-8')
          lines=s.splitlines()
          print('BYTES', len(s.encode('utf-8')))
          print('LINES', len(lines))
          longest=sorted(((len(x),i+1,x[:160]) for i,x in enumerate(lines)), reverse=True)[:15]
          print('LONGEST_LINES')
          for n,i,head in longest:
              print(i,n,repr(head))
          print('KEYWORDS')
          for kw in ['appludesktop','applumovil','srcdoc','iframe','base64','atob','btoa','Blob','innerHTML','template','desktop','movil','localStorage','sessionStorage']:
              hits=[i+1 for i,x in enumerate(lines) if kw.lower() in x.lower()]
              print(kw, hits[:30], 'count=',len(hits))
          print('DECLARATIONS')
          pat=re.compile(r'^\s*(?:const|let|var|function|async\s+function|class)\s+([A-Za-z_$][\w$]*)')
          for i,x in enumerate(lines,1):
              m=pat.match(x)
              if m:
                  print(i,m.group(1),len(x),repr(x[:180]))
          print('LARGE_ASSIGNMENTS')
          ap=re.compile(r'^\s*(?:const|let|var)\s+([A-Za-z_$][\w$]*)\s*=')
          for i,x in enumerate(lines,1):
              m=ap.match(x)
              if m and len(x)>10000:
                  print(i,m.group(1),len(x),repr(x[:180]))
          PY
