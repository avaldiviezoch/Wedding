name: Ajustar regreso RSVP 3
on:
  push:
    paths:
      - '.github/workflows/ajustar-regreso-rsvp-3.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar regreso
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('invitacion_3.html')
          s = p.read_text(encoding='utf-8')

          anchor = '.rsvp-experience.show-form .rsvp-back-to-gif{display:block;}'
          rule = '\n.rsvp-experience.show-form .rsvp-vintage-panel:not(.show){display:none;}\n'
          if rule.strip() not in s:
              if anchor not in s:
                  raise SystemExit('No se encontró el estilo RSVP.')
              s = s.replace(anchor, anchor + rule, 1)

          old = "      document.querySelectorAll('.rsvp-option-btn').forEach(btn => btn.classList.remove('active'));\n      prepareRsvpPoster();\n    }"
          new = "      document.querySelectorAll('.rsvp-option-btn').forEach(btn => btn.classList.remove('active'));\n    }"
          if old in s:
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Validar
        run: |
          grep -q 'rsvp-vintage-panel:not(.show)' invitacion_3.html
          grep -q 'function resetRsvpToGif' invitacion_3.html
      - name: Commit y limpiar
        run: |
          rm .github/workflows/ajustar-regreso-rsvp-3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add invitacion_3.html .github/workflows/ajustar-regreso-rsvp-3.yml
          git commit -m "Ajustar regreso al GIF en confirmación 3"
          git push
