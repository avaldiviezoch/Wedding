name: Reemplazar portada GIF invitacion 3
on:
  push:
    paths:
      - '.github/triggers/reemplazar-portada-gif-3.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reemplazar portada por GIF
        run: python .github/scripts/reemplazar-portada-gif-3.py
      - name: Validar
        run: |
          grep -q 'video_de_entrada_3.gif?v=20260812-1' invitacion_3.html
          grep -q 'id="animatedCoverGif"' invitacion_3.html
          grep -q 'PORTADA GIF INVITACION 3' invitacion_3.html
          if grep -q 'id="animatedCoverVideo"' invitacion_3.html; then exit 1; fi
      - name: Limpiar temporales
        run: |
          rm -f .github/scripts/reemplazar-portada-gif-3.py
          rm -f .github/workflows/reemplazar-portada-gif-3.yml
          rm -f .github/triggers/reemplazar-portada-gif-3.txt
      - name: Commit
        run: |
          git config user.name avaldiviezoch
          git config user.email 155109177+avaldiviezoch@users.noreply.github.com
          git add invitacion_3.html .github/scripts/reemplazar-portada-gif-3.py .github/workflows/reemplazar-portada-gif-3.yml .github/triggers/reemplazar-portada-gif-3.txt
          git commit -m 'Cambiar portada animada a video_de_entrada_3.gif'
          git push
