name: Congelar portada GIF 3

on:
  push:
    paths:
      - '.github/scripts/freeze_cover_gif3.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Pillow
        run: python -m pip install --quiet pillow
      - name: Aplicar ajuste
        run: python .github/scripts/freeze_cover_gif3.py
      - name: Validar
        run: |
          grep -q 'video_de_entrada_3_final.png' invitacion_3.html
          grep -q 'GIF_DURATION_MS' invitacion_3.html
          test -s video_de_entrada_3_final.png
      - name: Limpiar temporales
        run: |
          rm -f .github/scripts/freeze_cover_gif3.py
          rm -f .github/workflows/freeze-cover-gif3.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add invitacion_3.html video_de_entrada_3_final.png .github/scripts/freeze_cover_gif3.py .github/workflows/freeze-cover-gif3.yml
          git commit -m 'Reproducir portada GIF 3 una vez y congelar ultimo frame'
          git push
