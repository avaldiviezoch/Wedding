name: Corregir iconos específicos invitacion 1

on:
  push:
    paths:
      - '.github/workflows/corregir-iconos-especificos-invitacion-1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Corregir iconos por evento
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('invitacion_1.html')
          t = p.read_text(encoding='utf-8')

          pairs = [
            (
              '<img src="https://raw.githubusercontent.com/avaldiviezoch/Wedding/main/fotos_1.gif" alt="Ceremonia">',
              '<img src="https://raw.githubusercontent.com/avaldiviezoch/Wedding/main/PAREJA.gif" alt="Ceremonia">'
            ),
            (
              '<img src="https://raw.githubusercontent.com/avaldiviezoch/Wedding/main/PAREJA.gif" alt="Fotos">',
              '<img src="https://raw.githubusercontent.com/avaldiviezoch/Wedding/main/fotos_1.gif" alt="Fotos">'
            ),
            (
              '<img src="https://raw.githubusercontent.com/avaldiviezoch/Wedding/main/fiesta_1.gif" alt="Primer baile de novios">',
              '<img src="https://raw.githubusercontent.com/avaldiviezoch/Wedding/main/BAILANDO.gif" alt="Primer baile de novios">'
            ),
            (
              '<img src="https://raw.githubusercontent.com/avaldiviezoch/Wedding/main/BAILANDO.gif" alt="Fiesta">',
              '<img src="https://raw.githubusercontent.com/avaldiviezoch/Wedding/main/fiesta_1.gif" alt="Fiesta">'
            )
          ]

          for old, new in pairs:
              assert old in t, f'No se encontro: {old}'
              t = t.replace(old, new, 1)

          p.write_text(t, encoding='utf-8')
          PY

      - name: Validar iconos correctos
        shell: bash
        run: |
          grep -Fq 'Wedding/main/PAREJA.gif" alt="Ceremonia"' invitacion_1.html
          grep -Fq 'Wedding/main/fotos_1.gif" alt="Fotos"' invitacion_1.html
          grep -Fq 'Wedding/main/BAILANDO.gif" alt="Primer baile de novios"' invitacion_1.html
          grep -Fq 'Wedding/main/fiesta_1.gif" alt="Fiesta"' invitacion_1.html

      - name: Commit y limpiar workflow temporal
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/corregir-iconos-especificos-invitacion-1.yml
          git add invitacion_1.html
          git commit -m "Usar fotos_1 y fiesta_1 solo en sus eventos"
          git push origin main
