name: Ajustar texto invitacion 2

on:
  push:
    paths:
      - '.github/workflows/ajuste-invitacion-2.yml'

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Subir bloque de tripulación en móvil
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('invitacion_2.html')
          t = p.read_text(encoding='utf-8')
          old = '''      .crew-message{\n        top:45%;\n        width:53%;\n        font-size:clamp(12px, 3.1vw, 16px);\n        line-height:1.48;\n      }'''
          new = '''      .crew-message{\n        top:25%;\n        width:53%;\n        font-size:clamp(12px, 3.1vw, 16px);\n        line-height:1.48;\n      }'''
          if old not in t:
              raise SystemExit('No se encontró exactamente la regla móvil esperada; no se modifica nada.')
          if t.count(old) != 1:
              raise SystemExit('La regla móvil aparece más de una vez; se detiene por seguridad.')
          t = t.replace(old, new, 1)
          p.write_text(t, encoding='utf-8')
          PY

      - name: Validar texto y posición
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          t = Path('invitacion_2.html').read_text(encoding='utf-8')
          assert 'Toda gran aventura necesita una buena tripulación...' in t
          assert 'Y nos encantaría que formaras parte de la nuestra.' in t
          assert 'Ahora que ya conoces el rumbo, queremos contarte algunos detalles para que disfrutes este día tan especial junto a nosotros.' in t
          assert '.crew-message{\n        top:25%;\n        width:53%;' in t
          print('Validación OK')
          PY

      - name: Guardar solo el cambio final y eliminar workflow temporal
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ajuste-invitacion-2.yml
          git add invitacion_2.html
          git commit -m "Subir texto de tripulación en invitacion_2"
          git push origin main
