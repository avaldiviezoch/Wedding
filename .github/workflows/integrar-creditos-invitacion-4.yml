name: Integrar creditos invitacion 4
on:
  push:
    paths:
      - '.github/triggers/integrar-creditos-invitacion-4.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrar creditos y quitar calendario
        run: python .github/scripts/integrar_creditos_4.py
      - name: Validar
        run: |
          grep -q 'CREDITOS INTEGRADOS Y FECHA SIN ICONO' invitacion_4.html
          grep -q 'creditos-integrados' invitacion_4.html
          if grep -q '<footer class="creditos-finales"' invitacion_4.html; then exit 1; fi
          if grep -q '<div class="icono-calendario"' invitacion_4.html; then exit 1; fi
      - name: Limpiar temporales
        run: |
          rm -f .github/workflows/integrar-creditos-invitacion-4.yml
          rm -f .github/triggers/integrar-creditos-invitacion-4.txt
          rm -f .github/scripts/integrar_creditos_4.py
      - name: Commit
        run: |
          git config user.name avaldiviezoch
          git config user.email 155109177+avaldiviezoch@users.noreply.github.com
          git add invitacion_4.html .github/workflows/integrar-creditos-invitacion-4.yml .github/triggers/integrar-creditos-invitacion-4.txt .github/scripts/integrar_creditos_4.py
          git commit -m 'Integrar creditos y quitar icono calendario invitacion 4'
          git push
