name: Patch pelicano RSVP invitacion 2
on:
  push:
    paths:
      - '.github/triggers/patch-pelicano-rsvp-2.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar pelicano RSVP
        run: python .github/scripts/patch_pelicano_rsvp_2.py
      - name: Validar
        run: |
          grep -q 'confirmar%20invitacion_2.gif' invitacion_2.html
          grep -q 'Toca a nuestro mensajero para confirmar tu asistencia' invitacion_2.html
          grep -q 'PELICANO MENSAJERO RSVP' invitacion_2.html
          grep -q 'onclick="openRsvpFromImage()"' invitacion_2.html
      - name: Limpiar temporales
        run: |
          rm -f .github/scripts/patch_pelicano_rsvp_2.py
          rm -f .github/workflows/patch-pelicano-rsvp-2.yml
          rm -f .github/triggers/patch-pelicano-rsvp-2.txt
      - name: Commit
        run: |
          git config user.name avaldiviezoch
          git config user.email 155109177+avaldiviezoch@users.noreply.github.com
          git add invitacion_2.html .github/scripts/patch_pelicano_rsvp_2.py .github/workflows/patch-pelicano-rsvp-2.yml .github/triggers/patch-pelicano-rsvp-2.txt
          git commit -m 'Usar pelicano animado para confirmar asistencia en invitacion 2'
          git push
