name: Localizar recursos invitacion 1

"on":
  push:
    paths:
      - '.github/triggers/localizar-recursos-invitacion-1.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar recursos externos
        run: |
          set -e
          mkdir -p assets/invitacion_1
          curl -fL --retry 3 --retry-delay 2 'https://lh3.googleusercontent.com/d/19WfVkebSIW750jTpHIqOYME_E5_ekZ4p=w1600' -o assets/invitacion_1/invite_base_1.jpg
          curl -fL --retry 3 --retry-delay 2 'https://lh3.googleusercontent.com/d/1ev6oiga4uoc6JmluJrTEATrIHC82LVv7=w1600' -o assets/invitacion_1/historia_1.jpg
          curl -fL --retry 3 --retry-delay 2 'https://lh3.googleusercontent.com/d/1r2i5LNx2A5yd2xFl-_dfEuBhpYgQSPhX=w1600' -o assets/invitacion_1/historia_2.jpg
          curl -fL --retry 3 --retry-delay 2 'https://lh3.googleusercontent.com/d/1eoMeudALM1oexDh-pVRAduFCdcmVZNHX=w1600' -o assets/invitacion_1/historia_3.jpg
          curl -fL --retry 3 --retry-delay 2 'https://lh3.googleusercontent.com/d/1jWa43KStwxeLKzAZ9Q9QhONHX6s1HLoL=w1600' -o assets/invitacion_1/dresscode_bg_1.jpg

      - name: Validar imágenes descargadas
        run: |
          set -e
          for f in assets/invitacion_1/*.jpg; do
            test -s "$f"
            file "$f" | grep -Eiq 'JPEG|PNG|WebP|image data'
          done

      - name: Cambiar HTML a recursos locales
        run: python .github/scripts/localizar_recursos_invitacion_1.py

      - name: Validar HTML
        run: |
          set -e
          grep -q 'assets/invitacion_1/invite_base_1.jpg' invitacion_1.html
          grep -q 'assets/invitacion_1/historia_1.jpg' invitacion_1.html
          grep -q 'assets/invitacion_1/historia_2.jpg' invitacion_1.html
          grep -q 'assets/invitacion_1/historia_3.jpg' invitacion_1.html
          grep -q 'assets/invitacion_1/dresscode_bg_1.jpg' invitacion_1.html

      - name: Limpiar temporales
        run: |
          rm -f .github/workflows/localizar-recursos-invitacion-1.yml
          rm -f .github/triggers/localizar-recursos-invitacion-1.txt
          rm -f .github/scripts/localizar_recursos_invitacion_1.py

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add invitacion_1.html assets/invitacion_1 .github/workflows/localizar-recursos-invitacion-1.yml .github/triggers/localizar-recursos-invitacion-1.txt .github/scripts/localizar_recursos_invitacion_1.py
          git commit -m 'Localizar recursos críticos invitación 1'
          git push
