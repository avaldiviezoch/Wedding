name: Validar bodas compartidas

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/validate-app-integral-sharing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar JavaScript y archivos requeridos
        run: |
          set -e
          node --check app_integral/js/services/firebase.js
          node --check app_integral/js/modules/configuracion/weddings.js
          test -f app_integral/css/modules/weddings.css
          test -f app_integral/firebase/firestore.rules
          grep -q "listUserWeddings" app_integral/js/services/firebase.js
          grep -q "inviteWeddingMember" app_integral/js/services/firebase.js
          grep -q "weddings', activeWeddingId, 'cloudSync'" app_integral/js/services/firebase.js
          grep -q "Compartir boda" app_integral/js/modules/configuracion/weddings.js
          if grep -R -q "Tus datos se cargaron desde Firebase" app_integral; then
            echo "Regresó un aviso Firebase eliminado previamente" >&2
            exit 1
          fi
