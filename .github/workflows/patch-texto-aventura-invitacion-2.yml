name: Ajustar texto aventura invitacion 2

on:
  push:
    paths:
      - '.github/workflows/patch-texto-aventura-invitacion-2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Subir bloque de texto de tripulación
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('invitacion_2.html')
          text = path.read_text(encoding='utf-8')

          expected = '''    .crew-message{\n      position:absolute;\n      left:50%;\n      top:45%;'''
          replacement = '''    .crew-message{\n      position:absolute;\n      left:50%;\n      top:39.5%;'''

          if expected not in text:
              raise RuntimeError('No se encontró la posición actual esperada de .crew-message')

          text = text.replace(expected, replacement, 1)

          for phrase in [
              'Toda gran aventura necesita una buena tripulación...',
              'Y nos encantaría que formaras parte de la nuestra.',
              'Ahora que ya conoces el rumbo, queremos contarte algunos detalles para que disfrutes este día tan especial junto a nosotros.'
          ]:
              if phrase not in text:
                  raise RuntimeError(f'Falta el texto esperado: {phrase}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validar
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          t = Path('invitacion_2.html').read_text(encoding='utf-8')
          assert 'top:39.5%;' in t
          assert 'Toda gran aventura necesita una buena tripulación...' in t
          assert 'Y nos encantaría que formaras parte de la nuestra.' in t
          assert 'Ahora que ya conoces el rumbo, queremos contarte algunos detalles para que disfrutes este día tan especial junto a nosotros.' in t
          print('OK')
          PY

      - name: Commit y limpieza
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-texto-aventura-invitacion-2.yml
          git add invitacion_2.html
          git commit -m "Subir texto de tripulación en invitacion_2"
          git push origin main
