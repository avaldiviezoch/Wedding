name: Agregar FAQ invitacion 1
on:
  push:
    paths:
      - '.github/workflows/agregar-faq-invitacion-1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Agregar FAQ
        run: |
          python -c "import base64,pathlib;p=pathlib.Path('invitacion_1.html');s=p.read_text(encoding='utf-8');marker='FAQ INVITACION 1 — ESTILO VERDE OLIVA';assert marker not in s,'FAQ ya existe';css=base64.b64decode('').decode('utf-8');faq=base64.b64decode('').decode('utf-8');assert '</style>' in s and '<footer>' in s;s=s.replace('</style>',css+'\n</style>',1);s=s.replace('<footer>',faq+'\n<footer>',1);p.write_text(s,encoding='utf-8')"
      - name: Validar
        run: |
          grep -q "FAQ INVITACION 1 — ESTILO VERDE OLIVA" invitacion_1.html
          grep -q "¿La ceremonia y la recepción serán en el mismo lugar?" invitacion_1.html
          grep -q "¿Qué colores debemos evitar?" invitacion_1.html
          grep -q "¿Puedo hacer pedidos musicales durante la fiesta?" invitacion_1.html
          grep -q "51993219142" invitacion_1.html
      - name: Commit y limpiar workflow temporal
        run: |
          rm .github/workflows/agregar-faq-invitacion-1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add invitacion_1.html .github/workflows/agregar-faq-invitacion-1.yml
          git commit -m "Agregar preguntas frecuentes a invitación 1"
          git push
