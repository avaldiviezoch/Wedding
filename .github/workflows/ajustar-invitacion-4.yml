name: Fix invitation 4

"on":
  push:
    paths:
      - .github/triggers/ajustar-invitacion-4.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch HTML
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('invitacion_4.html')
          s = p.read_text(encoding='utf-8')

          pairs = [
            ('      background: #000;', '      background: var(--crema);'),
            ('            <span>Ver mapa</span>', '            <span>Ver ubicación</span>'),
            ('            Ver datos de regalo', '            Otro tipo de regalo')
          ]
          for old,new in pairs:
            if old not in s:
              raise SystemExit('missing: ' + old)
            s = s.replace(old,new,1)

          pattern = r'<div class="panel-interactivo datos-regalo" id="giftDetails" hidden>.*?<button class="boton-cerrar-panel" id="giftClose" type="button">Cerrar información</button>\s*</div>'
          replacement = '''<div class="panel-interactivo datos-regalo" id="giftDetails" hidden>
            <p>Si deseas acompañarnos con un detalle adicional, puedes hacerlo a través de cualquiera de estas opciones.</p>
            <p><strong>Banco:</strong> BCP</p>
            <p><strong>Número de cuenta:</strong> 19335282760050</p>
            <p><strong>CCI:</strong> 00219313528276005017</p>
            <p class="numero-yape"><strong>Yape:</strong> 993 219 142</p>
            <p>Los regalos físicos también serán recibidos con mucho cariño durante la recepción.</p>
            <button class="boton-cerrar-panel" id="giftClose" type="button">Cerrar información</button>
          </div>'''
          s2, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if count != 1:
            raise SystemExit('gift block regex missing')
          s = s2

          p.write_text(s,encoding='utf-8')
      - name: Validate
        run: |
          grep -q '19335282760050' invitacion_4.html
          grep -q '00219313528276005017' invitacion_4.html
          grep -q '993 219 142' invitacion_4.html
          grep -q 'Otro tipo de regalo' invitacion_4.html
          grep -q 'Ver ubicación' invitacion_4.html
      - name: Commit
        run: |
          git config user.name avaldiviezoch
          git config user.email 155109177+avaldiviezoch@users.noreply.github.com
          git add invitacion_4.html
          git commit -m 'Estandarizar datos y textos de invitacion 4'
          git push
