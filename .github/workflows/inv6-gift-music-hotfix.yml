name: Inv6 gift and music hotfix

on:
  push:
    branches:
      - fix/inv6-gift-music-20260827
    paths:
      - .github/workflows/inv6-gift-music-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/inv6-gift-music-20260827
          fetch-depth: 0

      - name: Apply surgical fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('invitaciones/invitacion_6/inv6_correcta_ultimos_gifs.js')
          text = path.read_text(encoding='utf-8')
          original = text

          gift_start = """\nconst giftHost=\n  doc.getElementById('inv5GiftInRsvp');\n\nif(giftHost){\n"""
          gift_end = """\n  giftHost.insertAdjacentElement('afterend',giftPaperWrap);\n}\n\n    const dressCodeSection=\n"""

          if text.count(gift_start) != 1:
              raise SystemExit(f'Expected exactly one duplicate gift generator start, found {text.count(gift_start)}')
          if text.count(gift_end) != 1:
              raise SystemExit(f'Expected exactly one duplicate gift generator end, found {text.count(gift_end)}')

          start = text.index(gift_start)
          end = text.index(gift_end, start) + len("\n  giftHost.insertAdjacentElement('afterend',giftPaperWrap);\n}\n")
          text = text[:start] + "\n" + text[end:]

          music_marker = """      #sat-inv6-program-timeline-section .sat-inv6-program-label{\n        font-size:12px!important\n      }\n\n\n    /* =====================================================\n       PEDIDOS MUSICALES — SIN FONDO BEIGE\n"""
          music_fixed = """      #sat-inv6-program-timeline-section .sat-inv6-program-label{\n        font-size:12px!important\n      }\n    }\n\n\n    /* =====================================================\n       PEDIDOS MUSICALES — SIN FONDO BEIGE\n"""

          if text.count(music_marker) != 1:
              raise SystemExit(f'Expected exactly one music breakpoint marker, found {text.count(music_marker)}')
          text = text.replace(music_marker, music_fixed, 1)

          if text == original:
              raise SystemExit('No changes were produced')
          if "giftHost.insertAdjacentElement('afterend',giftPaperWrap);" in text:
              raise SystemExit('Duplicate lower gift generator still exists')
          if text.count('PEDIDOS MUSICALES — SIN FONDO BEIGE') != 1:
              raise SystemExit('Unexpected music section count after patch')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: node --check invitaciones/invitacion_6/inv6_correcta_ultimos_gifs.js

      - name: Validate diff
        shell: bash
        run: |
          git diff --check
          git diff -- invitaciones/invitacion_6/inv6_correcta_ultimos_gifs.js

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/inv6-gift-music-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add invitaciones/invitacion_6/inv6_correcta_ultimos_gifs.js .github/workflows/inv6-gift-music-hotfix.yml
          git commit -m "fix(inv6): remove duplicate gift and restore music spacing"
          git push origin HEAD:fix/inv6-gift-music-20260827
