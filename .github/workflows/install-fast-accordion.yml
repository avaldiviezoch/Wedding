name: Instalar acordeones inmediatos

on:
  push:
    branches: [main]
    paths:
      - 'app_integral/js/core/accordion-fast.js'
      - '.github/workflows/install-fast-accordion.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Agregar accordion-fast antes del legacy
        shell: python
        run: |
          from pathlib import Path
          marker = '<script src="js/core/accordion-fast.js?v=20260816-1908-accordion1"></script>'
          anchor = '<script src="js/core/menu-fast.js'
          for name in ['applu.html', 'app_integral/applu.html']:
              p = Path(name)
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              if 'js/core/accordion-fast.js' in text:
                  continue
              pos = text.find(anchor)
              if pos < 0:
                  raise SystemExit(f'No se encontro el punto de insercion en {name}')
              text = text[:pos] + marker + '\n  ' + text[pos:]
              p.write_text(text, encoding='utf-8')
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add applu.html app_integral/applu.html
          git commit -m "Activar acordeones inmediatos en Mi Gran Dia"
          git push
