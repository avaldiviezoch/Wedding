name: Arreglar Dress Code invitacion 1
"on":
  push:
    paths:
      - '.github/triggers/arreglar-dresscode-1.txt'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar correccion
        run: python .github/scripts/arreglar_dresscode_1.py
      - name: Validar
        run: |
          grep -q 'assets/invitacion_1/dresscode_bg_1.jpg' invitacion_1.html
          grep -q 'class="dresscode-motion-gif" src="assets/invitacion_1/dres_code_movible_1.gif"' invitacion_1.html
          grep -q 'AJUSTE_GIF_DRESSCODE_1' invitacion_1.html
      - name: Limpiar temporales
        run: |
          rm -f .github/workflows/arreglar-dresscode-1.yml
          rm -f .github/triggers/arreglar-dresscode-1.txt
          rm -f .github/scripts/arreglar_dresscode_1.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add invitacion_1.html .github/workflows/arreglar-dresscode-1.yml .github/triggers/arreglar-dresscode-1.txt .github/scripts/arreglar_dresscode_1.py
          git commit -m 'Corregir posicion GIF Dress Code invitacion 1' || exit 0
          git push
