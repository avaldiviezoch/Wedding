name: Ajuste final invitacion 4
on:
  push:
    paths:
      - '.github/triggers/ajuste-final-invitacion-4.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar portada y creditos
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('invitacion_4.html')
          s=p.read_text(encoding='utf-8')

          # Quitar Brook del bloque de creditos.
          s,n=re.subn(r'\s*<img\s+class="creditos-brook".*?/>\s*', '\n', s, count=1, flags=re.S)
          if n!=1:
              raise SystemExit('No se encontro Brook en creditos')

          # Ajustes finales de portada + creditos. Se agregan al final para prevalecer.
          css='''
    /* ===== AJUSTE FINAL PORTADA Y CREDITOS — INVITACION 4 ===== */
    .textos-fecha{
      bottom:1.8% !important;
      width:min(82%,520px) !important;
    }
    .icono-calendario{
      width:27px !important;
      height:27px !important;
      margin:0 auto 7px !important;
    }
    .fecha-etiqueta{
      font-size:clamp(.58rem,2.25vw,.78rem) !important;
      letter-spacing:.14em !important;
      line-height:1.2 !important;
    }
    .fecha{
      margin-top:5px !important;
      font-size:clamp(1.55rem,6.4vw,2.75rem) !important;
      font-weight:500 !important;
      line-height:1 !important;
      letter-spacing:-.015em !important;
      white-space:nowrap !important;
    }
    .creditos-finales{
      padding:10px 16px 14px !important;
      min-height:0 !important;
      background:var(--crema) !important;
    }
    .creditos-texto{
      margin:0 !important;
      font-size:6.5px !important;
      line-height:1.25 !important;
      letter-spacing:.04em !important;
      opacity:.48 !important;
      text-transform:uppercase !important;
    }
    .creditos-brook{display:none !important;}
    @media(max-width:520px){
      .textos-fecha{bottom:1.5% !important;width:84% !important;}
      .fecha{font-size:clamp(1.48rem,6.15vw,2rem) !important;}
      .fecha-etiqueta{font-size:.57rem !important;}
      .creditos-finales{padding:8px 12px 12px !important;}
      .creditos-texto{font-size:6px !important;}
    }
'''
          marker='AJUSTE FINAL PORTADA Y CREDITOS — INVITACION 4'
          if marker not in s:
              s=s.replace('</style>',css+'\n  </style>',1)
          p.write_text(s,encoding='utf-8')
      - name: Validar
        run: |
          grep -q 'AJUSTE FINAL PORTADA Y CREDITOS' invitacion_4.html
          ! grep -q 'class="creditos-brook"' invitacion_4.html
          grep -q 'font-size:6.5px' invitacion_4.html
          grep -q 'bottom:1.8%' invitacion_4.html
      - name: Limpiar workflow y trigger
        run: |
          rm -f .github/workflows/ajuste-final-invitacion-4.yml
          rm -f .github/triggers/ajuste-final-invitacion-4.txt
      - name: Commit
        run: |
          git config user.name avaldiviezoch
          git config user.email 155109177+avaldiviezoch@users.noreply.github.com
          git add invitacion_4.html .github/workflows/ajuste-final-invitacion-4.yml .github/triggers/ajuste-final-invitacion-4.txt
          git commit -m 'Ajustar portada y creditos invitacion 4'
          git push
