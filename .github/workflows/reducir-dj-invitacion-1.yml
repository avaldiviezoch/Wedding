name: Reducir DJ invitacion 1
"on":
  push:
    paths:
      - '.github/workflows/reducir-dj-invitacion-1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reducir icono DJ a la mitad
        run: |
          python -c "from pathlib import Path; p=Path('invitacion_1.html'); s=p.read_text(encoding='utf-8'); s=s.replace('width:min(82%,330px);','width:min(41%,165px);',1).replace('width:min(88%,300px);','width:min(44%,150px);',1); p.write_text(s,encoding='utf-8')"
      - name: Validar
        run: |
          grep -q "width:min(41%,165px);" invitacion_1.html
          grep -q "width:min(44%,150px);" invitacion_1.html
      - name: Commit y limpiar workflow temporal
        run: |
          rm .github/workflows/reducir-dj-invitacion-1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add invitacion_1.html .github/workflows/reducir-dj-invitacion-1.yml
          git commit -m "Reducir icono DJ a la mitad en invitación 1"
          git push
