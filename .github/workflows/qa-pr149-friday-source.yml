name: QA PR149 late Friday source

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.number == 149
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout trigger branch for static scan
        uses: actions/checkout@v4
        with:
          ref: eaf064c8c9ce6c9bcc1f0068d576156f8d52918b
          path: qa/static

      - name: Static inventory Viernes Sabado
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('qa/static')
          terms=('Viernes','Sábado')
          text_ext={'.html','.htm','.js','.mjs','.cjs','.css','.json','.md','.txt','.xml','.yml','.yaml','.ts','.tsx','.jsx'}
          print('===== STATIC_DATE_LITERAL_INVENTORY =====')
          for p in sorted(root.rglob('*')):
              if not p.is_file() or '.git' in p.parts or (p.suffix.lower() not in text_ext and p.name not in {'CNAME'}):
                  continue
              try: lines=p.read_text(encoding='utf-8').splitlines()
              except Exception: continue
              for i,line in enumerate(lines,1):
                  if not any(t in line for t in terms): continue
                  rel=p.relative_to(root).as_posix()
                  ext=p.suffix.lower()
                  kind='JavaScript' if ext in {'.js','.mjs','.cjs','.ts','.tsx','.jsx'} else ('HTML' if ext in {'.html','.htm'} else 'text/template')
                  legacy=('invitacion_5' in rel or 'legacy' in line.lower() or 'inv5' in rel.lower())
                  visible=('HTML' if kind=='HTML' and '<script' not in line.lower() and '<style' not in line.lower() else 'NO/UNKNOWN')
                  lo=max(1,i-1); hi=min(len(lines),i+1)
                  ctx=' || '.join(f'{n}:{lines[n-1].strip()}' for n in range(lo,hi+1))
                  print(f'LITERAL|file={rel}|line={i}|kind={kind}|legacy={legacy}|visibleHtml={visible}|context={ctx}')
          print('===== END_STATIC =====')
          PY

      - name: Checkout BASE
        uses: actions/checkout@v4
        with:
          ref: 4356e7dbcaa389c0f8f3efdf93415b8885626080
          path: qa/base

      - name: Checkout PR functional HEAD
        uses: actions/checkout@v4
        with:
          ref: eaf064c8c9ce6c9bcc1f0068d576156f8d52918b
          path: qa/pr

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install ephemeral Chromium
        run: |
          mkdir -p qa-run && cd qa-run
          npm init -y >/dev/null
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Serve BASE and PR
        run: |
          python3 -m http.server 4173 --directory qa/base >/tmp/base-http.log 2>&1 &
          python3 -m http.server 4174 --directory qa/pr >/tmp/pr-http.log 2>&1 &
          sleep 2

      - name: Diagnose exact late writer
        working-directory: qa-run
        run: |
          cat > diagnose.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          const OUT=path.resolve('artifacts'); fs.mkdirSync(OUT,{recursive:true});
          const roots={base:path.resolve('../qa/base'),pr:path.resolve('../qa/pr')};
          const urls={base:'http://127.0.0.1:4173/invitaciones/invitacion_6/',pr:'http://127.0.0.1:4174/invitaciones/invitacion_6/'};
          const shas={base:'4356e7dbcaa389c0f8f3efdf93415b8885626080',pr:'eaf064c8c9ce6c9bcc1f0068d576156f8d52918b'};
          const names=['fecha_regresiva_2.png','marco_de_fotos_2.png','video_entrada.mp4','video_de_saludo_2.mp4','sake_binks.mp3'];
          const mime={'.png':'image/png','.mp4':'video/mp4','.mp3':'audio/mpeg'};
          const hash=p=>crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const rel=n=>'invitaciones/invitacion_6/'+n;
          const verified={};
          for(const kind of ['base','pr']){
            verified[kind]={};
            const html=fs.readFileSync(path.join(roots[kind],'invitaciones/invitacion_6/invitacion_6_base_final.html'),'utf8');
            for(const n of names){const p=path.join(roots[kind],rel(n)); verified[kind][n]=fs.existsSync(p)&&html.includes(`'${n}'`);}
          }
          for(const n of names){if(!verified.base[n]||!verified.pr[n])throw new Error('Unverified local asset '+n); if(hash(path.join(roots.base,rel(n)))!==hash(path.join(roots.pr,rel(n)))) throw new Error('BASE/PR asset differs '+n);}
          const browser=await chromium.launch({headless:true});

          function instrumentation(page){
            return page.addInitScript(()=>{
              const t0=performance.now();
              const events=[];
              const ids=new WeakMap(); let seq=0;
              const id=n=>{if(!n||typeof n!=='object')return null; if(!ids.has(n))ids.set(n,++seq); return ids.get(n)};
              const frameLabel=()=>{try{return {url:location.href,name:window.name||'',frameId:frameElement?.id||'',frameName:frameElement?.name||''}}catch(_){return {url:location.href,name:window.name||'',frameId:'cross?',frameName:'cross?'}}};
              const slim=n=>{try{return {id:id(n),nodeType:n?.nodeType,nodeName:n?.nodeName,isConnected:!!n?.isConnected,value:n?.nodeValue??null,text:n?.textContent?.slice?.(0,180)??null,parentId:id(n?.parentNode),parentName:n?.parentNode?.nodeName||null,outerHTML:n?.outerHTML?.slice?.(0,500)??null}}catch(e){return {err:String(e)}}};
              const relevant=v=>typeof v==='string'&&(v.includes('Viernes')||v.includes('Sábado'));
              const push=(type,data={})=>events.push({at:performance.now()-t0,type,frame:frameLabel(),...data});
              window.__lateFridayQA={t0,events,push,snapshot:()=>events.slice()};
              push('frame-init',{readyState:document.readyState});

              const np=Node.prototype;
              const nd=Object.getOwnPropertyDescriptor(np,'nodeValue');
              if(nd?.set&&nd?.get)Object.defineProperty(np,'nodeValue',{configurable:nd.configurable,enumerable:nd.enumerable,get:nd.get,set:function(v){const old=nd.get.call(this);if(relevant(old)||relevant(v))push('nodeValue-set',{oldValue:old,newValue:v,target:slim(this),stack:new Error('DATE_WRITE').stack});return nd.set.call(this,v)}});
              const td=Object.getOwnPropertyDescriptor(np,'textContent');
              if(td?.set&&td?.get)Object.defineProperty(np,'textContent',{configurable:td.configurable,enumerable:td.enumerable,get:td.get,set:function(v){const old=td.get.call(this);if(relevant(old)||relevant(v))push('textContent-set',{oldValue:old,newValue:v,target:slim(this),stack:new Error('DATE_WRITE').stack});return td.set.call(this,v)}});
              const ep=Element.prototype, ih=Object.getOwnPropertyDescriptor(ep,'innerHTML');
              if(ih?.set&&ih?.get)Object.defineProperty(ep,'innerHTML',{configurable:ih.configurable,enumerable:ih.enumerable,get:ih.get,set:function(v){const old=ih.get.call(this);if(relevant(old)||relevant(v))push('innerHTML-set',{oldValue:String(old).slice(0,500),newValue:String(v).slice(0,500),target:slim(this),stack:new Error('DATE_WRITE').stack});return ih.set.call(this,v)}});
              for(const m of ['appendChild','insertBefore','replaceChild']){const orig=np[m];if(typeof orig!=='function')continue;np[m]=function(...a){const candidate=a[0],txt=candidate?.textContent||'';if(relevant(txt))push(m,{candidate:slim(candidate),target:slim(this),stack:new Error('DATE_INSERT').stack});return orig.apply(this,a)}}
              const remove=np.removeChild; np.removeChild=function(n){const txt=n?.textContent||'';if(relevant(txt))push('removeChild',{candidate:slim(n),target:slim(this),stack:new Error('DATE_REMOVE').stack});return remove.call(this,n)};

              const attach=()=>{if(!document.documentElement)return false;const mo=new MutationObserver(ms=>{for(const m of ms){if(m.type==='characterData'){const nv=m.target.nodeValue||'';if(relevant(m.oldValue)||relevant(nv))push('mutation-characterData',{oldValue:m.oldValue,newValue:nv,target:slim(m.target)});}else if(m.type==='childList'){for(const n of m.removedNodes){if(relevant(n.textContent||''))push('mutation-remove',{target:slim(m.target),node:slim(n)});}for(const n of m.addedNodes){if(relevant(n.textContent||''))push('mutation-add',{target:slim(m.target),node:slim(n)});}}}});mo.observe(document.documentElement,{subtree:true,childList:true,characterData:true,characterDataOldValue:true});push('observer-attached',{root:slim(document.documentElement)});return true};
              if(!attach()){const s=setInterval(()=>{if(attach())clearInterval(s)},1)}
              document.addEventListener('DOMContentLoaded',()=>push('DOMContentLoaded'),{once:true}); window.addEventListener('load',()=>push('window-load'),{once:true});
            });
          }

          async function enter(page){
            await page.locator('#tapGuard').waitFor({state:'attached',timeout:15000});
            await page.locator('#tapGuard').click({position:{x:20,y:20}}).catch(()=>{});
            await page.waitForTimeout(700);
            await page.evaluate(()=>{try{const d1=document.querySelector('#invite')?.contentDocument,d2=d1?.querySelector('#inviteFrame')?.contentDocument,d3=d2?.querySelector('#inv5')?.contentDocument,v=d3?.getElementById('entryVideo');if(v){try{if(Number.isFinite(v.duration)&&v.duration>0)v.currentTime=Math.max(0,v.duration-.05)}catch(_){}v.dispatchEvent(new Event('ended'));}}catch(_){}});
          }

          async function run(kind){
            const c=await browser.newContext({viewport:{width:390,height:844},reducedMotion:'reduce'}),p=await c.newPage(); await instrumentation(p);
            const routed=[]; const net=[];
            await p.route('https://raw.githubusercontent.com/**',async r=>{const u=new URL(r.request().url()),parts=u.pathname.split('/').filter(Boolean).map(decodeURIComponent);const [owner,repo,ref,...rest]=parts,n=rest.at(-1);if(owner==='avaldiviezoch'&&repo==='Wedding'&&ref==='main'&&names.includes(n)&&verified[kind][n]){const local=path.join(roots[kind],rel(n));routed.push({at:Date.now(),url:r.request().url(),local:rel(n),mime:mime[path.extname(n)],hash:hash(local)});return r.fulfill({status:200,contentType:mime[path.extname(n)],body:fs.readFileSync(local),headers:{'access-control-allow-origin':'*','cache-control':'no-store'}})}return r.continue()});
            p.on('request',r=>{if(r.resourceType()==='script')net.push({type:'script-request',at:Date.now(),url:r.url()})});
            p.on('response',r=>{if(r.request().resourceType()==='script')net.push({type:'script-response',at:Date.now(),status:r.status(),url:r.url()})});
            p.on('framenavigated',f=>net.push({type:'frame-nav',at:Date.now(),url:f.url(),name:f.name()}));
            await p.goto(urls[kind],{waitUntil:'domcontentloaded',timeout:30000}); await enter(p); await p.waitForTimeout(3000);
            const frames=[];
            for(const f of p.frames()){
              try{const ev=await f.evaluate(()=>window.__lateFridayQA?.snapshot?.()||[]); if(ev.length)frames.push({url:f.url(),name:f.name(),events:ev});}catch(_){}
            }
            const deep=await p.evaluate(()=>{try{const d1=document.querySelector('#invite')?.contentDocument,d2=d1?.querySelector('#inviteFrame')?.contentDocument,d=d2?.querySelector('#inv5')?.contentDocument;if(!d)return null;const all=[...d.querySelectorAll('*')].filter(e=>['Viernes','Sábado'].includes((e.textContent||'').trim()));return all.slice(0,20).map(e=>({text:e.textContent.trim(),tag:e.tagName,id:e.id,cls:e.className,outerHTML:e.outerHTML.slice(0,800),isConnected:e.isConnected}))}catch(e){return {error:String(e)}}});
            const out={kind,sha:shas[kind],routed,net,frames,deep}; fs.writeFileSync(path.join(OUT,`${kind}.json`),JSON.stringify(out,null,2)); await c.close(); return out;
          }
          const results={base:await run('base'),pr:await run('pr')}; await browser.close(); fs.writeFileSync(path.join(OUT,'combined.json'),JSON.stringify(results,null,2));
          for(const [kind,r] of Object.entries(results)){
            console.log(`===== TIMELINE_${kind.toUpperCase()} =====`);
            for(const f of r.frames){for(const e of f.events.filter(e=>e.at<=3000&&(e.type.includes('mutation')||e.type.includes('set')||['appendChild','insertBefore','replaceChild','removeChild','frame-init','observer-attached','DOMContentLoaded','window-load'].includes(e.type)))){console.log(`TRACE|${kind}|${e.at.toFixed?.(3)??e.at}ms|${e.type}|frame=${e.frame?.frameId||e.frame?.name||''}|url=${e.frame?.url||f.url}|${JSON.stringify(e)}`)}}
            for(const n of r.net)console.log(`LOAD|${kind}|${n.type}|${n.status??''}|${n.url}`);
            console.log(`FINAL_DOM|${kind}|${JSON.stringify(r.deep)}`);
          }
          EOF
          node diagnose.mjs

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr149-late-friday-source
          path: qa-run/artifacts
          if-no-files-found: error
          retention-days: 30
