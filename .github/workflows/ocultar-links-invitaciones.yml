name: Inspeccionar accesos de invitaciones

on:
  push:

permissions:
  contents: read

jobs:
  inspeccionar:
    if: github.event.head_commit.message == 'Inspeccionar accesos de invitaciones'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Localizar referencias de invitaciones
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('applu.html')
          with path.open('r', encoding='utf-8', newline='') as f:
              text = f.read()

          patrones = [
              r'invitacion_1', r'invitacion_2', r'invitacion_3', r'invitacion_4',
              r'Invitación 1', r'Invitación 2', r'Invitación 3', r'Invitación 4',
              r'invitaciones', r'invitación'
          ]

          vistos = set()
          for patron in patrones:
              matches = list(re.finditer(patron, text, re.IGNORECASE))
              print(f'PATRON {patron!r}: {len(matches)} coincidencias')
              for n, m in enumerate(matches[:12], 1):
                  a = max(0, m.start() - 260)
                  b = min(len(text), m.end() + 360)
                  key = (a, b)
                  if key in vistos:
                      continue
                  vistos.add(key)
                  snippet = text[a:b].replace('\r', '\\r').replace('\n', '\\n')
                  print(f'--- {patron} #{n} ---')
                  print(snippet)
          PY
