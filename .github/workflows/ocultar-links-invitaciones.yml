name: Inspeccionar HTML de invitaciones

on:
  push:

permissions:
  contents: read

jobs:
  inspeccionar:
    if: github.event.head_commit.message == 'Inspeccionar HTML de invitaciones'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Decodificar módulo de invitaciones
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, base64

          with Path('applu.html').open('r', encoding='utf-8', newline='') as f:
              text = f.read()

          patron = re.compile(r'"invitaciones":\{"title":"Invitaciones","html":"([A-Za-z0-9+/=]+)"\}')
          blobs = patron.findall(text)
          print('Módulos embebidos encontrados:', len(blobs))
          if not blobs:
              raise RuntimeError('No se encontró el HTML embebido de Invitaciones')

          for idx, blob in enumerate(blobs, 1):
              html = base64.b64decode(blob).decode('utf-8')
              print(f'=== MODULO {idx} | {len(html)} caracteres ===')
              for n, line in enumerate(html.splitlines(), 1):
                  low = line.lower()
                  if ('href' in low or 'invitacion' in low or 'modelo' in low or 'plantilla' in low):
                      print(f'{n}: {line}')
          PY
