name: Ocultar enlaces de invitaciones

on:
  push:

permissions:
  contents: write

jobs:
  ocultar:
    if: github.event.head_commit.message == 'Reintentar ocultamiento de invitaciones'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Quitar enlaces públicos del módulo Invitaciones
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, base64

          path = Path('applu.html')
          with path.open('r', encoding='utf-8', newline='') as f:
              outer = f.read()

          patron = re.compile(r'("invitaciones":\{"title":"Invitaciones","html":")([A-Za-z0-9+/=]+)("\})')
          matches = list(patron.finditer(outer))
          if len(matches) != 1:
              raise RuntimeError(f'Se esperaba 1 módulo Invitaciones embebido y se encontraron {len(matches)}')

          m = matches[0]
          html = base64.b64decode(m.group(2)).decode('utf-8')
          urls = [
              'https://avaldiviezoch.github.io/Wedding/invitacion_1',
              'https://avaldiviezoch.github.io/Wedding/invitacion_2',
              'https://avaldiviezoch.github.io/Wedding/invitacion_3',
              'https://avaldiviezoch.github.io/Wedding/invitacion_4',
          ]

          ejemplo = f'<strong>{urls[0]}</strong>'
          if html.count(ejemplo) != 1:
              raise RuntimeError('No se encontró el ejemplo visible esperado')
          html = html.replace(ejemplo, '<strong>Enlaces temporalmente ocultos</strong>', 1)

          placeholder = f'placeholder="{urls[0]}"'
          if html.count(placeholder) != 1:
              raise RuntimeError('No se encontró el placeholder esperado')
          html = html.replace(placeholder, 'placeholder="Enlace temporalmente oculto"', 1)

          for i, url in enumerate(urls, 1):
              literal = f"'{url}'"
              if html.count(literal) != 1:
                  raise RuntimeError(f'URL predeterminada {i} no encontrada exactamente una vez')
              html = html.replace(literal, "''", 1)

          html = html.replace(
              'Se restaurarán las cuatro invitaciones y sus enlaces oficiales. ¿Continuar?',
              'Se restaurará la configuración inicial de las cuatro invitaciones. ¿Continuar?',
              1
          )

          for url in urls:
              if url in html:
                  raise RuntimeError(f'Todavía quedó una URL oficial: {url}')

          nuevo_blob = base64.b64encode(html.encode('utf-8')).decode('ascii')
          outer = outer[:m.start(2)] + nuevo_blob + outer[m.end(2):]

          check = patron.search(outer)
          if not check:
              raise RuntimeError('El módulo dejó de ser reconocible')
          validado = base64.b64decode(check.group(2)).decode('utf-8')
          if 'Invitaciones' not in validado or 'Modelos configurados' not in validado:
              raise RuntimeError('La estructura del módulo no se conservó')
          if any(url in validado for url in urls):
              raise RuntimeError('La validación detectó una URL oficial restante')

          with path.open('w', encoding='utf-8', newline='') as f:
              f.write(outer)
          print('Validación OK')
          PY

      - name: Guardar cambio
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ocultar-links-invitaciones.yml
          git add applu.html
          git commit -m "Ocultar temporalmente enlaces de las 4 invitaciones"
          git push origin main
